  const [textInput, setTextInput] = useState('');
  const [parsed, setParsed] = useState([]);
  const [slot, setSlot] = useState(initialSlot || guessMealSlot());
  // Datum: wenn initialDate gesetzt (z.B. zukünftiger Tag), dieses verwenden
  const [entryDate, setEntryDate] = useState(initialDate || todayKey());
  const [dateOffset, setDateOffset] = useState(0); // für Sprach-Erkennung "gestern"
  const [listening, setListening] = useState(false);
  const [searchResults, setSearchResults] = useState([]);
  const [micError, setMicError] = useState(null);
  const [savingDish, setSavingDish] = useState(false);
  const [dishName, setDishName] = useState('');
  const [dishSearch, setDishSearch] = useState('');
  const [scanningBarcode, setScanningBarcode] = useState(false);
  const [barcodeStatus, setBarcodeStatus] = useState(null);
  // Foto-Analyse
  const [photoAnalyzing, setPhotoAnalyzing] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoItems, setPhotoItems] = useState([]); // erkannte Zutaten, separat editierbar
  const photoInputRef = useRef(null);
  const recognitionRef = useRef(null);

  const [showCamera, setShowCamera] = useState(false);
  const [cropImageUrl, setCropImageUrl] = useState(null); // zeigt Cropper

  const handlePhotoBase64 = async (base64, mediaType) => {
    setShowCamera(false);
    setPhotoError(null);
    setPhotoAnalyzing(true);
    setPhotoPreview(true); // zeigt Lade-Zustand
    try {
      const results = await analyzePhoto(base64, mediaType, apiKey);
      if (!Array.isArray(results) || results.length === 0) {
        setPhotoError('Keine Lebensmittel erkannt. Versuche ein klareres Foto.');
        return;
      }
      const newItems = results.map(r => ({
        foodName: r.name || 'Unbekannt',
        qty: r.qty || 100,
        unit: r.unit || 'g',
        kcalPer100g: r.kcalPer100g || 0,
        protein: r.protein || 0,
        carbs: r.carbs || 0,
        fat: r.fat || 0,
      }));
      setPhotoItems(prev => [...prev, ...newItems]);
    } catch (err) {
      setPhotoError('Fehler: ' + (err.message || 'Unbekannt'));
    } finally {
      setPhotoAnalyzing(false);
      setPhotoPreview(null);
      if (photoInputRef.current) photoInputRef.current.value = '';
    }
  };

  const handleCameraCapture = (base64, mediaType) => {
    setShowCamera(false);
    // Erst Cropper zeigen
    setCropImageUrl('data:' + mediaType + ';base64,' + base64);
  };

  const handleGallerySelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!apiKey) { setPhotoError('Für die Foto-Analyse brauchst du einen API-Key (Mehr → API-Key).'); return; }
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => resolve(ev.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    setCropImageUrl(dataUrl);
    if (photoInputRef.current) photoInputRef.current.value = '';
  };

  const handleBarcodeResult = async (code) => {
    setScanningBarcode(false);
    setBarcodeStatus({ loading: true, code });
    const result = await lookupOpenFoodFactsByBarcode(code);
    if (result) {
      setParsed(prev => [...prev, {
        foodId: null,
        foodName: result.brand ? `${result.name} (${result.brand})` : result.name,
        qty: 100,
        unit: 'g',
        kcalPer100g: result.kcalPer100g,
        protein: result.protein || 0,
        carbs: result.carbs || 0,
        fat: result.fat || 0,
        units: { g: 1 },
        isNew: true,
        lookupSource: result.source,
      }]);
      setBarcodeStatus({ ok: true, code, name: result.name });
      setTimeout(() => setBarcodeStatus(null), 2500);
    } else {
      setBarcodeStatus({ error: true, code });
      setTimeout(() => setBarcodeStatus(null), 4000);
    }
  };

  // Beim Modus-Wechsel: Eingabefeld zurücksetzen
  const setMode = (newMode) => {
    setModeRaw(newMode);
    setTextInput('');
    setMicError(null);
    setDishSearch('');
    setPhotoError(null);
    setPhotoPreview(null);
    if (newMode !== 'photo') setPhotoItems([]);
    if (newMode === 'text') {
      setSearchResults([...glossary].sort((a, b) => a.name.localeCompare(b.name, 'de')));
    } else {
      setSearchResults([]);
    }
  };

  // Beim Initial-Render: wenn Text-Modus, volle Glossar-Liste anzeigen
  useEffect(() => {
    if (mode === 'text' && searchResults.length === 0 && !textInput) {
      setSearchResults([...glossary].sort((a, b) => a.name.localeCompare(b.name, 'de')));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Wenn ein Gericht reingereicht wird, in Vorschau übernehmen
  useEffect(() => {
    if (pendingDishItems && pendingDishItems.length) {
      const items = pendingDishItems.map(it => {
        const food = glossary.find(g => g.id === it.foodId);
        if (food) {
          return {
            foodId: food.id,
            foodName: food.name,
            qty: it.qty,
            unit: it.unit in food.units ? it.unit : Object.keys(food.units)[0],
            kcalPer100g: food.kcalPer100g,
            protein: food.protein || 0,
            carbs: food.carbs || 0,
            fat: food.fat || 0,
            units: food.units,
            isNew: false,
          };
        }
        return null;
      }).filter(Boolean);
      setParsed(items);
      onClearPending && onClearPending();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingDishItems]);

  // Wenn aus Today-Screen direkt mit Mikro gestartet
  useEffect(() => {
    if (initialMode === 'speech') {
      // kurz warten, damit UI gerendert ist
      const t = setTimeout(() => startSpeech(), 300);
      return () => clearTimeout(t);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const startSpeech = () => {
    setMicError(null);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMicError('Spracherkennung nicht verfügbar. Auf Android: nutze Chrome.');
      return;
    }
    const r = new SR();
    r.lang = 'de-DE';
    r.interimResults = false;
    r.continuous = false;
    r.onresult = (ev) => {
      const t = ev.results[0][0].transcript;
      setTextInput(t);
      const { items, slot: detectedSlot, dateOffset: detectedOffset } = parseSpeechInput(t, glossary);
      setParsed(items.map(toParsedItem));
      if (detectedSlot) setSlot(detectedSlot);
      if (detectedOffset !== 0) setDateOffset(detectedOffset);
      setListening(false);
    };
    r.onerror = (ev) => {
      let msg = 'Fehler bei der Spracherkennung.';
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        msg = 'Mikrofon nicht erlaubt. Tippe auf das (i) in der Adressleiste → Berechtigungen → Mikrofon zulassen.';
      } else if (ev.error === 'no-speech') {
        msg = 'Nichts gehört. Nochmal versuchen?';
      } else if (ev.error === 'network') {
        msg = 'Spracherkennung braucht Internet. Verbindung prüfen.';
      } else if (ev.error === 'aborted') {
        msg = null; // Vom User abgebrochen, kein Fehler
      } else if (ev.error) {
        msg = `Fehler: ${ev.error}`;
      }
      if (msg) setMicError(msg);
      setListening(false);
    };
    r.onend = () => setListening(false);
    recognitionRef.current = r;
    setListening(true);
    try {
      r.start();
    } catch (e) {
      setMicError('Konnte Mikrofon nicht starten: ' + e.message);
      setListening(false);
    }
  };

  const stopSpeech = () => { recognitionRef.current?.stop(); setListening(false); };

  const toParsedItem = (it) => {
    if (it.match) {
      return {
        foodId: it.match.id,
        foodName: it.match.name,
        qty: it.qty,
        unit: it.unit in it.match.units ? it.unit : Object.keys(it.match.units)[0],
        kcalPer100g: it.match.kcalPer100g,
        protein: it.match.protein || 0,
        carbs: it.match.carbs || 0,
        fat: it.match.fat || 0,
        units: it.match.units,
        isNew: false,
      };
    }
    return {
      foodId: null,
      foodName: it.foodText.charAt(0).toUpperCase() + it.foodText.slice(1),
      qty: it.qty,
      unit: it.unit && it.unit !== 'g' ? it.unit : 'g',
      kcalPer100g: 0,
      protein: 0,
      carbs: 0,
      fat: 0,
      units: { g: 1, 'Stück': 0, 'Scheibe': 0, 'EL': 10, 'TL': 3, 'ml': 1, 'Tasse': 200, 'Glas': 200 },
      isNew: true,
    };
  };

  const handleTextSubmit = () => {
    if (!textInput.trim()) return;
    const { items, slot: detectedSlot, dateOffset: detectedOffset } = parseSpeechInput(textInput, glossary);
    setParsed(items.map(toParsedItem));
    if (detectedSlot) setSlot(detectedSlot);
    if (detectedOffset !== 0) setDateOffset(detectedOffset);
  };

  const onSearchChange = (q) => {
    setTextInput(q);
    const ql = q.toLowerCase().trim();
    const sorted = [...glossary].sort((a, b) => a.name.localeCompare(b.name, 'de'));
    if (!ql) { setSearchResults(sorted); return; }
    const sw = sorted.filter(g => g.name.toLowerCase().startsWith(ql));
    const co = sorted.filter(g => !g.name.toLowerCase().startsWith(ql) && g.name.toLowerCase().includes(ql));
    setSearchResults([...sw, ...co]);
  };

  const addFromSearch = (food) => {
    // Immer zur Vorschau hinzufügen — kein confirm, kein automatisches Inkrement
    // Wenn schon eingetragen: kleiner Hinweis in der ParsedRow
    const existing = todayEntries.find(e => e.foodId === food.id);
    const _ukeys = Object.keys(food.units);
    const _punit = _ukeys.find(u => u !== 'g' && u !== 'ml' && (food.units[u] || 0) > 0) || _ukeys[0] || 'g';
    const _pqty = (_punit !== 'g' && _punit !== 'ml') ? 1 : 100;
    setParsed([...parsed, {
      foodId: food.id, foodName: food.name, qty: _pqty, unit: _punit,
      kcalPer100g: food.kcalPer100g,
      protein: food.protein || 0, carbs: food.carbs || 0, fat: food.fat || 0,
      units: food.units, isNew: false,
      alreadyToday: existing ? `Schon eingetragen: ${existing.qty}${existing.unit}` : null,
    }]);
    setTextInput('');
    setSearchResults([...glossary].sort((a, b) => a.name.localeCompare(b.name, 'de')));
  };

  const updateItem = (idx, patch) => {
    const next = [...parsed]; next[idx] = { ...next[idx], ...patch }; setParsed(next);
  };

  const removeItem = (idx) => setParsed(parsed.filter((_, i) => i !== idx));

  const lookupItem = async (idx) => {
    const item = parsed[idx];
    if (!item.foodName) return;
    updateItem(idx, { lookingUp: true, lookupError: null });
    const result = await lookupFood(item.foodName, apiKey);
    if (result) {
      updateItem(idx, {
        foodName: result.name,
        kcalPer100g: result.kcalPer100g,
        protein: result.protein || 0,
        carbs: result.carbs || 0,
        fat: result.fat || 0,
        units: result.units || { g: 1 },
        unit: Object.keys(result.units || { g: 1 })[0],
        lookingUp: false,
        lookupSource: result.source,
      });
    } else {
      updateItem(idx, {
        lookingUp: false,
        lookupError: apiKey
          ? 'Nichts gefunden – bitte manuell eintragen'
          : 'Nichts in Open Food Facts. Für KI-Suche: API-Key in Einstellungen',
      });
    }
  };

  const handleConfirm = () => {
    const newGlossary = [];
    // Datum: entryDate direkt + dateOffset
    let dateKey = entryDate;
    if (dateOffset !== 0) {
      const d = new Date(entryDate + 'T12:00:00'); // Mittag verhindert Timezone-Bug
      d.setDate(d.getDate() + dateOffset);
      dateKey = todayKey(d);
    }
    const time = new Date().toISOString();

    const finalEntries = parsed.map(p => {
      let foodId = p.foodId;
      // Manueller Eintrag: keine Glossar-Speicherung, kcal direkt
      if (p.isManual) {
        return {
          id: crypto.randomUUID(),
          dateKey, time, foodId: null, foodName: p.foodName || 'Manuell',
          qty: 1, unit: 'Eintrag',
          kcal: Math.round(p.kcalPer100g || 0),
          protein: Math.round((p.protein || 0) * 10) / 10,
          carbs: Math.round((p.carbs || 0) * 10) / 10,
          fat: Math.round((p.fat || 0) * 10) / 10,
          slot,
          isManual: true,
        };
      }
      if (p.isNew && p.kcalPer100g > 0) {
        const newFood = {
          id: 'g' + crypto.randomUUID().slice(0, 8),
          name: p.foodName,
          kcalPer100g: p.kcalPer100g,
          protein: p.protein || 0,
          carbs: p.carbs || 0,
          fat: p.fat || 0,
          units: p.units,
        };
        newGlossary.push(newFood);
        foodId = newFood.id;
      }
      const grams = (p.units[p.unit] || 1) * p.qty;
      const kcal = Math.round(p.kcalPer100g * grams / 100);
      const protein = Math.round((p.protein || 0) * grams / 100 * 10) / 10;
      const carbs = Math.round((p.carbs || 0) * grams / 100 * 10) / 10;
      const fat = Math.round((p.fat || 0) * grams / 100 * 10) / 10;
      return {
        id: crypto.randomUUID(),
        dateKey, time, foodId, foodName: p.foodName,
        qty: p.qty, unit: p.unit, kcal, protein, carbs, fat, slot,
      };
    });

    onConfirm(finalEntries, newGlossary);
  };

  const totalKcal = parsed.reduce((s, p) => {
    if (p.isManual) return s + Math.round(p.kcalPer100g || 0);
    return s + Math.round(p.kcalPer100g * (p.units[p.unit] || 1) * p.qty / 100);
  }, 0);

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onCancel}><X size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Eintrag</h1>
      </div>

      {/* Haupt-Toggle: Essen ↔ Bewegung */}
      <div style={{ ...styles.segGroup, marginBottom: 16 }}>
        <button
          style={{ ...styles.seg, ...(screen === 'food' ? styles.segActive : {}) }}
          onClick={() => setScreen('food')}
        >
          Essen
        </button>
        <button
          style={{ ...styles.seg, ...(screen === 'movement' ? styles.segActive : {}) }}
          onClick={() => setScreen('movement')}
        >
          Bewegung
        </button>
      </div>

      {screen === 'movement' ? (
        <MovementInputArea
          activities={activities}
          currentWeight={currentWeight}
          onAddActivityEntry={onAddActivityEntry}
          onIncrementActivityEntry={onIncrementActivityEntry}
          todayActivityEntries={todayActivityEntries}
          onDone={onCancel}
          dateKey={entryDate}
        />
      ) : (
      <>

      <div style={{ display: 'flex', gap: 8, alignItems: 'stretch' }}>
        <div style={{ ...styles.segGroup, flex: 1 }}>
          <button style={{ ...styles.seg, ...(mode === 'text' ? styles.segActive : {}) }} onClick={() => setMode('text')}>Text</button>
          <button style={{ ...styles.seg, ...(mode === 'speech' ? styles.segActive : {}) }} onClick={() => setMode('speech')}>Sprache</button>
          <button style={{ ...styles.seg, ...(mode === 'dish' ? styles.segActive : {}) }} onClick={() => setMode('dish')}>Gericht</button>
          <button style={{ ...styles.seg, ...(mode === 'photo' ? styles.segActive : {}) }} onClick={() => setMode('photo')}>📷</button>
        </div>
        <button
          onClick={() => setScanningBarcode(true)}
          style={{
            background: 'rgba(250,246,236,0.08)', color: '#FAF6EC',
            border: '1px solid rgba(250,246,236,0.2)', borderRadius: 10,
            padding: '0 14px', fontSize: 18,
          }}
          aria-label="Barcode scannen"
          title="Barcode scannen"
        >
          ⊞
        </button>
      </div>

      {barcodeStatus && (
        <div style={{
          marginTop: 10, padding: '10px 14px', borderRadius: 8,
          fontFamily: 'Inter', fontSize: 13,
          background: barcodeStatus.error ? 'rgba(160,58,53,0.2)' : 'rgba(45,106,82,0.25)',
          border: `1px solid ${barcodeStatus.error ? 'rgba(232,168,159,0.4)' : 'rgba(74,132,114,0.5)'}`,
          color: barcodeStatus.error ? '#E8A89F' : '#FAF6EC',
        }}>
          {barcodeStatus.loading && `Suche Barcode ${barcodeStatus.code}...`}
          {barcodeStatus.ok && `✓ ${barcodeStatus.name} hinzugefügt`}
          {barcodeStatus.error && `Barcode ${barcodeStatus.code} nicht in Open Food Facts gefunden`}
        </div>
      )}

      {scanningBarcode && (
        <BarcodeScanner
          onResult={handleBarcodeResult}
          onCancel={() => setScanningBarcode(false)}
        />
      )}

      {mode === 'dish' && (
        <div style={{ marginTop: 16 }}>
          {dishes.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '32px 16px', color: 'rgba(250,246,236,0.6)', fontFamily: 'Inter', fontSize: 13, lineHeight: 1.6 }}>
              Noch keine Gerichte gespeichert.<br />
              Trag Lebensmittel ein und tippe unten auf „Als Gericht speichern".
            </div>
          ) : (
            <>
              <div style={{ position: 'relative' }}>
                <Search size={16} style={{ position: 'absolute', left: 14, top: 14, color: 'rgba(250,246,236,0.5)' }} />
                <input
                  placeholder="Gericht suchen..."
                  value={dishSearch}
                  onChange={e => setDishSearch(e.target.value)}
                  style={{ ...styles.input, paddingLeft: 40 }}
                />
              </div>
              <div style={{ marginTop: 12 }}>
                {dishes
                  .filter(d => d.name.toLowerCase().includes(dishSearch.toLowerCase()))
                  .map(d => {
                    const totalKcal = d.items.reduce((sum, it) => {
                      const food = glossary.find(g => g.id === it.foodId);
                      if (!food) return sum;
                      const grams = (food.units[it.unit] || 1) * it.qty;
                      return sum + Math.round(food.kcalPer100g * grams / 100);
                    }, 0);
                    return (
                      <div
                        key={d.id}
                        onClick={() => {
                          const items = d.items.map(it => {
                            const food = glossary.find(g => g.id === it.foodId);
                            if (!food) return null;
                            return {
                              foodId: food.id,
                              foodName: food.name,
                              qty: it.qty,
                              unit: it.unit in food.units ? it.unit : Object.keys(food.units)[0],
                              kcalPer100g: food.kcalPer100g,
                              units: food.units,
                              isNew: false,
                            };
                          }).filter(Boolean);
                          setParsed(items);
                          setMode('text'); // zurück zur Bestätigungs-Karte
                        }}
                        style={{ ...styles.entryRow, cursor: 'pointer' }}
                      >
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{d.name}</div>
                          <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }}>
                            {d.items.length} Lebensmittel
                          </div>
                        </div>
                        <div style={{ fontFamily: 'Fraunces', fontSize: 18, fontWeight: 500 }} className="num">{totalKcal} <span style={{ fontSize: 12, color: '#5C6B5E' }}>kcal</span></div>
                      </div>
                    );
                  })}
              </div>
            </>
          )}
        </div>
      )}

      {mode === 'text' && (
        <div style={{ marginTop: 16 }}>
          <div style={{ position: 'relative' }}>
            <Search size={16} style={{ position: 'absolute', left: 14, top: 14, color: '#5C6B5E' }} />
            <input
              placeholder="Lebensmittel suchen oder Satz tippen..."
              value={textInput}
              onChange={e => onSearchChange(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && (searchResults.length === 0) && handleTextSubmit()}
              style={{ ...styles.input, paddingLeft: 40 }}
            />
          </div>
          {searchResults.length > 0 && (
            <div style={{ background: 'white', border: '1px solid #D8D2C2', borderRadius: 8, marginTop: 8, maxHeight: 360, overflowY: 'auto' }}>
              {searchResults.map(f => (
                <div key={f.id} onClick={() => addFromSearch(f)} style={{ padding: '12px 16px', cursor: 'pointer', borderBottom: '1px solid #E5DFD2', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontFamily: 'Fraunces', fontSize: 16 }}>{f.name}</span>
                  <span style={{ fontFamily: 'Inter', fontSize: 13, color: '#5C6B5E' }} className="num">{f.kcalPer100g} / 100g</span>
                </div>
              ))}
            </div>
          )}
          {searchResults.length === 0 && textInput && (
            <div style={{ marginTop: 8 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.6)', marginBottom: 6 }}>
                Nichts im Glossar gefunden
              </div>
              <button style={styles.secondary} onClick={handleTextSubmit}>
                Als Satz parsen
              </button>
            </div>
          )}
          {searchResults.length === 0 && !textInput && glossary.length === 0 && (
            <div style={{ padding: '24px 16px', textAlign: 'center', fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.6)' }}>
              Glossar ist leer.
            </div>
          )}

          {/* Manuell-Eintrag für was nicht im Glossar ist */}
          <button
            onClick={() => {
              setParsed([...parsed, {
                foodId: null,
                foodName: textInput || '',
                qty: 1, unit: 'Portion',
                kcalPer100g: 0,
                protein: 0, carbs: 0, fat: 0,
                units: { 'Portion': 100, 'g': 1 },
                isNew: true,
                isManual: true,
              }]);
              setTextInput('');
            }}
            style={{
              background: 'transparent', color: 'rgba(250,246,236,0.85)',
              border: '1px dashed rgba(250,246,236,0.3)', borderRadius: 8,
              padding: '10px 14px', fontFamily: 'Inter', fontSize: 13,
              marginTop: 12, cursor: 'pointer', width: '100%',
            }}
          >
            + Manuell eintragen (Name + kcal)
          </button>
        </div>
      )}
      {mode === 'speech' && (
        <div style={{ marginTop: 16, textAlign: 'center', padding: '32px 0' }}>
          <button
            onClick={listening ? stopSpeech : startSpeech}
            style={{
              width: 96, height: 96, borderRadius: '50%',
              background: listening ? '#A03A35' : '#FAF6EC',
              border: 'none', color: listening ? '#FAF6EC' : '#0D3B2E',
              boxShadow: listening ? '0 0 0 14px rgba(160,58,53,0.25)' : '0 6px 24px rgba(0,0,0,0.25)',
              transition: 'all 200ms ease',
            }}
          >
            <Mic size={36} />
          </button>
          <div style={{ marginTop: 16, fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.7)' }}>
            {listening ? 'Hört zu...' : 'Tippen und sprechen'}
          </div>
          {textInput && (
            <div style={{ marginTop: 16, fontFamily: 'Fraunces', fontSize: 16, fontStyle: 'italic', color: '#FAF6EC' }}>
              „{textInput}"
            </div>
          )}
          {micError && (
            <div style={{ marginTop: 20, padding: '12px 16px', background: 'rgba(160,58,53,0.2)', border: '1px solid rgba(232,168,159,0.4)', borderRadius: 8, fontFamily: 'Inter', fontSize: 13, color: '#E8A89F', lineHeight: 1.5, maxWidth: 320, marginLeft: 'auto', marginRight: 'auto' }}>
              {micError}
            </div>
          )}
        </div>
      )}

      {/* === Foto-Tab === */}
      {mode === 'photo' && (
        <div style={{ marginTop: 16 }}>
          {!apiKey && (
            <div style={{ padding: '12px 14px', background: 'rgba(232,168,159,0.15)', border: '1px solid rgba(232,168,159,0.3)', borderRadius: 8, fontFamily: 'Inter', fontSize: 13, color: '#E8A89F', marginBottom: 12 }}>
              Für die Foto-Analyse brauchst du einen Claude API-Key (Mehr → API-Key).
            </div>
          )}

          {/* Galerie — ohne capture */}
          <input
            id="photo-gallery-input"
            type="file"
            accept="image/*"
            onChange={handleGallerySelect}
            style={{ display: 'none' }}
          />

          {/* ImageCropper nach Aufnahme */}
          {cropImageUrl && (
            <ImageCropper
              imageDataUrl={cropImageUrl}
              onCrop={(base64, mediaType) => {
                setCropImageUrl(null);
                handlePhotoBase64(base64, mediaType);
              }}
              onCancel={() => setCropImageUrl(null)}
            />
          )}

          {/* CameraCapture Overlay */}
          {showCamera && (
            <CameraCapture
              onCapture={handleCameraCapture}
              onCancel={() => setShowCamera(false)}
            />
          )}

          {photoPreview ? (
            <div style={{ textAlign: 'center' }}>
              <img src={photoPreview} alt="Vorschau" style={{ maxWidth: '100%', maxHeight: 260, borderRadius: 12, objectFit: 'cover' }} />
              <div style={{ marginTop: 12, fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.7)' }}>
                {photoAnalyzing ? '🔍 Analysiere...' : ''}
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <button
                onClick={() => setShowCamera(true)}
                disabled={!apiKey || photoAnalyzing}
                style={{ ...styles.primary, opacity: !apiKey || photoAnalyzing ? 0.5 : 1, fontSize: 16, padding: '18px 16px' }}
              >
                📷 Foto aufnehmen (Rückkamera)
              </button>
              <button
                onClick={() => document.getElementById('photo-gallery-input')?.click()}
                disabled={!apiKey || photoAnalyzing}
                style={{ ...styles.secondary, opacity: !apiKey || photoAnalyzing ? 0.5 : 1 }}
              >
                🖼️ Aus Galerie wählen
              </button>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.5)', textAlign: 'center', lineHeight: 1.5 }}>
                Fotografiere ein Gericht, einen Teller, ein Rezept oder eine Packung. Claude erkennt die Zutaten und schätzt die Kalorien.
              </div>
            </div>
          )}

          {photoAnalyzing && !photoPreview && (
            <div style={{ textAlign: 'center', padding: '32px 0', fontFamily: 'Inter', fontSize: 14, color: 'rgba(250,246,236,0.7)' }}>
              🔍 Analysiere Foto...
            </div>
          )}

          {photoError && (
            <div style={{ marginTop: 12, padding: '12px 14px', background: 'rgba(160,58,53,0.15)', border: '1px solid rgba(232,168,159,0.3)', borderRadius: 8, fontFamily: 'Inter', fontSize: 13, color: '#E8A89F' }}>
              {photoError}
            </div>
          )}

          {/* Erkannte Zutaten */}
          {photoItems.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: 'rgba(250,246,236,0.6)', marginBottom: 10 }}>
                {photoItems.length} Zutaten erkannt — bearbeite oder lösche einzelne
              </div>
              {photoItems.map((item, i) => (
                <PhotoResultRow
                  key={i}
                  item={item}
                  idx={i}
                  onChange={(idx, changes) => setPhotoItems(prev => prev.map((it, j) => j === idx ? { ...it, ...changes } : it))}
                  onRemove={(idx) => setPhotoItems(prev => prev.filter((_, j) => j !== idx))}
                  onAddToGlossary={(idx) => {
                    const it = photoItems[idx];
                    const newFood = {
                      id: 'g' + crypto.randomUUID().slice(0, 8),
                      name: it.foodName,
                      kcalPer100g: it.kcalPer100g || 0,
                      protein: it.protein || 0,
                      carbs: it.carbs || 0,
                      fat: it.fat || 0,
                      units: { g: 1, Portion: 100 },
                    };
                    persistGlossary([...glossary, newFood]);
                    // Zutat bleibt in der Liste, wird nur als "im Glossar" markiert
                    setPhotoItems(prev => prev.map((x, j) => j === idx ? { ...x, savedToGlossary: true } : x));
                  }}
                />
              ))}

              {/* Slot + Alle-Übernehmen */}
              <div style={{ display: 'flex', gap: 8, marginTop: 8, alignItems: 'center' }}>
                <Clock size={14} style={{ color: 'rgba(250,246,236,0.6)' }} />
                <select value={slot} onChange={e => setSlot(e.target.value)}
                  style={{ ...styles.input, flex: 1, padding: '8px 10px' }}>
                  {['Frühstück', 'Mittag', 'Snack', 'Abend'].map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 20, fontWeight: 600, color: '#FAF6EC', textAlign: 'right', marginTop: 8 }} className="num">
                ~{photoItems.reduce((s, it) => s + Math.round((it.kcalPer100g || 0) * (it.qty || 0) / 100), 0)} kcal
              </div>
              <button
                style={{ ...styles.primary, marginTop: 10 }}
                onClick={() => {
                  // Alle photoItems als parsed-Items übernehmen
                  const newParsed = photoItems.map(it => ({
                    foodId: null,
                    foodName: it.foodName,
                    qty: it.qty,
                    unit: it.unit || 'g',
                    kcalPer100g: it.kcalPer100g || 0,
                    protein: it.protein || 0,
                    carbs: it.carbs || 0,
                    fat: it.fat || 0,
                    units: { [it.unit || 'g']: it.unit === 'g' ? 1 : 100, g: 1 },
                    isNew: it.addToGlossary || false,
                  }));
                  setParsed(prev => [...prev, ...newParsed]);
                  setPhotoItems([]);
                  setMode('text'); // Wechsel zur Bestätigungs-Ansicht
                }}
              >
                <Check size={16} style={{ marginRight: 8 }} /> Alle übernehmen
              </button>
              <button
                onClick={() => setPhotoItems([])}
                style={{ ...styles.secondary, marginTop: 8 }}
              >
                Verwerfen
              </button>
            </div>
          )}
        </div>
      )}

      {/* Bestätigungs-Karte */}
      {parsed.length > 0 && (
        <div style={{ marginTop: 24, background: '#FAF6EC', borderRadius: 12, padding: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: '#5C6B5E', marginBottom: 12 }}>Vorschau</div>
          {parsed.map((p, i) => (
            <ParsedRow key={i} item={p} idx={i} onChange={updateItem} onRemove={removeItem} onLookup={lookupItem} />
          ))}

          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 16, paddingTop: 16, borderTop: '1px solid rgba(13,59,46,0.12)' }}>
            <Calendar size={14} style={{ color: '#5C6B5E' }} />
            <input
              type="date"
              value={entryDate}
              onChange={e => { setEntryDate(e.target.value); setDateOffset(0); }}
              style={{ ...styles.input, padding: '8px 12px', flex: 1 }}
            />
            <Clock size={14} style={{ color: '#5C6B5E' }} />
            <select value={slot} onChange={e => setSlot(e.target.value)} style={{ ...styles.input, padding: '8px 12px', flex: 1 }}>
              {['Frühstück', 'Mittag', 'Snack', 'Abend'].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div style={{ textAlign: 'right', marginTop: 8, fontFamily: 'Fraunces', fontSize: 22, fontWeight: 600, color: '#0D3B2E' }} className="num">{totalKcal} kcal</div>

          <button style={{ ...styles.primary, marginTop: 16 }} onClick={handleConfirm}>
            <Check size={18} style={{ marginRight: 8 }} /> Bestätigen
          </button>

          {/* Als Gericht speichern */}
          {savingDish ? (
            <div style={{ marginTop: 12, padding: 12, background: 'rgba(13,59,46,0.06)', borderRadius: 8, display: 'flex', gap: 8 }}>
              <input
                placeholder="Name des Gerichts (z.B. Quark-Frühstück)"
                value={dishName}
                onChange={e => setDishName(e.target.value)}
                style={{ ...styles.input, flex: 1, padding: '8px 12px' }}
                autoFocus
              />
              <button
                onClick={async () => {
                  if (!dishName.trim()) return;
                  // Nur Items mit foodId speichern
                  const items = parsed.filter(p => p.foodId).map(p => ({ foodId: p.foodId, qty: p.qty, unit: p.unit }));
                  if (items.length === 0) { alert('Keine bekannten Lebensmittel zum Speichern.'); return; }
                  const dish = {
                    id: 'd' + crypto.randomUUID().slice(0, 8),
                    name: dishName.trim(),
                    items,
                    createdAt: new Date().toISOString(),
                  };
                  await onSaveDish(dish);
                  setSavingDish(false);
                  setDishName('');
                }}
                style={{ background: '#0D3B2E', color: '#FAF6EC', border: 'none', borderRadius: 6, padding: '0 14px', fontWeight: 600, fontSize: 13 }}
              >
                Speichern
              </button>
              <button onClick={() => { setSavingDish(false); setDishName(''); }} style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }}><X size={14} /></button>
            </div>
          ) : (
            parsed.filter(p => p.foodId).length >= 2 && (
              <button
                style={{
                  width: '100%', padding: '10px', background: 'transparent', color: '#0D3B2E',
                  border: '1px dashed rgba(13,59,46,0.3)', borderRadius: 8,
                  fontSize: 13, fontWeight: 500, marginTop: 8, cursor: 'pointer',
                }}
                onClick={() => setSavingDish(true)}
              >
                + Als Gericht speichern
              </button>
            )
          )}
        </div>
      )}
      </>
      )}
    </div>
  );
}

    <div style={{ flex: 1, background: 'rgba(250,246,236,0.12)', borderRadius: 10, padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: 8 }}>

        <input type="date" value={date} onChange={e => setDate(e.target.value)}

        <button onClick={() => setOpen(false)}

function PhotoResultRow({ item, idx, onChange, onRemove, onAddToGlossary }) {
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(item.foodName);
  const [qty, setQty] = useState(String(item.qty));
  const [unit, setUnit] = useState(item.unit || 'g');
  const [kcal, setKcal] = useState(String(item.kcalPer100g));
  const [searching, setSearching] = useState(false);
  const [searchQ, setSearchQ] = useState('');
  const [searchResults, setSearchResults] = useState([]);

  const totalKcal = Math.round((parseFloat(kcal) || 0) * (parseFloat(qty) || 0) / 100);

  const save = () => {
    onChange(idx, {
      foodName: name,
      qty: parseFloat(qty) || item.qty,
      unit,
      kcalPer100g: parseFloat(kcal) || item.kcalPer100g,
    });
    setEditing(false);
  };

  const runSearch = async () => {
    if (!searchQ.trim()) return;
    setSearching(true);
    const results = await lookupOpenFoodFactsMany(searchQ.trim(), 8);
    setSearchResults(results);
    setSearching(false);
  };

  const applyOFF = (r) => {
    setName(r.name);
    setKcal(String(r.kcalPer100g));
    onChange(idx, {
      foodName: r.name,
      kcalPer100g: r.kcalPer100g,
      protein: r.protein,
      carbs: r.carbs,
      fat: r.fat,
    });
    setSearchResults([]);
    setSearchQ('');
    setEditing(false);
  };

  return (
    <div style={{ background: '#FAF6EC', borderRadius: 10, padding: 12, marginBottom: 8 }}>
      {editing ? (
        <>
          <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="Name"
              style={{ ...styles.input, flex: 1, padding: '6px 10px' }} />
            <button onClick={() => setEditing(false)} style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }}><X size={14} /></button>
          </div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
            <input value={qty} onChange={e => setQty(e.target.value)} placeholder="Menge"
              type="text" inputMode="decimal" style={{ ...styles.input, width: 65, padding: '6px 8px' }} />
            <select value={unit} onChange={e => setUnit(e.target.value)} style={{ ...styles.input, flex: 1, padding: '6px 8px' }}>
              {['g', 'ml', 'Stück', 'EL', 'TL', 'Portion'].map(u => <option key={u}>{u}</option>)}
            </select>
            <input value={kcal} onChange={e => setKcal(e.target.value)} placeholder="kcal/100g"
              type="text" inputMode="decimal" style={{ ...styles.input, width: 80, padding: '6px 8px' }} />
          </div>
          <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
            <input value={searchQ} onChange={e => setSearchQ(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && runSearch()}
              placeholder={`„${name}" in OFF suchen...`}
              style={{ ...styles.input, flex: 1, padding: '6px 10px' }} />
            <button onClick={runSearch} disabled={searching}
              style={{ background: '#0D3B2E', color: '#FAF6EC', border: 'none', borderRadius: 6, padding: '0 10px', fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
              {searching ? '...' : '🔍'}
            </button>
          </div>
          {searchResults.length > 0 && (
            <div style={{ maxHeight: 180, overflowY: 'auto', background: 'rgba(13,59,46,0.06)', borderRadius: 6, marginBottom: 8 }}>
              {searchResults.map((r, i) => (
                <div key={i} onClick={() => applyOFF(r)} style={{ padding: '8px 10px', borderBottom: '1px solid rgba(13,59,46,0.08)', cursor: 'pointer' }}>
                  <div style={{ fontFamily: 'Fraunces', fontSize: 13, color: '#0D3B2E' }}>{r.name}{r.brand ? ` (${r.brand})` : ''}</div>
                  <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E' }} className="num">{r.kcalPer100g} kcal/100g · E{r.protein} KH{r.carbs} F{r.fat}</div>
                </div>
              ))}
            </div>
          )}
          <button onClick={save} style={{ ...styles.primary, marginTop: 4, padding: '8px 14px', fontSize: 13 }}>Übernehmen</button>
        </>
      ) : (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: 'Fraunces', fontSize: 15, fontWeight: 500, color: '#0D3B2E', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.foodName}</div>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
              {item.qty}{item.unit} · ~{totalKcal} kcal
            </div>
          </div>
          <button onClick={() => setEditing(true)} title="Bearbeiten"
            style={{ background: 'rgba(13,59,46,0.08)', border: 'none', borderRadius: 6, padding: '5px 8px', cursor: 'pointer', fontSize: 14 }}>✏️</button>
          <button onClick={() => onAddToGlossary(idx)} title="Ins Glossar"
            style={{
              background: item.savedToGlossary ? 'rgba(26,83,64,0.25)' : 'rgba(26,83,64,0.12)',
              border: item.savedToGlossary ? '1px solid #1A5340' : 'none',
              borderRadius: 6, padding: '5px 8px', cursor: item.savedToGlossary ? 'default' : 'pointer',
              fontFamily: 'Inter', fontSize: 11, fontWeight: 600,
              color: item.savedToGlossary ? '#90C8A8' : '#1A5340',
            }}>
            {item.savedToGlossary ? '✓ Glossar' : '+Glossar'}
          </button>
          <button onClick={() => onRemove(idx)}
            style={{ background: 'rgba(160,58,53,0.08)', border: 'none', borderRadius: 6, padding: '5px 8px', cursor: 'pointer', color: '#A03A35' }}><X size={13} /></button>
        </div>
      )}
    </div>
  );
}

function ParsedRow({ item, idx, onChange, onRemove, onLookup }) {
  const grams = (item.units[item.unit] || 1) * item.qty;
  const kcal = item.isManual ? Math.round(item.kcalPer100g || 0) : Math.round(item.kcalPer100g * grams / 100);
  const isUnknown = item.isNew && !item.kcalPer100g;

  if (item.isManual) {
    return (
      <div style={{ background: 'white', borderRadius: 8, padding: 12, marginBottom: 8, border: '1px dashed #8B7355' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
          <input
            value={item.foodName}
            onChange={e => onChange(idx, { foodName: e.target.value })}
            placeholder="Was hast du gegessen?"
            style={{ ...styles.input, fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500, padding: '6px 10px', border: 'none', background: 'transparent', flex: 1 }}
            autoFocus
          />
          <button onClick={() => onRemove(idx)} style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }}><X size={14} /></button>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <input
            type="text"
            inputMode="numeric"
            placeholder="kcal"
            value={item.kcalPer100g === 0 || item.kcalPer100g === '' ? '' : String(item.kcalPer100g)}
            onChange={e => {
              const v = e.target.value;
              if (v === '' || /^\d+$/.test(v)) {
                onChange(idx, { kcalPer100g: v === '' ? 0 : parseInt(v, 10) });
              }
            }}
            style={{ ...styles.input, flex: 1, padding: '6px 10px' }}
          />
          <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E' }}>kcal gesamt</span>
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E', marginTop: 6 }}>
          Wird nicht ins Glossar gespeichert · nur dieser Eintrag
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: 'white', borderRadius: 8, padding: 12, marginBottom: 8, border: item.isNew ? '1px dashed #8B7355' : 'none' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
        <input
          value={item.foodName}
          onChange={e => onChange(idx, { foodName: e.target.value })}
          style={{ ...styles.input, fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500, padding: '6px 10px', border: 'none', background: 'transparent', flex: 1 }}
        />
        <button onClick={() => onRemove(idx)} style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }}><X size={14} /></button>
      </div>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
        <input
          type="text"
          inputMode="decimal"
          value={item.qty === 0 || item.qty === '' ? '' : String(item.qty).replace('.', ',')}
          placeholder="0"
          onChange={e => {
            let v = e.target.value.replace(',', '.');
            // erlaubt: leer, ziffer(n), optional . mit ziffer(n)
            if (v === '' || /^\d*\.?\d*$/.test(v)) {
              onChange(idx, { qty: v === '' ? 0 : (v.endsWith('.') ? v : parseFloat(v)) });
            }
          }}
          style={{ ...styles.input, width: 80, padding: '6px 10px' }}
        />
        <select value={item.unit} onChange={e => onChange(idx, { unit: e.target.value })} style={{ ...styles.input, width: 110, padding: '6px 10px' }}>
          {Object.keys(item.units).map(u => <option key={u}>{u}</option>)}
        </select>
        {item.isNew ? (
          <>
            <input
              type="number"
              inputMode="decimal"
              placeholder="kcal/100g"
              value={item.kcalPer100g || ''}
              onChange={e => {
                const v = e.target.value;
                onChange(idx, { kcalPer100g: v === '' ? 0 : parseFloat(v) });
              }}
              style={{ ...styles.input, width: 100, padding: '6px 10px' }}
            />
            <button
              onClick={() => onLookup(idx)}
              disabled={item.lookingUp}
              style={{
                background: '#0D3B2E', color: '#F4EFE6', border: 'none', borderRadius: 6,
                padding: '6px 12px', fontSize: 12, fontWeight: 600,
                cursor: item.lookingUp ? 'wait' : 'pointer', opacity: item.lookingUp ? 0.6 : 1,
              }}
            >
              {item.lookingUp ? 'Sucht…' : 'Suchen'}
            </button>
          </>
        ) : (
          <div style={{ marginLeft: 'auto', fontFamily: 'Fraunces', fontSize: 18, fontWeight: 500 }} className="num">{kcal} kcal</div>
        )}
      </div>
      {item.lookupSource && (
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E', marginTop: 6 }}>
          ✓ Gefunden via {item.lookupSource} · {item.kcalPer100g} kcal/100g
        </div>
      )}
      {item.lookupError && (
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#A03A35', marginTop: 6 }}>
          {item.lookupError}
        </div>
      )}

      {/* Gewicht pro Einheit eingeben, wenn unbekannt (z.B. Brötchen → wie viel g pro Stück?) */}
      {item.unit !== 'g' && item.unit !== 'ml' && !(item.units[item.unit] > 0) && (
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 8, padding: 8, background: 'rgba(139,115,85,0.1)', borderRadius: 6 }}>
          <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', flex: 1 }}>g pro 1 {item.unit}:</span>
          <input
            type="number"
            inputMode="numeric"
            placeholder="z.B. 80"
            autoFocus
            onChange={e => {
              const v = e.target.value;
              const grams = v === '' ? 0 : parseFloat(v);
              onChange(idx, { units: { ...item.units, [item.unit]: grams } });
            }}
            style={{ ...styles.input, width: 90, padding: '6px 10px' }}
          />
        </div>
      )}
      {isUnknown && !item.lookupSource && !item.lookupError && (
        <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#8B7355', marginTop: 6 }}>
          Unbekannt – „Suchen" oder kcal/100g eingeben
        </div>
      )}
    </div>
  );
}

// === Dishes ===
function Dishes({ dishes, glossary, onChange, onUseDish, onBack }) {
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null); // dish-Objekt zum Bearbeiten

  const filtered = dishes.filter(d => d.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onBack}><ChevronLeft size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Gerichte</h1>
      </div>

      <div style={{ position: 'relative', marginBottom: 16 }}>
        <Search size={16} style={{ position: 'absolute', left: 14, top: 14, color: 'rgba(250,246,236,0.5)' }} />
        <input placeholder="Suche..." value={search} onChange={e => setSearch(e.target.value)} style={{ ...styles.input, paddingLeft: 40 }} />
      </div>

      {dishes.length === 0 && (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'rgba(250,246,236,0.6)', fontFamily: 'Inter', fontSize: 14, lineHeight: 1.6 }}>
          Noch keine Gerichte gespeichert.<br />
          Trag erst Lebensmittel ein, dann erscheint dort der Knopf „Als Gericht speichern".
        </div>
      )}

      {filtered.map(d => {
        const totalKcal = d.items.reduce((sum, it) => {
          const food = glossary.find(g => g.id === it.foodId);
          if (!food) return sum;
          const grams = (food.units[it.unit] || 1) * it.qty;
          return sum + Math.round(food.kcalPer100g * grams / 100);
        }, 0);
        return (
          <div key={d.id} style={{ ...styles.entryRow, flexDirection: 'column', alignItems: 'stretch', gap: 10, padding: 14 }}>
            <div onClick={() => setEditing(d)} style={{ display: 'flex', alignItems: 'center', cursor: 'pointer' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{d.name}</div>
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                  {d.items.length} Lebensmittel · {totalKcal} kcal · tippen zum Bearbeiten
                </div>
              </div>
              <Settings size={16} style={{ color: '#5C6B5E' }} />
            </div>
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E' }}>
              {d.items.map(it => {
                const food = glossary.find(g => g.id === it.foodId);
                return food ? `${String(it.qty).replace('.', ',')} ${it.unit} ${food.name}` : '?';
              }).join(' · ')}
            </div>
            <button
              onClick={() => onUseDish(d.items)}
              style={{
                background: '#0D3B2E', color: '#FAF6EC', border: 'none',
                borderRadius: 6, padding: '8px 12px', fontSize: 13, fontWeight: 600,
                marginTop: 4, cursor: 'pointer',
              }}
            >
              Eintragen
            </button>
          </div>
        );
      })}

      {editing && (
        <DishEditor
          dish={editing}
          glossary={glossary}
          onSave={(updated) => {
            onChange(dishes.map(d => d.id === updated.id ? updated : d));
            setEditing(null);
          }}
          onDelete={() => {
            if (confirm(`Gericht „${editing.name}" wirklich löschen?`)) {
              onChange(dishes.filter(d => d.id !== editing.id));
              setEditing(null);
            }
          }}
          onCancel={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function DishEditor({ dish, glossary, onSave, onDelete, onCancel }) {
  const [d, setD] = useState({ ...dish, items: [...dish.items] });
  const [adding, setAdding] = useState(false);
  const [searchAdd, setSearchAdd] = useState('');

  const updateItem = (idx, patch) => {
    const next = [...d.items]; next[idx] = { ...next[idx], ...patch }; setD({ ...d, items: next });
  };
  const removeItem = (idx) => setD({ ...d, items: d.items.filter((_, i) => i !== idx) });
  const addItem = (food) => {
    const firstUnit = Object.keys(food.units)[0];
    setD({ ...d, items: [...d.items, { foodId: food.id, qty: 100, unit: firstUnit }] });
    setAdding(false);
    setSearchAdd('');
  };

  const filteredAdd = glossary.filter(g => g.name.toLowerCase().includes(searchAdd.toLowerCase()));

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top, #1A5340 0%, #0D3B2E 100%)', width: '100%', borderRadius: '20px 20px 0 0', padding: 24, maxHeight: '90vh', overflow: 'auto', maxWidth: 480, margin: '0 auto', borderTop: '1px solid rgba(250,246,236,0.15)' }}>
        <h2 style={{ fontFamily: 'Fraunces', margin: '0 0 16px', color: '#FAF6EC', fontWeight: 600 }}>Gericht bearbeiten</h2>
        <Field label="Name">
          <input value={d.name} onChange={e => setD({ ...d, name: e.target.value })} style={styles.input} />
        </Field>
        <Field label="Lebensmittel">
          {d.items.map((it, idx) => {
            const food = glossary.find(g => g.id === it.foodId);
            if (!food) return null;
            return (
              <div key={idx} style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 6, background: 'rgba(250,246,236,0.06)', padding: 8, borderRadius: 6 }}>
                <span style={{ flex: 1, fontFamily: 'Fraunces', color: '#FAF6EC', fontSize: 14 }}>{food.name}</span>
                <input
                  type="text"
                  inputMode="decimal"
                  value={it.qty === 0 || it.qty === '' ? '' : String(it.qty).replace('.', ',')}
                  onChange={e => {
                    let v = e.target.value.replace(',', '.');
                    if (v === '' || /^\d*\.?\d*$/.test(v)) {
                      updateItem(idx, { qty: v === '' ? 0 : (v.endsWith('.') ? v : parseFloat(v)) });
                    }
                  }}
                  style={{ ...styles.input, width: 70, padding: '6px 8px' }}
                />
                <select value={it.unit} onChange={e => updateItem(idx, { unit: e.target.value })} style={{ ...styles.input, width: 80, padding: '6px 8px' }}>
                  {Object.keys(food.units).map(u => <option key={u}>{u}</option>)}
                </select>
                <button onClick={() => removeItem(idx)} style={styles.iconBtnSmall}><X size={14} /></button>
              </div>
            );
          })}

          {adding ? (
            <div style={{ marginTop: 8, padding: 10, background: 'rgba(250,246,236,0.06)', borderRadius: 6 }}>
              <input
                placeholder="Lebensmittel suchen..."
                value={searchAdd}
                onChange={e => setSearchAdd(e.target.value)}
                style={{ ...styles.input, marginBottom: 6 }}
                autoFocus
              />
              <div style={{ maxHeight: 280, overflowY: 'auto' }}>
                {filteredAdd.map(g => (
                  <div
                    key={g.id}
                    onClick={() => addItem(g)}
                    style={{
                      padding: '8px 10px', cursor: 'pointer',
                      fontFamily: 'Fraunces', fontSize: 14, color: '#FAF6EC',
                      borderBottom: '1px solid rgba(250,246,236,0.08)',
                    }}
                  >
                    {g.name}
                  </div>
                ))}
                {filteredAdd.length === 0 && searchAdd && (
                  <div style={{ padding: '12px 10px', fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.5)' }}>
                    Kein Lebensmittel gefunden.
                  </div>
                )}
              </div>
              <button
                onClick={() => { setAdding(false); setSearchAdd(''); }}
                style={{
                  background: 'transparent', color: 'rgba(250,246,236,0.7)',
                  border: 'none', fontSize: 12, padding: '6px 0', marginTop: 4,
                  cursor: 'pointer',
                }}
              >
                Abbrechen
              </button>
            </div>
          ) : (
            <button
              onClick={() => setAdding(true)}
              style={{
                background: 'transparent', color: '#FAF6EC',
                border: '1px dashed rgba(250,246,236,0.3)',
                borderRadius: 6, padding: '8px 12px',
                fontFamily: 'Inter', fontSize: 13, marginTop: 6,

        <div style={{ display: 'flex', gap: 8, marginTop: 24 }}>

// === Glossar ===
function Glossary({ glossary, activities, onChange, onChangeActivities, onBack, apiKey = '', onOfferUndo }) {
  const [tab, setTab] = useState('food'); // food | activity
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null);
  const [editingActivity, setEditingActivity] = useState(null);
  const [scanningBarcode, setScanningBarcode] = useState(false);
  const [compact, setCompact] = useState(() => { try { return JSON.parse(localStorage.getItem('torcal_glossar_compact') || 'false'); } catch { return false; } });
  const [scanStatus, setScanStatus] = useState(null); // null | 'loading' | 'found' | 'notfound'

  const filteredFood = glossary
    .filter(g => g.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const filteredActs = activities
    .filter(a => a.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));

  const handleBarcodeScan = async (barcode) => {
    setScanningBarcode(false);
    setScanStatus('loading');
    const result = await lookupOpenFoodFactsByBarcode(barcode);
    if (!result) {
      setScanStatus('notfound');
      setTimeout(() => setScanStatus(null), 3000);
      return;
    }
    // Schon im Glossar?
    if (glossary.find(g => g.name.toLowerCase() === result.name.toLowerCase())) {
      setScanStatus('found');
      setTimeout(() => setScanStatus(null), 3000);
      return;
    }
    const newFood = {
      id: 'g' + crypto.randomUUID().slice(0, 8),
      name: result.name,
      kcalPer100g: result.kcalPer100g,
      protein: result.protein || 0,
      carbs: result.carbs || 0,
      fat: result.fat || 0,
      units: { g: 1, Portion: 100 },
    };
    onChange([...glossary, newFood]);
    setEditing(newFood);
    setScanStatus(null);
  };

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onBack}><ChevronLeft size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Glossar</h1>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
          {tab === 'food' && (
            <button onClick={() => setScanningBarcode(true)} style={{
              background: 'rgba(250,246,236,0.1)', color: '#FAF6EC',
              border: '1px solid rgba(250,246,236,0.2)', borderRadius: 8,
              padding: '6px 10px', fontFamily: 'Inter', fontSize: 13,
              cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4,
            }}>
              <span>▦</span> Scan
            </button>
          )}
        </div>
      </div>

      {scanStatus === 'loading' && (
        <div style={{ background: 'rgba(250,246,236,0.08)', padding: '10px 14px', borderRadius: 8, marginBottom: 12, fontFamily: 'Inter', fontSize: 13, color: '#FAF6EC' }}>
          Suche in OpenFoodFacts…
        </div>
      )}
      {scanStatus === 'notfound' && (
        <div style={{ background: 'rgba(232,168,159,0.15)', padding: '10px 14px', borderRadius: 8, marginBottom: 12, fontFamily: 'Inter', fontSize: 13, color: '#E8A89F' }}>
          Kein Produkt gefunden für diesen Barcode.
        </div>
      )}
      {scanStatus === 'found' && (
        <div style={{ background: 'rgba(144,200,168,0.15)', padding: '10px 14px', borderRadius: 8, marginBottom: 12, fontFamily: 'Inter', fontSize: 13, color: '#90C8A8' }}>
          Produkt bereits im Glossar.
        </div>
      )}

      <div style={styles.segGroup}>
        <button style={{ ...styles.seg, ...(tab === 'food' ? styles.segActive : {}) }} onClick={() => { setTab('food'); setSearch(''); }}>Lebensmittel</button>
        <button style={{ ...styles.seg, ...(tab === 'activity' ? styles.segActive : {}) }} onClick={() => { setTab('activity'); setSearch(''); }}>Trainings</button>
      </div>
      {tab === 'food' && (
        <button style={{ ...styles.primary, marginBottom: 8, marginTop: 8 }} onClick={() => setEditing({ id: null, name: '', kcalPer100g: 0, protein: 0, carbs: 0, fat: 0, units: { g: 1 } })}>
          <Plus size={18} style={{ marginRight: 8 }} /> Neues Lebensmittel
        </button>
      )}
      {tab === 'activity' && (
        <button style={{ ...styles.primary, marginBottom: 8, marginTop: 8 }} onClick={() => setEditingActivity({ id: null, name: '', met: 5 })}>
          <Plus size={18} style={{ marginRight: 8 }} /> Neue Aktivität

      <div style={{ position: 'relative', marginTop: 16, marginBottom: 16 }}>
        <Search size={16} style={{ position: 'absolute', left: 14, top: 14, color: 'rgba(250,246,236,0.5)' }} />

      {tab === 'food' && (

          {filteredFood.map(f => (
            <div key={f.id} onClick={() => setEditing(f)} style={{
                ...(compact ? {
                  display: 'flex', alignItems: 'center', padding: '8px 12px',
                  background: '#FAF6EC', borderRadius: 8, marginBottom: 4, cursor: 'pointer',
                } : { ...styles.entryRow, cursor: 'pointer' })
              }}>
              {compact ? (
                <>
                  <span style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 500, flex: 1 }}>{f.name}</span>
                  <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E' }} className="num">{f.kcalPer100g} kcal/100g</span>

              ) : (
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{f.name}</div>
                  <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">

                </div>
              )}
            </div>
          ))}

        </>
      )}

      {tab === 'activity' && (
        <>
          {filteredActs.map(a => (
            <div key={a.id} onClick={() => setEditingActivity(a)} style={{ ...styles.entryRow, cursor: 'pointer' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{a.name}</div>
                <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                  MET {a.met}
                </div>
              </div>
            </div>
          ))}

          {/* Vorschläge aus der MET-Datenbank */}
          {(() => {
            const existingNames = new Set(activities.map(a => a.name.toLowerCase()));
            const suggestions = MET_DATABASE.filter(m => {
              if (existingNames.has(m.name.toLowerCase())) return false;
              if (!search.trim()) return false; // nur bei aktiver Suche zeigen
              return m.name.toLowerCase().includes(search.toLowerCase());
            });
            if (suggestions.length === 0) return null;
            return (
              <div style={{ marginTop: 16 }}>
                <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.5)', marginBottom: 8 }}>
                  Vorschläge zum Hinzufügen
                </div>
                {suggestions.map(m => (
                  <div
                    key={m.name}
                    onClick={() => {
                      const newAct = { id: 'a' + crypto.randomUUID().slice(0, 8), name: m.name, met: m.met };
                      onChangeActivities([...activities, newAct]);
                      setSearch('');
                    }}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 10,
                      padding: '10px 12px', marginBottom: 4,
                      background: 'rgba(250,246,236,0.06)',
                      border: '1px dashed rgba(250,246,236,0.2)',
                      borderRadius: 8, cursor: 'pointer',
                    }}
                  >
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: 'Fraunces', fontSize: 15, fontWeight: 500, color: '#FAF6EC' }}>{m.name}</div>
                      <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.5)' }} className="num">MET {m.met}</div>
                    </div>
                    <div style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      width: 28, height: 28, borderRadius: 6,
                      background: 'rgba(144,200,168,0.2)', border: '1px solid rgba(144,200,168,0.4)',
                    }}>
                      <Plus size={16} />
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          {!search.trim() && (
            <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.4)', textAlign: 'center', marginTop: 12, marginBottom: 12 }}>
              Tipp: Tippe oben in die Suche, um aus über 70 Sportarten auszuwählen
            </div>
          )}

          <button style={styles.primary} onClick={() => setEditingActivity({ id: null, name: '', met: 5 })}>
            <Plus size={18} style={{ marginRight: 8 }} /> Neue Aktivität
          </button>
        </>
      )}

      {scanningBarcode && (
        <BarcodeScanner
          onResult={handleBarcodeScan}
          onCancel={() => setScanningBarcode(false)}
        />
      )}

      {editing && (
        <FoodEditor
          food={editing}
          apiKey={apiKey}
          onSave={(f) => {
            if (f.id) onChange(glossary.map(g => g.id === f.id ? f : g));
            else onChange([...glossary, { ...f, id: 'g' + crypto.randomUUID().slice(0, 8) }]);
            setEditing(null);
          }}
          onDelete={() => {
            const deleted = editing;
            onChange(glossary.filter(g => g.id !== editing.id));
            setEditing(null);
            if (onOfferUndo) onOfferUndo(`„${deleted.name}" gelöscht`, async () => {
              onChange([...glossary.filter(g => g.id !== deleted.id), deleted]);
            });
          }}
          onCancel={() => setEditing(null)}
        />
      )}

      {editingActivity && (
        <ActivityGlossaryEditor
          activity={editingActivity}
          onSave={(a) => {
            if (a.id) onChangeActivities(activities.map(x => x.id === a.id ? a : x));
            else onChangeActivities([...activities, { ...a, id: 'a' + crypto.randomUUID().slice(0, 8) }]);
            setEditingActivity(null);
          }}
          onDelete={() => { onChangeActivities(activities.filter(x => x.id !== editingActivity.id)); setEditingActivity(null); }}
          onCancel={() => setEditingActivity(null)}
        />
      )}
    </div>
  );
}
