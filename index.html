  <!-- Persistenter Storage Shim (localStorage-basiert) -->
  <script>
    window.storage = {
      get: async (key) => {
        const v = localStorage.getItem('kt:' + key);
        return v !== null ? { value: v } : null;
      },
      set: async (key, value) => {
        localStorage.setItem('kt:' + key, value);
        return { value };
      },
      delete: async (key) => {
        localStorage.removeItem('kt:' + key);
        return { deleted: true };
      },
    };

    // crypto.randomUUID Polyfill
    if (!window.crypto.randomUUID) {
      window.crypto.randomUUID = () =>
        ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }
  </script>

  const h = date.getHours();
  if (h < 10) return 'Frühstück';
  if (h < 14) return 'Mittag';
  if (h < 17) return 'Snack';
  if (h < 21) return 'Abend';
  return 'Snack';
};

// Mifflin-St Jeor
const calcDailyKcal = (s) => {
  // Manuelles Ziel hat Vorrang
  if (s.customTarget && +s.customTarget > 0) return Math.round(+s.customTarget);
  if (!s.weight || !s.height || !s.age) return 2000;
  const bmr = s.sex === 'm'
    ? 10 * s.weight + 6.25 * s.height - 5 * s.age + 5
    : 10 * s.weight + 6.25 * s.height - 5 * s.age - 161;
  const activity = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 }[s.activity] || 1.375;
  const goal = { lose: -500, maintain: 0, gain: 300 }[s.goal] || 0;
  return Math.round(bmr * activity + goal);
};

// === Sprach-Parser ===
// Versteht Sätze wie "250g Magerquark, mittelgroße Banane und 3 Esslöffel Haferflocken"
// Auch: "pack das zum Frühstück: ...", "fürs Mittag ...", "das war gestern abend ..."
const parseSpeechInput = (text, glossary) => {
  if (!text) return { items: [], slot: null, dateOffset: 0 };

  let working = text.toLowerCase().replace(/ß/g, 'ss');

  // Mahlzeit erkennen
  let detectedSlot = null;
  const slotPatterns = [
    { re: /\b(fr(ue|ü)hst(ue|ü)ck|morgens|zum morgen)\b/i, slot: 'Frühstück' },
    { re: /\b(mittag(essen)?|mittags|zur mittagspause)\b/i, slot: 'Mittag' },
    { re: /\b(abend(essen|brot)?|abends|zum abend)\b/i, slot: 'Abend' },
    { re: /\b(snack|zwischendurch|zwischenmahlzeit)\b/i, slot: 'Snack' },
  ];
  for (const { re, slot } of slotPatterns) {
    if (re.test(working)) { detectedSlot = slot; break; }
  }

  // Tag erkennen ("gestern" -> -1)
  let dateOffset = 0;
  if (/\bgestern\b/i.test(working)) dateOffset = -1;
  if (/\bvorgestern\b/i.test(working)) dateOffset = -2;

  // Mahlzeits-/Datums-Phrasen aus dem Text rausschneiden, bevor wir Lebensmittel parsen
  working = working
    .replace(/\b(pack(e)? das|trag(e)? das ein|f(ue|ü)r das|f(ue|ü)rs|zum|zur|beim|als)\s+(fr(ue|ü)hst(ue|ü)ck|mittag(essen)?|abend(essen|brot)?|snack)\b[:,]?\s*/gi, '')
    .replace(/\b(fr(ue|ü)hst(ue|ü)ck|mittag(essen)?|abend(essen|brot)?|snack)\b[:,]?\s*/gi, '')
    .replace(/\b(das war|war|hatte ich|hab ich|habe ich)\b\s*/gi, '')
    .replace(/\b(gestern|vorgestern|heute)\b\s*/gi, '')
    .replace(/\b(morgens|mittags|abends|zwischendurch)\b\s*/gi, '');

  const cleaned = working
    .replace(/ und /g, ', ')
    .replace(/sowie/g, ', ')
    .replace(/ mit /g, ', ');

  const chunks = cleaned.split(/[,;:]+/).map(c => c.trim()).filter(Boolean);
  const results = [];

  const unitWords = {
    'g': ['g', 'gramm', 'gr'],
    'ml': ['ml', 'milliliter'],
    'EL': ['el', 'esslöffel', 'esloeffel', 'essloeffel'],
    'TL': ['tl', 'teelöffel', 'teeloeffel'],
    'Stück': ['stück', 'stueck', 'st'],
    'Scheibe': ['scheibe', 'scheiben'],
    'Tasse': ['tasse', 'tassen'],
    'Glas': ['glas', 'gläser', 'glaeser'],
  };

  // "mittelgroße banane" -> 1 Stück
  const sizeWords = ['kleine', 'kleiner', 'mittlere', 'mittelgrosse', 'mittelgrosser', 'grosse', 'grosser'];

  for (const chunk of chunks) {
    let qty = null;
    let unit = null;
    let foodText = chunk;

    // Bruch-Wörter zuerst behandeln (halbe, dreiviertel, anderthalb...)
    const fractionPatterns = [
      { re: /^(eineinhalb|anderthalb)\s+/i, val: 1.5 },
      { re: /^(zweieinhalb)\s+/i, val: 2.5 },
      { re: /^(dreieinhalb)\s+/i, val: 3.5 },
      { re: /^(drei[- ]?viertel|3\/4)\s+/i, val: 0.75 },
      { re: /^(ein[- ]?viertel|viertel|1\/4)\s+/i, val: 0.25 },
      { re: /^(halbe[rs]?|halb|1\/2|0[,.]5)\s+/i, val: 0.5 },
    ];
    let fractionMatched = false;
    for (const { re, val } of fractionPatterns) {
      const m = chunk.match(re);
      if (m) {
        qty = val;
        foodText = chunk.slice(m[0].length).trim();
        fractionMatched = true;
        break;
      }
    }

    // Zahl finden (auch "ein", "eine", "eins") - nur wenn kein Bruch
    if (!fractionMatched) {
      const numMatch = chunk.match(/^(\d+(?:[.,]\d+)?|ein|eine|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)\s*/);
      const numWords = { ein: 1, eine: 1, eins: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10 };

      if (numMatch) {
        const raw = numMatch[1].replace(',', '.');
        qty = numWords[raw] !== undefined ? numWords[raw] : parseFloat(raw);
        foodText = chunk.slice(numMatch[0].length).trim();
      }
    }

    // Einheit finden
    for (const [u, words] of Object.entries(unitWords)) {
      for (const w of words) {
        const re = new RegExp(`^${w}\\s+`, 'i');
        if (re.test(foodText)) {
          unit = u;
          foodText = foodText.replace(re, '');
          break;
        }
        // "30g" ohne Leerzeichen
        if (qty !== null && foodText.startsWith(w + ' ')) {
          unit = u;
          foodText = foodText.slice(w.length).trim();
          break;
        }
      }
      if (unit) break;
    }

    // "30g haferflocken" -> g war an der Zahl dran
    if (qty !== null && unit === null) {
      const inlineUnit = chunk.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|ml|kg)\b/i);
      if (inlineUnit) {
        unit = inlineUnit[2].toLowerCase() === 'kg' ? 'kg' : (inlineUnit[2].toLowerCase().startsWith('m') ? 'ml' : 'g');
        foodText = chunk.slice(inlineUnit[0].length).trim();
      }
    }

    // Größenbeschreibungen entfernen ("mittelgroße banane")
    for (const sw of sizeWords) {
      if (foodText.startsWith(sw + ' ')) {
        foodText = foodText.slice(sw.length).trim();
        if (qty === null) qty = 1;
        if (unit === null) unit = 'Stück';
      }
    }

    if (!foodText) continue;

    // Glossar matchen (fuzzy: enthält Teilstring)
    const match = glossary.find(g => g.name.toLowerCase().includes(foodText) || foodText.includes(g.name.toLowerCase().split(' ')[0]));

    // Bei Bruchzahlen ohne Einheit: wenn Lebensmittel "Stück" kennt, das nehmen
    if (fractionMatched && !unit && match && 'Stück' in match.units) {
      unit = 'Stück';
    }

    // kg -> g
    if (unit === 'kg') { qty = (qty || 0) * 1000; unit = 'g'; }

    // Defaults
    if (qty === null) qty = 1;
    if (unit === null) unit = match ? Object.keys(match.units)[0] : 'g';

    results.push({
      rawText: chunk,
      foodText,
      qty,
      unit,
      match: match || null,
    });
  }

  return { items: results, slot: detectedSlot, dateOffset };
};

const calcKcal = (food, qty, unit) => {
  if (!food) return 0;
  const grams = (food.units[unit] || 1) * qty;
  return Math.round(food.kcalPer100g * grams / 100);
};

// MET × Gewicht × Stunden = kcal
const calcActivityKcal = (met, weightKg, durationMinutes) => {
  return Math.round(met * weightKg * (durationMinutes / 60));
};

const lookupOpenFoodFactsByBarcode = async (barcode) => {
  try {
    const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const p = data.product;
    const n = p.nutriments || {};
    const kcal = n['energy-kcal_100g'] || n['energy-kcal'];
    if (!kcal || kcal < 1) return null;
    return {
      source: 'OpenFoodFacts (Barcode)',
      name: p.product_name_de || p.product_name || `Produkt ${barcode}`,
      brand: p.brands || null,
      kcalPer100g: Math.round(kcal),
      protein: n.proteins_100g != null ? Math.round(n.proteins_100g * 10) / 10 : 0,
      carbs: n.carbohydrates_100g != null ? Math.round(n.carbohydrates_100g * 10) / 10 : 0,
      fat: n.fat_100g != null ? Math.round(n.fat_100g * 10) / 10 : 0,
      barcode,
    };
  } catch (e) {
    console.warn('OFF barcode lookup failed', e);
    return null;
  }
};

const lookupOpenFoodFacts = async (name) => {
  try {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(name)}&search_simple=1&action=process&json=1&page_size=5&lc=de`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.products || data.products.length === 0) return null;
    const candidates = data.products.filter(p => p.nutriments && (p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal']));
    if (candidates.length === 0) return null;
    const best = candidates[0];
    const n = best.nutriments;
    const kcal = n['energy-kcal_100g'] || n['energy-kcal'];
    if (!kcal || kcal < 1) return null;
    return {
      source: 'OpenFoodFacts',
      name: best.product_name_de || best.product_name || name,
      brand: best.brands || null,
      kcalPer100g: Math.round(kcal),
      protein: n.proteins_100g != null ? Math.round(n.proteins_100g * 10) / 10 : 0,
      carbs: n.carbohydrates_100g != null ? Math.round(n.carbohydrates_100g * 10) / 10 : 0,
      fat: n.fat_100g != null ? Math.round(n.fat_100g * 10) / 10 : 0,
    };
  } catch (e) {
    console.warn('OFF lookup failed', e);
    return null;
  }
};

// Foto-Analyse via Claude Vision
const analyzePhoto = async (base64Image, mediaType, apiKey) => {
  const prompt = `Analysiere dieses Foto einer Mahlzeit oder eines Lebensmittels. 
Erkenne alle sichtbaren Zutaten und schätze die Mengen so gut wie möglich.
Antworte NUR mit einem JSON-Array, kein Text davor oder danach, keine Markdown-Backticks.
Format:
[
  {
    "name": "Hähnchenbrust",
    "qty": 150,
    "unit": "g",
    "kcalPer100g": 165,
    "protein": 31,
    "carbs": 0,
    "fat": 3.6
  }
]
Regeln:
- Einheit immer "g" oder "ml" oder "Stück" oder "EL" oder "Portion"
- kcalPer100g ist immer pro 100g (auch bei ml-Angaben)
- Wenn du dir bei einer Zutat unsicher bist, gib trotzdem einen realistischen Schätzwert an
- Maximal 10 Zutaten
- Nur was wirklich sichtbar ist, keine Annahmen über versteckte Zutaten`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: { type: 'base64', media_type: mediaType, data: base64Image },
          },
          { type: 'text', text: prompt },
        ],
      }],
    }),
  });

  if (!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  const text = data.content?.[0]?.text || '';
  // JSON aus Antwort extrahieren
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
};

const lookupOpenFoodFactsMany = async (name, pageSize = 15) => {
  const nameLower = name.toLowerCase().trim();
  const searchTerms = [name];
  // EN-Übersetzung hinzufügen
  for (const [de, en] of Object.entries(DE_EN)) {
    if (nameLower.includes(de)) { if (!searchTerms.includes(en)) searchTerms.push(en); break; }
  }
  const results = [];
  const seen = new Set();
  await Promise.all(searchTerms.map(async term => {
    try {
      const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=${pageSize}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.products) return;
      for (const p of data.products) {
        const n = p.nutriments;
        if (!n) continue;
        const kcal = n['energy-kcal_100g'] || n['energy-kcal'];
        if (!kcal || kcal < 1) continue;
        const pname = p.product_name_de || p.product_name || term;
        const key = pname.toLowerCase().slice(0, 20);
        if (seen.has(key)) continue;
        seen.add(key);
        results.push({
          source: 'OpenFoodFacts', name: pname, brand: p.brands || null,
          kcalPer100g: Math.round(kcal),
          protein: n.proteins_100g != null ? Math.round(n.proteins_100g * 10) / 10 : 0,
          carbs: n.carbohydrates_100g != null ? Math.round(n.carbohydrates_100g * 10) / 10 : 0,
          fat: n.fat_100g != null ? Math.round(n.fat_100g * 10) / 10 : 0,
        });
      }
    } catch {}
  }));
  return results.slice(0, pageSize);
};

const lookupClaude = async (name, apiKey) => {
  if (!apiKey) return null;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: `Lebensmittel: "${name}". Antworte NUR mit JSON, kein Kommentar:
{"name":"deutscher Standardname","kcalPer100g":Zahl,"protein":Zahl,"carbs":Zahl,"fat":Zahl,"units":{"g":1,"weitere":Gramm-pro-Einheit}}

protein/carbs/fat sind Gramm pro 100g. Beispiele für Einheiten: Stück (Banane=120, Apfel=180, Ei=60), Scheibe (Brot=50), EL (Öl=10, Haferflocken=10), Tasse (Reis gekocht=200), Glas (Milch=200). Nimm sinnvolle Defaults. Wenn unklar, nur g.`
        }],
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      console.warn('Claude API error', res.status, errText);
      return null;
    }
    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) return null;
    const parsed = JSON.parse(jsonMatch[0]);
    if (!parsed.kcalPer100g || !parsed.name) return null;
    return {
      source: 'Claude',
      name: parsed.name,
      kcalPer100g: Math.round(parsed.kcalPer100g),
      protein: parsed.protein != null ? Math.round(parsed.protein * 10) / 10 : 0,
      carbs: parsed.carbs != null ? Math.round(parsed.carbs * 10) / 10 : 0,
      fat: parsed.fat != null ? Math.round(parsed.fat * 10) / 10 : 0,
      units: parsed.units || { g: 1 },
    };
  } catch (e) {
    console.warn('Claude lookup failed', e);
    return null;
  }
};

  // Dann Claude (falls Key)

  const [glossary, setGlossary] = useState([]);
  const [dishes, setDishes] = useState([]);
  const [entries, setEntries] = useState([]);
  const [activities, setActivities] = useState([]); // Aktivitäten-Glossar
  const [workouts, setWorkouts] = useState([]); // gespeicherte Kombis
  const [activityEntries, setActivityEntries] = useState([]); // [{id, dateKey, time, activityId, activityName, met, durationMin, weightKg, kcal}]
  const [weights, setWeights] = useState([]);
  const [savedAnalyses, setSavedAnalyses] = useState([]); // [{id, date, kind, text, createdAt}]
  const [notes, setNotes] = useState([]); // [{id, text, type: 'bug'|'idea', done, createdAt}]
  const [coffeeLog, setCoffeeLog] = useState({}); // { 'YYYY-MM-DD': count }
  const [waterLog, setWaterLog] = useState({});   // { 'YYYY-MM-DD': count }
  const [waterGoal, setWaterGoal] = useState(8);
  const [alcoholLog, setAlcoholLog] = useState({}); // { 'YYYY-MM-DD': { beer: n, cremant: n } }
  const [alcoholActiveDays, setAlcoholActiveDays] = useState({}); // { 'YYYY-MM-DD': true } - Tage, an denen Alkohol-Tracker aktiv ist
  const [beerKcal, setBeerKcal] = useState(BEER_KCAL_DEFAULT);
  const [cremantKcal, setCremantKcal] = useState(CREMANT_KCAL_DEFAULT);
  const [coffeeKcal, setCoffeeKcal] = useState(COFFEE_KCAL_DEFAULT);
  const [intimacyLog, setIntimacyLog] = useState([]); // [{id, date, note}]
  const [showAlcohol, setShowAlcohol] = useState(false); // in Einstellungen aktivierbar
  const [showIntimacy, setShowIntimacy] = useState(false); // versteckt aktivierbar
  const [apiKey, setApiKey] = useState('');
  const [loaded, setLoaded] = useState(false);
  const [updateAvailable, setUpdateAvailable] = useState(null); // null | { version }
  const [unlockedAchievements, setUnlockedAchievements] = useState([]); // persistierte IDs
  const [newAchievement, setNewAchievement] = useState(null); // {id, emoji, name, desc} fürs Popup
  const [streakFreezeData, setStreakFreezeData] = useState({ freezes: 0, usedDates: [], lastWeekClaimed: null }); // Freeze-System
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [pendingDishItems, setPendingDishItems] = useState(null);
  const [pendingWorkoutItems, setPendingWorkoutItems] = useState(null);

  // === Timer-State (App-weit, damit er Tab-Wechsel überlebt) ===
  const [timerTotalSeconds, setTimerTotalSeconds] = useState(600);
  const [timerMarkerInterval, setTimerMarkerInterval] = useState(60);
  const [timerTransitionSeconds, setTimerTransitionSeconds] = useState(0); // 0 = aus, 5 oder 10
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerPaused, setTimerPaused] = useState(false);
  const [timerElapsed, setTimerElapsed] = useState(0);
  const [timerFinished, setTimerFinished] = useState(false);
  const timerStartRef = useRef(null);
  const timerPausedAtRef = useRef(0);
  const timerRafRef = useRef(null);
  const timerWakeLockRef = useRef(null);

  // Browser-Zurück-Taste: schließt Sub-View, statt App zu schließen
  // (Initial-Push wird beim ersten Mount gesetzt, danach pro View-Änderung)
  useEffect(() => {
    // Beim allerersten Mount eine Marker-State setzen, damit popstate funktioniert
    if (!window.history.state || window.history.state.view === undefined) {
      window.history.replaceState({ view: 'today' }, '');
    }
  }, []);

  useEffect(() => {
    if (view !== 'today' && view !== 'setup') {
      window.history.pushState({ view }, '');
    }
  }, [view]);

  useEffect(() => {
    const onPopState = () => {
      // Wenn wir gerade in einer Sub-View sind, gehen wir zurück zu today
      // Dabei NICHT erneut pushState aufrufen
      setView((curr) => {
        if (curr !== 'today' && curr !== 'setup') {
          setPendingDishItems(null);
          return 'today';
        }
        return curr;
      });
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  // Undo-Angebote aus Kind-Komponenten (z.B. Glossar-Löschen)
  useEffect(() => {
    const handler = () => {
      if (window._torcalUndo) {
        offerUndo(window._torcalUndo.label, window._torcalUndo.restore);
        window._torcalUndo = null;
      }
    };
    window.addEventListener('torcal-undo-offer', handler);
    return () => window.removeEventListener('torcal-undo-offer', handler);
  }, []);

  // rAF-Loop läuft App-weit, unabhängig vom aktiven Tab
  useEffect(() => {
    if (!timerRunning || timerFinished || timerPaused) return;
    // Effektive Gesamtdauer inkl. Übergänge
    const intervals = timerMarkerInterval > 0 ? Math.floor(timerTotalSeconds / timerMarkerInterval) : 0;
    const transitions = Math.max(0, intervals - 1);
    const totalDuration = timerTotalSeconds + transitions * timerTransitionSeconds;
    const tick = () => {
      const now = performance.now();
      const e = (now - timerStartRef.current) / 1000;
      if (e >= totalDuration) {
        setTimerElapsed(totalDuration);
        setTimerFinished(true);
        return;
      }
      setTimerElapsed(e);
      timerRafRef.current = requestAnimationFrame(tick);
    };
    timerRafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(timerRafRef.current);
  }, [timerRunning, timerFinished, timerPaused, timerTotalSeconds, timerMarkerInterval, timerTransitionSeconds]);

  // Wake Lock App-weit
  useEffect(() => {
    if (!timerRunning || timerPaused || timerFinished) return;
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(lock => {
        timerWakeLockRef.current = lock;
      }).catch(() => {});
    }
    return () => {
      if (timerWakeLockRef.current) {
        timerWakeLockRef.current.release().catch(() => {});
        timerWakeLockRef.current = null;
      }
    };
  }, [timerRunning, timerPaused, timerFinished]);

  // App-Wechsel = Pause (nicht Stop)
  useEffect(() => {
    const onVis = () => {
      if (document.hidden && timerRunning && !timerFinished && !timerPaused) {
        cancelAnimationFrame(timerRafRef.current);
        timerPausedAtRef.current = timerElapsed;
        setTimerPaused(true);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [timerRunning, timerFinished, timerPaused, timerElapsed]);

  const timerStart = () => {
    setTimerElapsed(0);
    setTimerFinished(false);
    setTimerPaused(false);
    timerPausedAtRef.current = 0;
    timerStartRef.current = performance.now();
    setTimerRunning(true);
  };

  const timerStop = () => {
    cancelAnimationFrame(timerRafRef.current);
    setTimerRunning(false);
    setTimerPaused(false);
    setTimerElapsed(0);
    setTimerFinished(false);
    timerPausedAtRef.current = 0;
    timerStartRef.current = null;
  };

  const timerPause = () => {
    if (!timerRunning || timerPaused || timerFinished) return;
    cancelAnimationFrame(timerRafRef.current);
    timerPausedAtRef.current = timerElapsed;
    setTimerPaused(true);
  };

  const timerResume = () => {
    if (!timerPaused) return;

  useEffect(() => {

      // Einmalige Bereinigung: Einträge mit ungültigem Slot reparieren
      const validSlots = ['Frühstück', 'Mittag', 'Snack', 'Abend'];
      const needsClean = e.some(entry => !validSlots.includes(entry.slot));
      if (needsClean) {
        const cleaned = e.map(entry => {
          if (validSlots.includes(entry.slot)) return entry;
          // Slot aus Uhrzeit ableiten
          const h = new Date(entry.time || entry.dateKey).getHours();
          const slot = h < 10 ? 'Frühstück' : h < 14 ? 'Mittag' : h < 17 ? 'Snack' : 'Abend';
          return { ...entry, slot };

  // === Auto-Update-Check ===
  // Beim Start (und alle 10 Min): prüfe, ob online eine neuere Version liegt.
  useEffect(() => {
    const checkForUpdate = async () => {
      try {
        const res = await fetch(window.location.pathname + '?v=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' },
        });
        if (!res.ok) return;
        const text = await res.text();
        // Aus dem geladenen Text die Version extrahieren
        const match = text.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
        if (!match) return;
        const onlineVersion = match[1];
        if (onlineVersion && onlineVersion !== APP_VERSION) {
          setUpdateAvailable({ version: onlineVersion });
        }
      } catch (e) {
        // Offline oder Fehler — egal, nichts tun
      }
    };
    // Sofort prüfen, dann alle 10 Min
    checkForUpdate();
    const interval = setInterval(checkForUpdate, 10 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  const reloadApp = async () => {
    // Service Worker (falls vorhanden) deregistrieren und Cache leeren
    if ('serviceWorker' in navigator) {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) await reg.unregister();
      } catch {}
    }
    if ('caches' in window) {
      try {
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n)));
      } catch {}
    }
    // Hard reload mit Cache-Busting
    window.location.href = window.location.pathname + '?v=' + Date.now();
  };

  const persistEntries = async (next) => { setEntries(next); await saveKey('entries', next); };
  const persistGlossary = async (next) => { setGlossary(next); await saveKey('glossary', next); };
  const persistDishes = async (next) => { setDishes(next); await saveKey('dishes', next); };
  const persistWeights = async (next) => { setWeights(next); await saveKey('weights', next); };
  const persistActivities = async (next) => { setActivities(next); await saveKey('activities', next); };
  const persistWorkouts = async (next) => { setWorkouts(next); await saveKey('workouts', next); };
  const persistSavedAnalyses = async (next) => { setSavedAnalyses(next); await saveKey('savedAnalyses', next); };
  const persistCoffeeLog = async (next) => { setCoffeeLog(next); await saveKey('coffeeLog', next); };
  const persistWaterLog = async (next) => { setWaterLog(next); await saveKey('waterLog', next); };
  const persistWaterGoal = async (next) => { setWaterGoal(next); await saveKey('waterGoal', next); };
  const persistAlcoholLog = async (next) => { setAlcoholLog(next); await saveKey('alcoholLog', next); };
  const persistAlcoholActiveDays = async (next) => { setAlcoholActiveDays(next); await saveKey('alcoholActiveDays', next); };
  const persistBeerKcal = async (next) => { setBeerKcal(next); await saveKey('beerKcal', next); };
  const persistCremantKcal = async (next) => { setCremantKcal(next); await saveKey('cremantKcal', next); };
  const persistCoffeeKcal = async (next) => { setCoffeeKcal(next); await saveKey('coffeeKcal', next); };
  const persistIntimacyLog = async (next) => { setIntimacyLog(next); await saveKey('intimacyLog', next); };
  const persistShowAlcohol = async (next) => { setShowAlcohol(next); await saveKey('showAlcohol', next); };
  const persistShowIntimacy = async (next) => { setShowIntimacy(next); await saveKey('showIntimacy', next); };
  const persistActivityEntries = async (next) => { setActivityEntries(next); await saveKey('activityEntries', next); };
  const persistSettings = async (next) => { setSettings(next); await saveKey('settings', next); };
  const persistApiKey = async (next) => { setApiKey(next); await saveKey('apiKey', next); };
  const persistNotes = async (next) => { setNotes(next); await saveKey('notes', next); };

  // Undo-Hilfsfunktion: setzt undoAction für 5 Sekunden
  const offerUndo = (label, restore) => {
    const expiresAt = Date.now() + 5000;
    setUndoAction({ label, restore, expiresAt });
    setTimeout(() => {
      setUndoAction((current) => (current && current.expiresAt === expiresAt ? null : current));
    }, 5000);
  };

  // Wischgesten-Ref muss vor early return stehen (Hook-Regel)
  const swipeStateRef = useRef(null);

  // Aktuelles Gewicht: letzter Wiegen-Eintrag oder Setup-Gewicht
  // Streak: aufeinanderfolgende Tage mit mind. einem Eintrag
  // === Streak mit Freeze-System und vorausgetragenen Tagen ===
  const streakInfo = (() => {
    const today = todayKey();
    const hasEntryOn = (key) => entries.some(e => e.dateKey === key) || activityEntries.some(a => a.dateKey === key);

    // Schritt 1: aktuellen Streak rückwärts ab heute zählen.
    // Lücken werden mit Freezes überbrückt.
    let count = 0;
    let d = new Date();
    let freezesAvailable = streakFreezeData.freezes || 0;
    const usedDates = [...(streakFreezeData.usedDates || [])];
    const newlyUsedFreezeDates = [];

    // Erst zählen wir vorausgetragene Zukunftstage NICHT in die Zahl,
    // aber sie sichern den Streak ab (siehe Schritt 3 unten).

    for (let i = 0; i < 400; i++) {
      const key = todayKey(d);
      const has = hasEntryOn(key);

      if (has) {
        count++;
      } else if (key === today) {
        // Heute noch kein Eintrag → Streak noch nicht abgerissen, einfach weiter
        d.setDate(d.getDate() - 1);
        continue;
      } else {
        // Lücke an einem vergangenen Tag
        if (usedDates.includes(key)) {
          // Dieser Tag wurde schon mit Freeze gerettet → Streak läuft weiter
          count++;
        } else if (freezesAvailable > 0) {
          // Freeze automatisch einsetzen
          freezesAvailable--;
          newlyUsedFreezeDates.push(key);
          count++;
        } else {
          // Kein Freeze mehr → Streak reißt hier
          break;
        }
      }
      d.setDate(d.getDate() - 1);
    }

    return {
      count,
      freezesAvailable,
      newlyUsedFreezeDates,
      usedDates,
    };
  })();

  const streak = streakInfo.count;

  // === Freeze-Verwaltung: verbrauchte Freezes persistieren + neue Wochen-Freezes vergeben ===
  useEffect(() => {
    if (!loaded) return;

    let changed = false;
    let nextData = { ...streakFreezeData };

    // 1) Neu verbrauchte Freezes eintragen
    if (streakInfo.newlyUsedFreezeDates.length > 0) {
      nextData = {
        ...nextData,
        freezes: Math.max(0, (nextData.freezes || 0) - streakInfo.newlyUsedFreezeDates.length),
        usedDates: [...(nextData.usedDates || []), ...streakInfo.newlyUsedFreezeDates],
      };
      changed = true;
    }

    // 2) Wochen-Freeze vergeben: alle 7 Streak-Tage einen Freeze, max 3
    // lastWeekClaimed speichert, bei welchem Streak-Stand zuletzt ein Freeze vergeben wurde
    const earnedThreshold = Math.floor(streak / 7) * 7;
    const lastClaimed = nextData.lastWeekClaimed || 0;
    if (earnedThreshold >= 7 && earnedThreshold > lastClaimed) {
      const weeksToGrant = (earnedThreshold - lastClaimed) / 7;
      const newFreezeCount = Math.min(3, (nextData.freezes || 0) + weeksToGrant);
      nextData = { ...nextData, freezes: newFreezeCount, lastWeekClaimed: earnedThreshold };
      changed = true;
    }

    if (changed) {
      setStreakFreezeData(nextData);
      saveKey('streakFreezeData', nextData);
    }
  }, [loaded, streak, streakInfo.newlyUsedFreezeDates.join(',')]);


  // === Achievements ===
  const allAchievements = (() => {
    const list = [];

    // Streak-Stufen
    [
      { id: 'streak_1',   threshold: 1,   emoji: '🌱', name: 'Start',          desc: 'Erster Tracking-Tag' },
      { id: 'streak_3',   threshold: 3,   emoji: '⚡', name: 'Dranbleiben',    desc: '3 Tage in Folge' },
      { id: 'streak_7',   threshold: 7,   emoji: '🔥', name: 'Eine Woche',     desc: '7 Tage in Folge' },
      { id: 'streak_14',  threshold: 14,  emoji: '💪', name: 'Zwei Wochen',    desc: '14 Tage in Folge' },
      { id: 'streak_30',  threshold: 30,  emoji: '🏆', name: 'Ein Monat',      desc: '30 Tage in Folge' },
      { id: 'streak_60',  threshold: 60,  emoji: '💎', name: 'Zwei Monate',   desc: '60 Tage in Folge' },
      { id: 'streak_100', threshold: 100, emoji: '👑', name: 'Hundert',        desc: '100 Tage in Folge' },
      { id: 'streak_180', threshold: 180, emoji: '🚀', name: 'Halbes Jahr',    desc: '180 Tage in Folge' },
      { id: 'streak_365', threshold: 365, emoji: '🌟', name: 'Ein Jahr',       desc: '365 Tage in Folge' },
    ].forEach(s => {
      list.push({ ...s, group: 'streak', unlocked: streak >= s.threshold, progress: Math.min(streak, s.threshold), max: s.threshold });
    });

    // Ganzer Kalendermonat lückenlos
    const monthsTracked = (() => {
      const allDates = new Set([...entries.map(e => e.dateKey), ...activityEntries.map(a => a.dateKey)]);
      // Gruppiere nach YYYY-MM, prüfe ob alle Tage des Monats drin sind
      const months = {};
      allDates.forEach(d => {
        const ym = d.slice(0, 7);
        months[ym] = months[ym] || new Set();
        months[ym].add(d.slice(8, 10));
      });
      let complete = 0;
      Object.entries(months).forEach(([ym, days]) => {
        const [y, m] = ym.split('-').map(Number);
        const lastDay = new Date(y, m, 0).getDate();
        // Nur abgeschlossene Monate zählen (nicht aktueller Monat, falls noch nicht vorbei)
        const todayD = new Date();
        const isCurrentMonth = todayD.getFullYear() === y && (todayD.getMonth() + 1) === m;
        if (!isCurrentMonth && days.size >= lastDay) complete++;
      });
      return complete;
    })();
    list.push({ id: 'month_full_1', group: 'monthly', emoji: '📅', name: 'Ganzer Monat', desc: 'Einen Kalendermonat lückenlos getrackt', unlocked: monthsTracked >= 1, progress: monthsTracked >= 1 ? 1 : 0, max: 1 });
    list.push({ id: 'month_full_3', group: 'monthly', emoji: '🗓️', name: 'Drei Monate', desc: 'Drei Kalendermonate lückenlos', unlocked: monthsTracked >= 3, progress: Math.min(monthsTracked, 3), max: 3 });

    // Gewichts-Meilensteine
    const startWeight = +settings?.startWeight || (weights.length > 0 ? [...weights].sort((a,b) => a.date.localeCompare(b.date))[0].kg : null);
    const latestWeight = weights.length > 0 ? [...weights].sort((a,b) => b.date.localeCompare(a.date))[0].kg : null;
    const lostKg = (startWeight && latestWeight) ? Math.max(0, startWeight - latestWeight) : 0;
    [
      { id: 'lost_2',  threshold: 2,  emoji: '📉', name: 'Erste 2 kg',  desc: '2 kg abgenommen' },
      { id: 'lost_5',  threshold: 5,  emoji: '📊', name: '5 kg weg',     desc: '5 kg abgenommen' },
      { id: 'lost_10', threshold: 10, emoji: '🏔️', name: '10 kg weg',   desc: '10 kg abgenommen' },

    ].forEach(s => {

    });

    // Zielgewicht erreicht
    if (settings?.targetWeight && latestWeight) {
      list.push({
        id: 'target_reached', group: 'weight', emoji: '🎯', name: 'Ziel erreicht',
        desc: settings.goalLabel ? `Zielgewicht für ${settings.goalLabel} geknackt` : 'Zielgewicht erreicht',
        unlocked: latestWeight <= +settings.targetWeight,
        progress: latestWeight <= +settings.targetWeight ? 1 : 0,
        max: 1,
      });
    }

    // Mahlzeiten getrackt (Anzahl entries die nicht Wasser/Kaffee/Alkohol sind, lasen wir einfach: alle entries)
    const mealsCount = entries.length;
    [
      { id: 'meals_100',  threshold: 100,  emoji: '🍳', name: '100 Einträge',  desc: '100 Mahlzeiten/Einträge getrackt' },
      { id: 'meals_500',  threshold: 500,  emoji: '🍽️', name: '500 Einträge',  desc: '500 Mahlzeiten/Einträge' },
      { id: 'meals_1000', threshold: 1000, emoji: '🏅', name: '1000 Einträge', desc: '1000 Mahlzeiten/Einträge' },
    ].forEach(s => {
      list.push({ ...s, group: 'meals', unlocked: mealsCount >= s.threshold, progress: Math.min(mealsCount, s.threshold), max: s.threshold });
    });

    // Aktivitäts-Distanz (falls activityEntries Distanzen haben, ansonsten min-Aggregat)
    // Wir benutzen Dauer als Proxy für Aktivität, weil nicht alle Einträge Distanz haben.
    const totalActivityMin = activityEntries.reduce((s, a) => s + (a.durationMin || 0), 0);
    [
      { id: 'act_300',   threshold: 300,   emoji: '🚴', name: '5h Aktivität',    desc: 'Insgesamt 5 Stunden Bewegung' },
      { id: 'act_1200',  threshold: 1200,  emoji: '🏃', name: '20h Aktivität',   desc: 'Insgesamt 20 Stunden Bewegung' },
      { id: 'act_3000',  threshold: 3000,  emoji: '🏔️', name: '50h Aktivität',  desc: 'Insgesamt 50 Stunden Bewegung' },
    ].forEach(s => {
      list.push({ ...s, group: 'activity', unlocked: totalActivityMin >= s.threshold, progress: Math.min(totalActivityMin, s.threshold), max: s.threshold });
    });

    // Wasser-Champion: 7 Tage in Folge Wasserziel erreicht (waterLog speichert pro Tag)
    // Wir nehmen einen anderen Proxy: Anzahl Tage mit ≥ waterGoal Wassereinträgen aus entries
    // Vereinfachung: nicht implementiert, würde echte Wasser-Historie brauchen
    // Daher Achievement weglassen oder vereinfachen → Anzahl getrackter Tage gesamt
    const totalDaysTracked = new Set([...entries.map(e => e.dateKey), ...activityEntries.map(a => a.dateKey)]).size;
    [
      { id: 'days_30',  threshold: 30,  emoji: '📆', name: '30 Tage Tracking',  desc: '30 verschiedene Tage getrackt' },
      { id: 'days_90',  threshold: 90,  emoji: '📈', name: '90 Tage Tracking',  desc: '90 verschiedene Tage getrackt' },
      { id: 'days_180', threshold: 180, emoji: '🏗️', name: '180 Tage',          desc: '180 verschiedene Tage getrackt' },
    ].forEach(s => {
      list.push({ ...s, group: 'days', unlocked: totalDaysTracked >= s.threshold, progress: Math.min(totalDaysTracked, s.threshold), max: s.threshold });
    });

    // Trocken-Woche: 7 Tage in Folge ohne Alkohol — vereinfacht: Anzahl Tage mit Alkohol-Einträgen
    const dryStreak = (() => {
      let count = 0;
      let d = new Date();
      for (let i = 0; i < 365; i++) {
        const key = todayKey(d);
        // Hat dieser Tag Einträge UND keine Alkohol-Einträge (im alcoholLog)?
        const hasTracking = entries.some(e => e.dateKey === key) || activityEntries.some(a => a.dateKey === key);
        const hasAlcohol = alcoholLog[key] && ((alcoholLog[key].beer || 0) > 0 || (alcoholLog[key].cremant || 0) > 0);
        if (!hasTracking) break;
        if (hasAlcohol) break;
        count++;
        d.setDate(d.getDate() - 1);
      }
      return count;
    })();
    list.push({ id: 'dry_7',  group: 'health', emoji: '💧', name: 'Trocken-Woche', desc: '7 Tage in Folge ohne Alkohol', unlocked: dryStreak >= 7, progress: Math.min(dryStreak, 7), max: 7 });
    list.push({ id: 'dry_30', group: 'health', emoji: '🌿', name: 'Trocken-Monat', desc: '30 Tage in Folge ohne Alkohol', unlocked: dryStreak >= 30, progress: Math.min(dryStreak, 30), max: 30 });

    return list;
  })();

  const unlockedCount = allAchievements.filter(a => a.unlocked).length;

  // === Achievement-Detection: neue Unlocks → Popup + persistieren ===
  useEffect(() => {
    if (!loaded) return;
    const currentlyUnlocked = allAchievements.filter(a => a.unlocked).map(a => a.id);
    const previouslyUnlocked = new Set(unlockedAchievements);
    const newlyUnlocked = currentlyUnlocked.filter(id => !previouslyUnlocked.has(id));

    if (newlyUnlocked.length > 0) {
      // Speichere alle aktuell freigeschalteten persistent
      const next = Array.from(new Set([...unlockedAchievements, ...currentlyUnlocked]));
      setUnlockedAchievements(next);
      saveKey('unlockedAchievements', next);

      // Zeige Popup für das erste neue Achievement (falls mehrere, kommen nacheinander)
      const firstNew = allAchievements.find(a => a.id === newlyUnlocked[0]);
      if (firstNew) {
        // Nur Popup, wenn schon Initial-Load durch ist (sonst beim ersten Start spammig)
        // Initial-Load: unlockedAchievements ist [] und currentlyUnlocked füllt sich erstmalig
        if (unlockedAchievements.length > 0 || currentlyUnlocked.length === 1) {
          setNewAchievement(firstNew);
        }
      }
    }
  }, [loaded, allAchievements.map(a => a.unlocked).join(',')]);

  const currentWeight = (() => {
    if (weights.length === 0) return settings?.weight || 75;
    const sorted = [...weights].sort((a, b) => b.date.localeCompare(a.date));
    return sorted[0].kg;
  })();

  if (!loaded) return <div style={{ padding: 40, fontFamily: 'Fraunces, serif' }}>Lädt…</div>;

  const dailyTarget = settings ? calcDailyKcal(settings) : 2000;
  const dayEntries = entries.filter(e => e.dateKey === selectedDate);
  const dayActivityEntries = activityEntries.filter(e => e.dateKey === selectedDate);
  const consumed = dayEntries.reduce((s, e) => s + e.kcal, 0);
  const burned = dayActivityEntries.reduce((s, e) => s + e.kcal, 0);
  const remaining = dailyTarget + burned - consumed;

  // Tab-Reihenfolge für Wischgesten (entspricht NavBar)
  const NAV_TABS = ['movement', 'dishes', 'today', 'glossary', 'settings'];

  // Wischgesten zwischen Tabs

  const onTouchStart = (e) => {
    if (!NAV_TABS.includes(view)) return;
    if (e.touches.length !== 1) return;
    swipeStateRef.current = {
      x: e.touches[0].clientX,
      y: e.touches[0].clientY,
      time: Date.now(),
    };
  };

  const onTouchEnd = (e) => {
    const start = swipeStateRef.current;
    swipeStateRef.current = null;
    if (!start) return;
    if (!NAV_TABS.includes(view)) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    const dt = Date.now() - start.time;
    // Schwellenwerte: 60px horizontal, weniger als 80px vertikal, schneller als 600ms
    if (Math.abs(dx) < 60 || Math.abs(dy) > 80 || dt > 600) return;
    const idx = NAV_TABS.indexOf(view);
    if (dx < 0 && idx < NAV_TABS.length - 1) {
      setView(NAV_TABS[idx + 1]);
    } else if (dx > 0 && idx > 0) {
      setView(NAV_TABS[idx - 1]);
    }
  };

  return (
    <div style={styles.app} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      {updateAvailable && (
        <div
          onClick={reloadApp}
          style={{
            position: 'sticky', top: 0, left: 0, right: 0, zIndex: 1000,
            background: '#1A5340', borderBottom: '1px solid #90C8A8',
            padding: '10px 16px',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            cursor: 'pointer',
            fontFamily: 'Inter', fontSize: 13, color: '#FAF6EC',
          }}

            const carbs = dayEntries.reduce((s, e) => s + (e.carbs || 0), 0);
            const fat = dayEntries.reduce((s, e) => s + (e.fat || 0), 0);
            const slots = ['Frühstück', 'Mittag', 'Snack', 'Abend'];
            const slotLines = slots.map(slot => {
              const items = dayEntries.filter(e => e.slot === slot);
              if (!items.length) return null;
              return `**${slot}** (${items.reduce((s,e)=>s+e.kcal,0)} kcal)\n` +
                items.map(e => `  - ${e.foodName}: ${e.qty}${e.unit} → ${e.kcal} kcal`).join('\n');
            }).filter(Boolean).join('\n\n');
            const actLines = dayActs.length
              ? `**Bewegung**\n` + dayActs.map(a => `  - ${a.activityName}: ${a.durationMin} min → +${a.kcal} kcal`).join('\n') : '';
            const coffeeLines = coffeeEntry ? `**Kaffee:** ${coffeeEntry.qty}× → ${coffeeEntry.kcal} kcal\n` : '';
            let text;
            if (deep) {
              const userInfo = settings
                ? `Nutzer: ${settings.sex === 'm' ? 'männlich' : 'weiblich'}, ${settings.age} Jahre, ${settings.height} cm, ${settings.weight} kg, Ziel: ${settings.goal === 'lose' ? 'Abnehmen' : settings.goal === 'gain' ? 'Aufbauen' : 'Halten'}, Tagesziel: ${dailyTarget} kcal`
                : `Tagesziel: ${dailyTarget} kcal`;
              text = `# Torcal Deep-Analyse — ${date}\n\nBitte analysiere meinen Ernährungstag ausführlich als erfahrener Ernährungsberater.\n\n## Persönliche Daten\n${userInfo}\n\n## Tagesbilanz\n- Gegessen: ${consumed} kcal\n- Verbrannt: ${burned} kcal Sport\n- Netto: ${consumed - burned} kcal von ${dailyTarget} kcal\n- Verbleibend: ${dailyTarget + burned - consumed} kcal\n- Makros: Eiweiß ${Math.round(protein)}g · KH ${Math.round(carbs)}g · Fett ${Math.round(fat)}g\n\n## Mahlzeiten\n${slotLines || 'nichts'}\n\n${coffeeLines ? '## Getränke\n' + coffeeLines + '\n' : ''}${actLines ? '## Sport\n' + actLines + '\n\n' : ''}## Gewünschte Analyse\n1. Makro-Verteilung bewerten\n2. Mahlzeiten-Timing bewerten\n3. Was war gut, was besser?\n4. Verbesserungen für morgen\n5. Rezeptideen für Restkalorien`;
            } else {
              text = `# Torcal Tagesexport — ${date}\n\n**Tagesziel:** ${dailyTarget} kcal\n**Gegessen:** ${consumed} kcal\n**Verbrannt:** ${burned} kcal\n**Netto:** ${consumed - burned} kcal\n**Verbleibend:** ${dailyTarget + burned - consumed} kcal\n\n**Makros:** Eiweiß ${Math.round(protein)}g · KH ${Math.round(carbs)}g · Fett ${Math.round(fat)}g\n\n${coffeeLines}${slotLines}${actLines ? '\n\n' + actLines : ''}`;
            }
            navigator.clipboard.writeText(text).then(() => {
              alert(deep ? 'Deep-Analyse kopiert! In neuen Claude-Chat einfügen.' : 'Tag kopiert!');
            }).catch(() => alert(text));
          }}
        />
      )}

      {view === 'intimacy' && (
        <IntimacyView
          log={intimacyLog}
          weights={weights}
          onAdd={async (entry) => {
            await persistIntimacyLog([...intimacyLog, entry]);
          }}
          onDelete={async (id) => {
            await persistIntimacyLog(intimacyLog.filter(e => e.id !== id));
          }}
          onBack={() => setView('today')}
        />
      )}

      {view === 'movement' && (
        <Movement
          activities={activities}
          workouts={workouts}
          currentWeight={currentWeight}
          todayActivityEntries={dayActivityEntries}
          onIncrementActivityEntry={async (entryId, currentDur) => {
            const a = activityEntries.find(x => x.id === entryId);
            if (!a) return;
            const newDur = currentDur * 2;
            const newKcal = calcActivityKcal(a.met, a.weightKg || currentWeight, newDur);
            await persistActivityEntries(activityEntries.map(x => x.id === entryId
              ? { ...x, durationMin: newDur, kcal: newKcal }
              : x));
          }}
          onBack={() => setView('today')}
          onAddActivityEntry={async (entry) => persistActivityEntries([...activityEntries, entry])}
          onSaveActivity={async (newAct) => persistActivities([...activities, newAct])}
          onUseWorkout={async (workout) => {
            // Workout direkt als heutige Aktivitäten eintragen
            const time = new Date().toISOString();
            const newActs = workout.items.map(it => {
              const a = activities.find(x => x.id === it.activityId);
              if (!a) return null;
              const kcal = calcActivityKcal(a.met, currentWeight, it.durationMin);
              return {
                id: crypto.randomUUID(),
                dateKey: todayKey(),
                time,
                activityId: a.id,
                activityName: a.name,
                met: a.met,
                durationMin: it.durationMin,
                weightKg: currentWeight,
                kcal,
              };
            }).filter(Boolean);
            await persistActivityEntries([...activityEntries, ...newActs]);
            alert(`„${workout.name}" eingetragen.`);
          }}
          onDeleteWorkout={async (id) => persistWorkouts(workouts.filter(w => w.id !== id))}
          onRenameWorkout={async (id, newName) => persistWorkouts(workouts.map(w => w.id === id ? { ...w, name: newName } : w))}
          totalSeconds={timerTotalSeconds}
          setTotalSeconds={setTimerTotalSeconds}
          markerInterval={timerMarkerInterval}
          setMarkerInterval={setTimerMarkerInterval}
          transitionSeconds={timerTransitionSeconds}
          setTransitionSeconds={setTimerTransitionSeconds}
          running={timerRunning}
          paused={timerPaused}
          elapsed={timerElapsed}
          finished={timerFinished}
          onStart={timerStart}
          onStop={timerStop}
          onTogglePause={timerTogglePause}
        />
      )}

      {view === 'settings' && (
        <SettingsView
          settings={settings}
          entries={entries}
          glossary={glossary}
          dishes={dishes}
          weights={weights}
          activities={activities}
          workouts={workouts}
          activityEntries={activityEntries}
          notes={notes}
          onNotesChange={persistNotes}
          waterGoal={waterGoal}
          onWaterGoalChange={persistWaterGoal}
          beerKcal={beerKcal}
          onBeerKcalChange={persistBeerKcal}
          cremantKcal={cremantKcal}
          onCremantKcalChange={persistCremantKcal}
          coffeeKcal={coffeeKcal}
          onCoffeeKcalChange={persistCoffeeKcal}
          alcoholLog={alcoholLog}
          intimacyLog={intimacyLog}
          savedAnalyses={savedAnalyses}
          apiKey={apiKey}
          onApiKeyChange={persistApiKey}
          onSave={async (s) => { await persistSettings(s); setView('today'); }}
          onBack={() => setView('today')}
          onImport={async (data) => {
            if (data.settings) await persistSettings(data.settings);
            if (data.glossary) await persistGlossary(data.glossary);
            if (data.dishes) await persistDishes(data.dishes);
            if (data.weights) await persistWeights(data.weights);
            if (data.activities) await persistActivities(data.activities);
            if (data.workouts) await persistWorkouts(data.workouts);
            if (data.activityEntries) await persistActivityEntries(data.activityEntries);
            if (data.entries) await persistEntries(data.entries);
            if (data.notes != null) await persistNotes(data.notes);
            if (data.savedAnalyses) await persistSavedAnalyses(data.savedAnalyses);
            alert('Import erfolgreich');
            setView('today');
          }}
          onLoadRecipes={async () => {
            // 1) Glossar erweitern (idempotent per Name)
            const existingNames = new Set(glossary.map(g => g.name.toLowerCase()));
            const toAddGlossary = RECIPE_EXTRA_GLOSSARY.filter(g => !existingNames.has(g.name.toLowerCase()));
            const nextGlossary = [...glossary, ...toAddGlossary];
            if (toAddGlossary.length > 0) await persistGlossary(nextGlossary);

            // 2) Name → foodId Lookup auf dem (potenziell erweiterten) Glossar
            const byName = new Map(nextGlossary.map(g => [g.name.toLowerCase(), g.id]));

            // 3) Dishes anlegen (idempotent per Name)
            const existingDishNames = new Set(dishes.map(d => d.name.toLowerCase()));
            const newDishes = [];
            let skippedRecipes = [];
            for (const r of RECIPE_DISHES) {
              if (existingDishNames.has(r.name.toLowerCase())) continue;
              const items = [];
              let ok = true;
              for (const [foodName, qty] of r.itemsByName) {
                const foodId = byName.get(foodName.toLowerCase());
                if (!foodId) { ok = false; break; }
                items.push({ foodId, qty, unit: 'g' });
              }
              if (!ok) { skippedRecipes.push(r.name); continue; }
              newDishes.push({
                id: 'd' + crypto.randomUUID().slice(0, 8),
                name: r.name,
                items,
                createdAt: new Date().toISOString(),
              });
            }
            if (newDishes.length > 0) await persistDishes([...dishes, ...newDishes]);
            let msg = `${toAddGlossary.length} Lebensmittel ergänzt, ${newDishes.length} Rezepte angelegt.`;
            if (skippedRecipes.length > 0) msg += `\nÜbersprungen: ${skippedRecipes.join(', ')}`;
            alert(msg);
          }}
        />
      )}

      {view !== 'setup' && view !== 'input' && (
        <NavBar current={view} onNav={(v) => {
          if (v === 'today') setSelectedDate(todayKey());
          setView(v);
        }} />
      )}

      {undoAction && (
        <div style={{
          position: 'fixed',
          bottom: view === 'input' || view === 'setup' ? 20 : 80,
          left: '50%',
          transform: 'translateX(-50%)',
          background: 'rgba(10,46,34,0.97)',
          color: '#FAF6EC',
          padding: '12px 16px',
          borderRadius: 10,
          fontFamily: 'Inter',
          fontSize: 14,
          display: 'flex',
          alignItems: 'center',
          gap: 16,
          boxShadow: '0 8px 32px rgba(0,0,0,0.4)',
          border: '1px solid rgba(250,246,236,0.18)',
          zIndex: 200,
          maxWidth: 'calc(100% - 32px)',
          minWidth: 280,
        }}>
          <span style={{ flex: 1 }}>{undoAction.label}</span>
          <button
            onClick={async () => {
              const action = undoAction;
              setUndoAction(null);
              if (action && action.restore) await action.restore();
            }}
            style={{
              background: 'transparent',
              color: '#FAF6EC',
              border: '1px solid rgba(250,246,236,0.35)',
              borderRadius: 6,
              padding: '6px 14px',
              fontSize: 13,
              fontWeight: 600,
              fontFamily: 'Inter',
              cursor: 'pointer',
              textTransform: 'uppercase',
              letterSpacing: 0.6,
            }}
          >
            Rückgängig
          </button>
        </div>
      )}
    </div>
  );
}

function IntimacyView({ log, weights, onAdd, onDelete, onBack }) {

  const monthlyData = (() => {

function Setup({ onSave, onImport, onSkip }) {

  const target = valid ? calcDailyKcal({ ...s, age: +s.age, height: +s.height, weight: +s.weight }) : null;

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        onImport(data);
      } catch {
        alert('Ungültige Backup-Datei.');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div style={{ ...styles.page, paddingBottom: 40 }}>
      <h1 style={styles.h1}>Einrichtung</h1>

          style={{
            flex: 1, background: 'transparent', color: 'rgba(250,246,236,0.6)',
            border: '1px solid rgba(250,246,236,0.15)', borderRadius: 10,
            padding: '12px 14px', fontFamily: 'Inter', fontSize: 13,
            cursor: 'pointer',
          }}
