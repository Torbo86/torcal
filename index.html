// === EntryEditor (Bearbeiten eines bestehenden Eintrags) ===
function EntryEditor({ entry, glossary, onSave, onDelete, onCancel }) {
  const [qty, setQty] = useState(entry.qty);
  const [unit, setUnit] = useState(entry.unit);
  const [slot, setSlot] = useState(entry.slot);

  // Aus Glossar die kcal/Makros + Einheiten holen (Fallback: nur die im Eintrag verwendete Einheit)
  const food = glossary.find(g => g.id === entry.foodId);
  const availableUnits = food ? food.units : { [entry.unit]: 1 };
  const kcalPer100g = food ? food.kcalPer100g : (entry.kcal / ((entry.qty || 1) * (entry.unit === 'g' ? 1 : 1)) * 100);
  const protein100 = food ? (food.protein || 0) : 0;
  const carbs100 = food ? (food.carbs || 0) : 0;
  const fat100 = food ? (food.fat || 0) : 0;

  const grams = (availableUnits[unit] || 1) * qty;
  const newKcal = Math.round(kcalPer100g * grams / 100);

  const save = () => {
    const newProtein = Math.round(protein100 * grams / 100 * 10) / 10;
    const newCarbs = Math.round(carbs100 * grams / 100 * 10) / 10;
    const newFat = Math.round(fat100 * grams / 100 * 10) / 10;
    onSave({
      ...entry,
      qty, unit, slot,
      kcal: newKcal,
      protein: newProtein, carbs: newCarbs, fat: newFat,
    });
  };

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top, #1A5340 0%, #0D3B2E 100%)', width: '100%', borderRadius: '20px 20px 0 0', padding: 24, maxHeight: '90vh', overflow: 'auto', maxWidth: 480, margin: '0 auto', borderTop: '1px solid rgba(250,246,236,0.15)' }}>
        <h2 style={{ fontFamily: 'Fraunces', margin: '0 0 4px', color: '#FAF6EC', fontWeight: 600 }}>{entry.foodName}</h2>
        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.6)', marginBottom: 20 }} className="num">
          {kcalPer100g} kcal/100g
        </div>

        <div style={{ display: 'flex', gap: 8 }}>
          <div style={{ flex: 1 }}>
            <Field label="Menge">
              <input
                type="text"
                inputMode="decimal"
                value={qty === 0 ? '' : String(qty).replace('.', ',')}
                onChange={e => {
                  let v = e.target.value.replace(',', '.');
                  if (v === '' || /^\d*\.?\d*$/.test(v)) {
                    setQty(v === '' ? 0 : (v.endsWith('.') ? v : parseFloat(v)));
                  }
                }}
                style={styles.input}
              />
            </Field>
          </div>
          <div style={{ flex: 1 }}>
            <Field label="Einheit">
              <select value={unit} onChange={e => setUnit(e.target.value)} style={styles.input}>
                {Object.keys(availableUnits).map(u => <option key={u}>{u}</option>)}
              </select>
            </Field>
          </div>
        </div>

        <Field label="Mahlzeit">
          <select value={slot} onChange={e => setSlot(e.target.value)} style={styles.input}>
            {['Frühstück', 'Mittag', 'Snack', 'Abend'].map(s => <option key={s}>{s}</option>)}
          </select>
        </Field>

        <div style={{ background: 'rgba(250,246,236,0.08)', padding: '12px 16px', borderRadius: 8, marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.7)', textTransform: 'uppercase', letterSpacing: 1 }}>Kalorien</span>
          <span style={{ fontFamily: 'Fraunces', fontSize: 22, fontWeight: 600, color: '#FAF6EC' }} className="num">{newKcal} kcal</span>
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 24 }}>
          <button style={{ ...styles.secondary, flex: 1 }} onClick={onCancel}>Abbrechen</button>
          <button style={{ ...styles.secondary, flex: 1, color: '#E8A89F', borderColor: 'rgba(232,168,159,0.4)' }} onClick={onDelete}>Löschen</button>
          <button style={{ ...styles.primary, flex: 1, marginTop: 0 }} onClick={save}>Speichern</button>
        </div>
      </div>
    </div>
  );
}

// === RepeatYesterdayPicker (Mahlzeit-Auswahl beim "Wie gestern") ===
function RepeatYesterdayPicker({ allEntries, onCancel, onPick }) {
  const yKey = todayKey(new Date(Date.now() - 86400000));
  const yEntries = allEntries.filter(e => e.dateKey === yKey);

  const slots = ['Frühstück', 'Mittag', 'Snack', 'Abend'];
  const grouped = slots
    .map(slot => ({ slot, items: yEntries.filter(e => e.slot === slot) }))
    .filter(g => g.items.length > 0);

  const [selectedSlots, setSelectedSlots] = useState(new Set(grouped.map(g => g.slot)));

  const toggle = (slot) => {
    const next = new Set(selectedSlots);
    if (next.has(slot)) next.delete(slot); else next.add(slot);
    setSelectedSlots(next);
  };

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top, #1A5340 0%, #0D3B2E 100%)', width: '100%', borderRadius: '20px 20px 0 0', padding: 24, maxHeight: '90vh', overflow: 'auto', maxWidth: 480, margin: '0 auto', borderTop: '1px solid rgba(250,246,236,0.15)' }}>
        <h2 style={{ fontFamily: 'Fraunces', margin: '0 0 4px', color: '#FAF6EC', fontWeight: 600 }}>Wie gestern</h2>

        {grouped.length === 0 ? (
          <>
            <p style={{ fontFamily: 'Inter', fontSize: 14, color: 'rgba(250,246,236,0.7)', marginTop: 12 }}>
              Gestern wurde nichts eingetragen.
            </p>
            <button style={{ ...styles.primary, marginTop: 16 }} onClick={onCancel}>OK</button>
          </>
        ) : (
          <>
            <p style={{ fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.7)', marginTop: 8, marginBottom: 16 }}>
              Welche Mahlzeiten von gestern übernehmen?
            </p>

            {grouped.map(({ slot, items }) => {
              const isSelected = selectedSlots.has(slot);
              const slotKcal = items.reduce((s, i) => s + i.kcal, 0);
              return (
                <div
                  key={slot}
                  onClick={() => toggle(slot)}
                  style={{
                    background: isSelected ? '#FAF6EC' : 'rgba(250,246,236,0.06)',
                    color: isSelected ? '#0D3B2E' : '#FAF6EC',
                    border: `1px solid ${isSelected ? '#FAF6EC' : 'rgba(250,246,236,0.2)'}`,
                    borderRadius: 10, padding: 14, marginBottom: 8,
                    cursor: 'pointer', userSelect: 'none',
                  }}
                >
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{
                        width: 20, height: 20, borderRadius: '50%',
                        border: `2px solid ${isSelected ? '#0D3B2E' : 'rgba(250,246,236,0.5)'}`,
                        background: isSelected ? '#0D3B2E' : 'transparent',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        color: '#FAF6EC', fontSize: 12, fontWeight: 700,
                      }}>
                        {isSelected ? '✓' : ''}
                      </span>
                      <span style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }}>{slot}</span>
                    </span>
                    <span style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }} className="num">{slotKcal} kcal</span>
                  </div>
                  <div style={{ fontFamily: 'Inter', fontSize: 12, opacity: 0.7, marginTop: 6, paddingLeft: 30 }}>
                    {items.map(i => `${i.qty} ${i.unit} ${i.foodName}`).join(' · ')}
                  </div>
                </div>
              );
            })}

            <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>
              <button style={{ ...styles.secondary, flex: 1 }} onClick={onCancel}>Abbrechen</button>
              <button
                style={{ ...styles.primary, flex: 1, marginTop: 0, opacity: selectedSlots.size === 0 ? 0.5 : 1 }}
                disabled={selectedSlots.size === 0}
                onClick={() => onPick(selectedSlots)}
              >
                Übernehmen
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// === ActivityEditor (Bearbeiten eines Aktivitätseintrags) ===
function ActivityEditor({ entry, activities, currentWeight, onSave, onDelete, onCancel }) {
  const [duration, setDuration] = useState(entry.durationMin);
  const activity = activities.find(a => a.id === entry.activityId);
  const met = activity?.met || entry.met;
  const newKcal = Math.round(met * currentWeight * (duration / 60));

  const save = () => {
    onSave({
      ...entry,
      durationMin: duration,
      kcal: newKcal,
      met,
      weightKg: currentWeight,
    });
  };

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top, #1A5340 0%, #0D3B2E 100%)', width: '100%', borderRadius: '20px 20px 0 0', padding: 24, maxHeight: '90vh', overflow: 'auto', maxWidth: 480, margin: '0 auto', borderTop: '1px solid rgba(250,246,236,0.15)' }}>
        <h2 style={{ fontFamily: 'Fraunces', margin: '0 0 4px', color: '#FAF6EC', fontWeight: 600 }}>{entry.activityName}</h2>
        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.6)', marginBottom: 20 }} className="num">
          MET {met} · Gewicht {currentWeight} kg
        </div>

        <Field label="Dauer (Minuten)">
          <input
            type="text"
            inputMode="numeric"
            value={duration === 0 ? '' : String(duration)}
            onChange={e => {
              const v = e.target.value;
              if (v === '' || /^\d+$/.test(v)) {
                setDuration(v === '' ? 0 : parseInt(v, 10));
              }
            }}
            style={styles.input}
          />
        </Field>

        <div style={{ background: 'rgba(250,246,236,0.08)', padding: '12px 16px', borderRadius: 8, marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.7)', textTransform: 'uppercase', letterSpacing: 1 }}>Verbrannt</span>
          <span style={{ fontFamily: 'Fraunces', fontSize: 22, fontWeight: 600, color: '#FAF6EC' }} className="num">+{newKcal} kcal</span>
        </div>

        <div style={{ display: 'flex', gap: 8, marginTop: 24 }}>
          <button style={{ ...styles.secondary, flex: 1 }} onClick={onCancel}>Abbrechen</button>
          <button style={{ ...styles.secondary, flex: 1, color: '#E8A89F', borderColor: 'rgba(232,168,159,0.4)' }} onClick={onDelete}>Löschen</button>
          <button style={{ ...styles.primary, flex: 1, marginTop: 0 }} onClick={save}>Speichern</button>
        </div>
      </div>
    </div>
  );
}

function Today({ target, consumed, burned, remaining, entries, activities, activityEntries, allEntries, glossary, dishes, selectedDate, setSelectedDate, onAdd, onAddSpeech, onAddMovement, onDelete, onDeleteMany, onUpdateEntry, onSaveDish, onRepeatYesterday, onDeleteActivity, onUpdateActivity, onDeleteActivities, onSaveWorkout, onGoToStats, onGoToMovement, currentWeight, coffeeCount, onCoffeeAdd, onCoffeeRemove, waterCount, onWaterAdd, onWaterRemove, waterGoal = 8, onExportDay, alcoholActiveToday = false, onAlcoholActivate, onAlcoholDeactivate, beerKcal = 145, cremantKcal = 170, coffeeKcal = 40, alcoholDay = {}, onAlcoholAdd, onAlcoholRemove, streak = 0, achievements = [], unlockedCount = 0, freezesAvailable = 0, freezeUsedDates = [], onConfirmMany, settings }) {
  const isToday = selectedDate === todayKey();
  const netConsumed = Math.max(0, consumed - burned);
  const pct = Math.min(100, (consumed / target) * 100); // Balken = gegessen (brutto)
  const over = consumed > target + burned; // überschritten = gegessen > ziel + sport

  // Makro-Summen (Kaffee-Einträge ausschließen)
  const totals = entries.filter(e => !e.isCoffee && !e.isAlcohol).reduce((acc, e) => ({
    protein: acc.protein + (e.protein || 0),
    carbs: acc.carbs + (e.carbs || 0),
    fat: acc.fat + (e.fat || 0),
  }), { protein: 0, carbs: 0, fat: 0 });
  const hasMacros = totals.protein > 0 || totals.carbs > 0 || totals.fat > 0;

  const slots = ['Frühstück', 'Mittag', 'Snack', 'Abend'];
  // Kaffee-Einträge aus Slot-Anzeige ausblenden (steht im Widget)
  const bySlot = slots.map(slot => ({
    slot,
    items: entries.filter(e => e.slot === slot),
  })); // Alle Slots immer anzeigen
  const dayActivityEntries = activityEntries || [];

  // Kompakt-Modus + aufgeklappte Slots
  const [compact, setCompact] = useState(() => {
    try { return JSON.parse(localStorage.getItem('torcal_compact') || 'false'); } catch { return false; }
  });
  const [collapsedSlots, setCollapsedSlots] = useState(new Set()); // leere Set = alle offen
  const [showStreakInfo, setShowStreakInfo] = useState(false);

  const toggleSlot = (slot) => {
    setCollapsedSlots(prev => {
      const next = new Set(prev);
      if (next.has(slot)) next.delete(slot);
      else next.add(slot);
      return next;
    });
  };

  // === Auswahl-Modus + Editieren ===
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set()); // 'e:foo' für Mahlzeit, 'a:bar' für Aktivität
  const [editingEntry, setEditingEntry] = useState(null);
  const [editingActivity, setEditingActivity] = useState(null);
  const [savingDish, setSavingDish] = useState(false);
  const [savingWorkout, setSavingWorkout] = useState(false);
  const [dishName, setDishName] = useState('');
  const [workoutName, setWorkoutName] = useState('');
  const [showRepeatPicker, setShowRepeatPicker] = useState(false);

  // Hilfsableitungen für Auswahl
  const selectedFoodIds = new Set([...selectedIds].filter(id => !id.startsWith('a:')).map(id => id.startsWith('e:') ? id.slice(2) : id));
  const selectedActivityIds = new Set([...selectedIds].filter(id => id.startsWith('a:')).map(id => id.slice(2)));
  const hasFoodSelection = selectedFoodIds.size > 0;
  const hasActivitySelection = selectedActivityIds.size > 0;
  const hasMixedSelection = hasFoodSelection && hasActivitySelection;

  // Beim Verlassen des Auswahl-Modus: Auswahl leeren
  const exitSelectMode = () => {
    setSelectMode(false);
    setSelectedIds(new Set());
    setSavingDish(false);
    setSavingWorkout(false);
    setDishName('');
    setWorkoutName('');
  };

  const toggleSelect = (id) => {
    const next = new Set(selectedIds);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelectedIds(next);
  };

  const toggleSlotSelect = (slot, items) => {
    const next = new Set(selectedIds);
    const allSelected = items.every(i => next.has('e:' + i.id));
    if (allSelected) {
      items.forEach(i => next.delete('e:' + i.id));
    } else {
      items.forEach(i => next.add('e:' + i.id));
    }
    setSelectedIds(next);
  };

  const onTapEntry = (entry) => {
    if (selectMode) toggleSelect('e:' + entry.id);
    else setEditingEntry(entry);
  };

  const handleSaveDishFromSelection = async () => {
    if (!dishName.trim() || selectedFoodIds.size === 0) return;
    const items = entries
      .filter(e => selectedFoodIds.has(e.id) && e.foodId)
      .map(e => ({ foodId: e.foodId, qty: e.qty, unit: e.unit }));
    if (items.length === 0) {
      alert('Keine bekannten Lebensmittel in der Auswahl.');
      return;
    }
    const dish = {
      id: 'd' + crypto.randomUUID().slice(0, 8),
      name: dishName.trim(),
      items,
      createdAt: new Date().toISOString(),
    };
    await onSaveDish(dish);
    exitSelectMode();
    alert(`„${dish.name}" gespeichert.`);
  };

  const handleSaveWorkoutFromSelection = async () => {
    if (!workoutName.trim() || selectedActivityIds.size === 0) return;
    const dayActs = activityEntries.filter(a => a.dateKey === selectedDate);
    const items = dayActs
      .filter(a => selectedActivityIds.has(a.id) && a.activityId)
      .map(a => ({ activityId: a.activityId, durationMin: a.durationMin }));
    if (items.length === 0) {
      alert('Keine bekannten Aktivitäten in der Auswahl.');
      return;
    }
    const workout = {
      id: 'w' + crypto.randomUUID().slice(0, 8),
      name: workoutName.trim(),
      items,
      createdAt: new Date().toISOString(),
    };
    await onSaveWorkout(workout);
    exitSelectMode();
    alert(`„${workout.name}" gespeichert.`);
  };

  const handleDeleteSelection = async () => {
    if (selectedIds.size === 0) return;
    if (!confirm(`${selectedIds.size} ${selectedIds.size === 1 ? 'Eintrag' : 'Einträge'} löschen?`)) return;
    if (selectedFoodIds.size > 0) await onDeleteMany(selectedFoodIds);
    if (selectedActivityIds.size > 0) await onDeleteActivities(selectedActivityIds);
    exitSelectMode();
  };

  const dayShift = (n) => {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() + n);
    setSelectedDate(todayKey(d));
  };

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
        {selectMode ? (
          <>
            <button style={styles.iconBtn} onClick={exitSelectMode} aria-label="Auswahl beenden"><X size={20} /></button>
            <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, color: '#FAF6EC' }} className="num">
              {selectedIds.size} ausgewählt
            </div>
            <div style={{ width: 40 }} />
          </>
        ) : (
          <>
            <button style={styles.iconBtn} onClick={() => dayShift(-1)}><ChevronLeft size={20} /></button>
            <div style={{ fontFamily: 'Inter', fontSize: 13, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase', color: 'rgba(250,246,236,0.7)' }}>
              {isToday ? 'Heute' : fmtDate(selectedDate)}
            </div>
            <button style={styles.iconBtn} onClick={() => dayShift(1)}><ChevronRight size={20} /></button>
          </>
        )}
      </div>

      <div style={{ textAlign: 'center', padding: '24px 0 32px' }}>
        <div style={{ fontFamily: 'Inter', fontSize: 12, textTransform: 'uppercase', letterSpacing: 1.5, color: 'rgba(250,246,236,0.6)' }}>
          {over ? 'Über Limit' : 'Verbleibend'}
        </div>
        <div style={{ fontFamily: 'Fraunces', fontSize: 72, fontWeight: 500, lineHeight: 1, color: over ? '#E8A89F' : '#FAF6EC', marginTop: 8 }} className="num">
          {Math.abs(remaining)}
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 14, color: 'rgba(250,246,236,0.6)', marginTop: 6 }} className="num">
          {consumed} von {target} kcal{burned > 0 ? ` · netto ${netConsumed}` : ''}
        </div>

        <div style={{ height: 6, background: 'rgba(10,46,34,0.5)', borderRadius: 3, marginTop: 20, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${pct}%`, background: over ? '#E8A89F' : '#FAF6EC', transition: 'width 400ms ease' }} />
        </div>

        {(hasMacros || burned > 0) && (
          <div style={{ marginTop: 18, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {hasMacros && (() => {
              // Zielwerte: Eiweiß 1.2g/kg, KH 45% kcal, Fett 30% kcal
              const proteinGoal = Math.round((settings?.weight || 80) * 1.2);
              const carbsGoal = Math.round(target * 0.45 / 4);
              const fatGoal = Math.round(target * 0.30 / 9);
              const macros = [
                { label: 'Eiweiß', val: Math.round(totals.protein), goal: proteinGoal, unit: 'g' },
                { label: 'KH', val: Math.round(totals.carbs), goal: carbsGoal, unit: 'g' },
                { label: 'Fett', val: Math.round(totals.fat), goal: fatGoal, unit: 'g' },
              ];
              return macros.map(({ label, val, goal, unit }) => {
                const pct = Math.min(100, Math.round(val / goal * 100));
                const done = pct >= 100;
                const color = done ? '#90C8A8' : pct > 60 ? '#FAF6EC' : 'rgba(250,246,236,0.7)';
                return (
                  <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.5)', width: 36, flexShrink: 0 }}>{label}</div>
                    <div style={{ flex: 1, height: 6, background: 'rgba(250,246,236,0.12)', borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: pct + '%', background: done ? '#90C8A8' : '#FAF6EC', borderRadius: 3, transition: 'width 300ms ease' }} />
                    </div>
                    <div style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 600, color, minWidth: 60, textAlign: 'right' }} className="num">
                      {val}<span style={{ fontSize: 9, opacity: 0.6 }}>/{goal}{unit}</span>
                    </div>
                  </div>
                );
              });
            })()}
            {burned > 0 && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 4 }}>
                <div style={{ fontFamily: 'Inter', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.5)', width: 36, flexShrink: 0 }}>Sport</div>
                <div style={{ flex: 1 }} />
                <div style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 600, color: '#90C8A8' }} className="num">+{burned} kcal</div>
              </div>
            )}
          </div>
        )}

        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 8, marginTop: 14 }}>
          <button onClick={onGoToStats} style={{
            background: 'rgba(250,246,236,0.08)', color: 'rgba(250,246,236,0.85)',
            border: '1px solid rgba(250,246,236,0.18)', borderRadius: 6,
            padding: '6px 14px', fontFamily: 'Inter', fontSize: 11, fontWeight: 600,
            textTransform: 'uppercase', letterSpacing: 0.8, cursor: 'pointer',
          }}>Auswertung →</button>
          {streak > 0 && (
            <button
              onClick={() => setShowStreakInfo(true)}
              style={{
                display: 'flex', alignItems: 'center', gap: 4,
                background: streak >= 100 ? 'rgba(255,215,0,0.20)' : streak >= 30 ? 'rgba(255,215,0,0.15)' : streak >= 7 ? 'rgba(255,140,0,0.15)' : 'rgba(250,246,236,0.08)',
                border: `1px solid ${streak >= 100 ? 'rgba(255,215,0,0.5)' : streak >= 30 ? 'rgba(255,215,0,0.4)' : streak >= 7 ? 'rgba(255,140,0,0.4)' : 'rgba(250,246,236,0.18)'}`,
                borderRadius: 6, padding: '6px 10px', cursor: 'pointer',
              }}
            >
              <span style={{ fontSize: 14 }}>
                {streak >= 365 ? '🌟' : streak >= 180 ? '🚀' : streak >= 100 ? '👑' : streak >= 60 ? '💎' : streak >= 30 ? '🏆' : streak >= 14 ? '💪' : streak >= 7 ? '🔥' : streak >= 3 ? '⚡' : '🌱'}
              </span>
              <span style={{ fontFamily: 'Inter', fontSize: 11, fontWeight: 700, color: '#FAF6EC' }} className="num">{streak}d</span>
            </button>
          )}
        </div>
      </div>

      {bySlot.length === 0 && dayActivityEntries.length === 0 && (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'rgba(250,246,236,0.5)', fontFamily: 'Inter', fontSize: 14 }}>
          Noch nichts eingetragen{isToday ? '' : ' an diesem Tag'}.
        </div>
      )}



      {(isToday || selectedDate > todayKey()) && !selectMode && (
        <>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...styles.primary, flex: 1 }} onClick={() => onAdd(null)}><Plus size={18} style={{ marginRight: 8 }} /> {selectedDate > todayKey() ? 'Planen' : 'Hinzufügen'}</button>
            <button style={{ ...styles.primary, width: 64, padding: 16 }} onClick={() => onAddSpeech()} aria-label="Spracheingabe"><Mic size={20} /></button>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {isToday && <button style={{ ...styles.secondary, flex: 1 }} onClick={() => setShowRepeatPicker(true)}>Wie gestern</button>}
            {(entries.length > 0 || dayActivityEntries.length > 0) && (
              <button style={{ ...styles.secondary, flex: 1 }} onClick={() => setSelectMode(true)}>Auswählen</button>
            )}
          </div>
        </>
      )}


      {bySlot.map(({ slot, items }) => {
        const allSelected = items.every(i => selectedIds.has('e:' + i.id));
        const someSelected = !allSelected && items.some(i => selectedIds.has('e:' + i.id));
        const slotKcal = items.reduce((s, i) => s + i.kcal, 0);
        const isCollapsed = collapsedSlots.has(slot) && !selectMode;
        return (
          <div key={slot} style={{ marginBottom: isCollapsed ? 8 : 20 }}>
            {/* Slot-Header — klickbar zum Auf/Zuklappen */}
            <div
              onClick={selectMode
                ? () => toggleSlotSelect(slot, items)
                : () => toggleSlot(slot)}
              style={{
                fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2,
                color: 'rgba(250,246,236,0.7)',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                cursor: 'pointer', userSelect: 'none',
                padding: '6px 0',
                marginBottom: isCollapsed ? 0 : 6,
              }}
            >
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {selectMode && (
                  <span style={{
                    width: 18, height: 18, borderRadius: 4,
                    border: `2px solid ${allSelected || someSelected ? '#FAF6EC' : 'rgba(250,246,236,0.4)'}`,
                    background: allSelected ? '#FAF6EC' : someSelected ? 'rgba(250,246,236,0.3)' : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#0D3B2E', fontSize: 12, fontWeight: 700,
                  }}>
                    {allSelected ? '✓' : someSelected ? '–' : ''}
                  </span>
                )}
                <span>{slot}</span>
                {!selectMode && (
                  <span style={{ fontSize: 10, color: 'rgba(250,246,236,0.4)' }}>
                    {isCollapsed ? '▸' : '▾'} {items.length} {items.length === 1 ? 'Eintrag' : 'Einträge'}
                  </span>
                )}
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span className="num" style={{ fontWeight: 600 }}>{slotKcal} kcal</span>

                      width: 22, height: 22, borderRadius: '50%',

                      display: 'flex', alignItems: 'center', justifyContent: 'center',

                // === KOMPAKT-MODUS ===
                <div
                  key={e.id}
                  onClick={() => onTapEntry(e)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 8,
                    padding: '6px 10px', marginBottom: 3,
                    background: isSelected ? 'rgba(250,246,236,0.18)' : 'rgba(250,246,236,0.07)',
                    borderRadius: 8, cursor: 'pointer',
                    border: isSelected ? '1px solid rgba(250,246,236,0.4)' : '1px solid transparent',
                    userSelect: 'none',
                  }}
                >
                  {selectMode && (
                    <span style={{
                      width: 18, height: 18, borderRadius: '50%',
                      border: `2px solid ${isSelected ? '#FAF6EC' : 'rgba(250,246,236,0.3)'}`,
                      background: isSelected ? '#FAF6EC' : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: '#0D3B2E', fontSize: 11, flexShrink: 0,
                    }}>{isSelected ? '✓' : ''}</span>

                  <span style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 500, color: '#FAF6EC', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{e.foodName}</span>
                  <span style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.5)', flexShrink: 0 }} className="num">{e.qty}{e.unit}</span>
                  <span style={{ fontFamily: 'Fraunces', fontSize: 15, fontWeight: 600, color: '#FAF6EC', flexShrink: 0 }} className="num">{e.kcal}</span>
                  {!selectMode && (
                    <button onClick={(ev) => { ev.stopPropagation(); onDelete(e.id); }}
                      style={{ background: 'none', border: 'none', color: 'rgba(250,246,236,0.3)', cursor: 'pointer', padding: 2, flexShrink: 0 }}>
                      <X size={12} />
                    </button>
                  )}
                </div>
              ) : (
                // === NORMAL-MODUS ===
                <div
                  key={e.id}
                  onClick={() => onTapEntry(e)}
                  style={{
                    ...styles.entryRow,
                    cursor: 'pointer',
                    background: '#FAF6EC',
                    borderColor: isSelected ? '#0D3B2E' : 'rgba(13,59,46,0.1)',
                    borderWidth: isSelected ? 2 : 1,
                    userSelect: 'none',
                    marginBottom: 6,
                  }}
                >
                  {selectMode && (
                    <span style={{
                      width: 22, height: 22, borderRadius: '50%',
                      border: `2px solid ${isSelected ? '#0D3B2E' : 'rgba(13,59,46,0.3)'}`,
                      background: isSelected ? '#0D3B2E' : 'transparent',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: '#FAF6EC', fontSize: 13, fontWeight: 700,
                      marginRight: 10, flexShrink: 0,
                    }}>{isSelected ? '✓' : ''}</span>
                  )}
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{e.foodName}</div>
                    <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                      {e.qty} {e.unit} · {fmtTime(e.time)}
                    </div>
                  </div>
                  <div style={{ fontFamily: 'Fraunces', fontSize: 18, fontWeight: 500, marginRight: selectMode ? 0 : 12 }} className="num">{e.kcal}</div>
                  {!selectMode && (
                    <button style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }} onClick={(ev) => { ev.stopPropagation(); onDelete(e.id); }}><Trash2 size={16} /></button>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
      {/* === Bewegung-Sektion ganz unten === */}
      {dayActivityEntries.length > 0 && (
        <div style={{ marginBottom: 24, marginTop: 32, paddingTop: 16, borderTop: '1px solid rgba(250,246,236,0.1)' }}>
          <div
            onClick={selectMode ? () => {
              // Aktivitäten in selectMode auswählen toggle
              const next = new Set(selectedIds);
              const allSelected = dayActivityEntries.every(a => next.has('a:' + a.id));
              if (allSelected) {
                dayActivityEntries.forEach(a => next.delete('a:' + a.id));
              } else {
                dayActivityEntries.forEach(a => next.add('a:' + a.id));
              }
              setSelectedIds(next);
            } : undefined}
            style={{
              fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2,
              color: 'rgba(250,246,236,0.7)', marginBottom: 8,
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              cursor: selectMode ? 'pointer' : 'default', userSelect: 'none',
            }}
          >
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {selectMode && (
                <span style={{
                  width: 18, height: 18, borderRadius: 4,
                  border: `2px solid ${dayActivityEntries.every(a => selectedIds.has('a:' + a.id)) ? '#FAF6EC' : 'rgba(250,246,236,0.4)'}`,
                  background: dayActivityEntries.every(a => selectedIds.has('a:' + a.id)) ? '#FAF6EC' : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  color: '#0D3B2E', fontSize: 12, fontWeight: 700,
                }}>
                  {dayActivityEntries.every(a => selectedIds.has('a:' + a.id)) ? '✓' : ''}
                </span>
              )}
              Bewegung
            </span>
            <span className="num">+{burned} kcal</span>
          </div>
          {dayActivityEntries.map(a => {
            const isSelected = selectedIds.has('a:' + a.id);
            return (
              <div
                key={a.id}
                onClick={() => {
                  if (selectMode) {
                    const next = new Set(selectedIds);
                    if (next.has('a:' + a.id)) next.delete('a:' + a.id); else next.add('a:' + a.id);
                    setSelectedIds(next);
                  } else {
                    setEditingActivity(a);
                  }
                }}
                style={{
                  ...styles.entryRow,
                  cursor: 'pointer',
                  background: '#FAF6EC',
                  borderColor: isSelected ? '#0D3B2E' : 'rgba(13,59,46,0.1)',
                  borderWidth: isSelected ? 2 : 1,
                  userSelect: 'none',
                }}
              >
                {selectMode && (
                  <span style={{
                    width: 22, height: 22, borderRadius: '50%',
                    border: `2px solid ${isSelected ? '#0D3B2E' : 'rgba(13,59,46,0.3)'}`,
                    background: isSelected ? '#0D3B2E' : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: '#FAF6EC', fontSize: 13, fontWeight: 700,
                    marginRight: 10, flexShrink: 0,
                  }}>{isSelected ? '✓' : ''}</span>
                )}
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{a.activityName}</div>
                  <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                    {a.durationMin} min · {fmtTime(a.time)}
                  </div>
                </div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 18, fontWeight: 500, marginRight: selectMode ? 0 : 12, color: '#0D3B2E' }} className="num">+{a.kcal}</div>
                {!selectMode && (
                  <button style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }} onClick={(ev) => { ev.stopPropagation(); onDeleteActivity(a.id); }}><Trash2 size={16} /></button>
                )}
              </div>
            );
          })}
        </div>
      )}

      {isToday && !selectMode && (
        <div style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
          {/* Kaffee-Tracker */}
          <div style={{
            flex: 1, minWidth: 0,
            background: 'rgba(250,246,236,0.08)',
            border: '1px solid rgba(250,246,236,0.15)',
            borderRadius: 12, padding: '10px 10px',
            display: 'flex', alignItems: 'center', gap: 6,
          }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>☕</span>
            <div style={{ flex: 1, minWidth: 0, overflow: 'hidden' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.6)', textTransform: 'uppercase', letterSpacing: 1 }}>Kaffee</div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 600, color: '#FAF6EC', whiteSpace: 'nowrap' }} className="num">
                {coffeeCount} <span style={{ fontSize: 10, fontFamily: 'Inter', color: 'rgba(250,246,236,0.5)', fontWeight: 400 }}>×{coffeeKcal} kcal</span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 3, flexShrink: 0 }}>
              <button onClick={onCoffeeRemove} disabled={coffeeCount === 0} style={{
                width: 30, height: 30, borderRadius: 6,
                background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)',
                color: '#FAF6EC', fontSize: 18, cursor: coffeeCount === 0 ? 'default' : 'pointer',
                opacity: coffeeCount === 0 ? 0.3 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
              }}>−</button>
              <button onClick={onCoffeeAdd} style={{
                width: 30, height: 30, borderRadius: 6,
                background: 'rgba(250,246,236,0.15)', border: '1px solid rgba(250,246,236,0.3)',
                color: '#FAF6EC', fontSize: 18, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
              }}>+</button>
            </div>
          </div>

          {/* Wasser-Tracker */}
          <div style={{
            flex: 1, minWidth: 0,
            background: 'rgba(250,246,236,0.08)',
            border: '1px solid rgba(250,246,236,0.15)',
            borderRadius: 12, padding: '10px 10px',
            display: 'flex', alignItems: 'center', gap: 6,
          }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>💧</span>
            <div style={{ flex: 1, minWidth: 0, overflow: 'hidden' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.6)', textTransform: 'uppercase', letterSpacing: 1 }}>Wasser</div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 600, color: waterCount >= waterGoal ? '#90C8A8' : '#FAF6EC', whiteSpace: 'nowrap' }} className="num">
                {waterCount}/{waterGoal}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 3, flexShrink: 0 }}>
              <button onClick={onWaterRemove} disabled={waterCount === 0} style={{
                width: 30, height: 30, borderRadius: 6,
                background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)',
                color: '#FAF6EC', fontSize: 18, cursor: waterCount === 0 ? 'default' : 'pointer',
                opacity: waterCount === 0 ? 0.3 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
              }}>−</button>
              <button onClick={onWaterAdd} style={{
                width: 30, height: 30, borderRadius: 6,
                background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)',
                color: '#FAF6EC', fontSize: 18, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
              }}>+</button>
            </div>
          </div>
        </div>
      )}

      {/* Alkohol-Aktivieren Hint — wenn nicht aktiv und nicht im Auswahlmodus */}
      {!selectMode && !alcoholActiveToday && (
        <div style={{ marginBottom: 4 }}>
          <button
            onClick={onAlcoholActivate}
            style={{
              width: '100%', background: 'rgba(250,246,236,0.04)',
              border: '1px dashed rgba(250,246,236,0.2)', borderRadius: 12,
              padding: '8px 12px', cursor: 'pointer',
              fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.5)',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            }}
          >
            <span style={{ fontSize: 13 }}>🍺</span>
            <span>Alkohol für diesen Tag tracken</span>
          </button>
        </div>
      )}

      {/* Alkohol-Kachel — pro Tag */}
      {!selectMode && alcoholActiveToday && (
        <div style={{ marginBottom: 4 }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
          {/* Bier */}
          <div style={{ flex: 1, minWidth: 0, background: 'rgba(250,246,236,0.08)', border: '1px solid rgba(250,246,236,0.15)', borderRadius: 12, padding: '10px 10px', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>🍺</span>
            <div style={{ flex: 1, minWidth: 0, overflow: 'hidden' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.6)', textTransform: 'uppercase', letterSpacing: 1 }}>Bier</div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 600, color: '#FAF6EC', whiteSpace: 'nowrap' }} className="num">
                {alcoholDay.beer || 0} <span style={{ fontSize: 10, fontFamily: 'Inter', color: 'rgba(250,246,236,0.5)', fontWeight: 400 }}>×{beerKcal} kcal</span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 3, flexShrink: 0 }}>
              <button onClick={() => onAlcoholRemove('beer')} disabled={!alcoholDay.beer} style={{ width: 30, height: 30, borderRadius: 6, background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)', color: '#FAF6EC', fontSize: 18, cursor: !alcoholDay.beer ? 'default' : 'pointer', opacity: !alcoholDay.beer ? 0.3 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }}>−</button>
              <button onClick={() => onAlcoholAdd('beer')} style={{ width: 30, height: 30, borderRadius: 6, background: 'rgba(250,246,236,0.15)', border: '1px solid rgba(250,246,236,0.3)', color: '#FAF6EC', fontSize: 18, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }}>+</button>
            </div>
          </div>
          {/* Wein */}
          <div style={{ flex: 1, minWidth: 0, background: 'rgba(250,246,236,0.08)', border: '1px solid rgba(250,246,236,0.15)', borderRadius: 12, padding: '10px 10px', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>🥂</span>
            <div style={{ flex: 1, minWidth: 0, overflow: 'hidden' }}>
              <div style={{ fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.6)', textTransform: 'uppercase', letterSpacing: 1 }}>Wein</div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 600, color: '#FAF6EC', whiteSpace: 'nowrap' }} className="num">
                {alcoholDay.cremant || 0} <span style={{ fontSize: 10, fontFamily: 'Inter', color: 'rgba(250,246,236,0.5)', fontWeight: 400 }}>×{cremantKcal} kcal</span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 3, flexShrink: 0 }}>
              <button onClick={() => onAlcoholRemove('cremant')} disabled={!alcoholDay.cremant} style={{ width: 30, height: 30, borderRadius: 6, background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)', color: '#FAF6EC', fontSize: 18, cursor: !alcoholDay.cremant ? 'default' : 'pointer', opacity: !alcoholDay.cremant ? 0.3 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }}>−</button>
              <button onClick={() => onAlcoholAdd('cremant')} style={{ width: 30, height: 30, borderRadius: 6, background: 'rgba(250,246,236,0.15)', border: '1px solid rgba(250,246,236,0.3)', color: '#FAF6EC', fontSize: 18, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }}>+</button>
            </div>
          </div>
          </div>
          {/* Tracker schließen — nur wenn keine Einträge */}
          {!alcoholDay.beer && !alcoholDay.cremant && (
            <button
              onClick={onAlcoholDeactivate}
              style={{
                width: '100%', background: 'transparent', border: 'none',
                padding: '4px', cursor: 'pointer',
                fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.4)',
              }}
            >
              Tracker für heute schließen
            </button>
          )}
        </div>
      )}

      {!isToday && selectedDate < todayKey() && entries.length > 0 && !selectMode && (
        <button style={styles.secondary} onClick={() => setSelectMode(true)}>Auswählen</button>
      )}

      {/* Spacer damit letzte Einträge nicht von der fixierten Aktionsleiste verdeckt werden */}
      {selectMode && selectedIds.size > 0 && <div style={{ height: 80 }} />}

      {/* Auswahl-Aktionsleiste am Boden - fixed overlay */}
      {selectMode && selectedIds.size > 0 && (
        <div style={{
          position: 'fixed', bottom: 64, left: 0, right: 0,
          padding: '14px 20px',
          background: 'rgba(10,46,34,0.97)', backdropFilter: 'blur(12px)',
          borderTop: '1px solid rgba(250,246,236,0.15)',
          zIndex: 50,
          maxWidth: 480, margin: '0 auto',
        }}>
          {savingDish ? (
            <div style={{ display: 'flex', gap: 8 }}>
              <input
                placeholder="Name des Gerichts"
                value={dishName}
                onChange={e => setDishName(e.target.value)}
                style={{ ...styles.input, flex: 1 }}
                autoFocus
              />
              <button onClick={handleSaveDishFromSelection} style={{ ...styles.primary, marginTop: 0, width: 'auto', padding: '0 18px' }}>Speichern</button>
            </div>
          ) : savingWorkout ? (
            <div style={{ display: 'flex', gap: 8 }}>
              <input
                placeholder="Name des Workouts"
                value={workoutName}
                onChange={e => setWorkoutName(e.target.value)}
                style={{ ...styles.input, flex: 1 }}
                autoFocus
              />
              <button onClick={handleSaveWorkoutFromSelection} style={{ ...styles.primary, marginTop: 0, width: 'auto', padding: '0 18px' }}>Speichern</button>
            </div>
          ) : hasMixedSelection ? (
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <div style={{ flex: 1, fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.7)' }}>
                Mischung — bitte nur Mahlzeiten oder nur Bewegung speichern
              </div>
              <button
                onClick={handleDeleteSelection}
                style={{
                  background: 'transparent', color: '#E8A89F',
                  border: '1px solid rgba(232,168,159,0.4)', borderRadius: 10,
                  padding: '0 18px', height: 44, fontSize: 14, fontWeight: 500,
                }}
              >Löschen</button>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {hasFoodSelection && (
                <button onClick={() => setSavingDish(true)}
                  style={{ ...styles.primary, marginTop: 0, flex: 1 }}>Als Gericht speichern</button>
              )}
              {hasActivitySelection && (
                <button onClick={() => setSavingWorkout(true)}
                  style={{ ...styles.primary, marginTop: 0, flex: 1 }}>Als Workout speichern</button>
              )}
              {hasFoodSelection && (
                <CopyToDayButton
                  count={[...selectedIds].filter(id => id.startsWith('e:')).length}
                  onCopy={(targetDate, targetSlot) => {
                    const selected = entries.filter(e => selectedIds.has('e:' + e.id));
                    const copied = selected.map(e => ({
                      ...e,
                      id: crypto.randomUUID(),
                      dateKey: targetDate,
                      time: new Date().toISOString(),
                      ...(targetSlot ? { slot: targetSlot } : {}),
                    }));
                    onConfirmMany(copied);
                    exitSelectMode();
                  }}
                />
              )}
              <button onClick={handleDeleteSelection}
                style={{ background: 'transparent', color: '#E8A89F', border: '1px solid rgba(232,168,159,0.4)', borderRadius: 10, padding: '0 18px', fontSize: 14, fontWeight: 500 }}>
                Löschen
              </button>
            </div>
          )}
        </div>
      )}

      {/* Wie gestern - Mahlzeit-Picker */}
      {showRepeatPicker && (
        <RepeatYesterdayPicker
          allEntries={allEntries}
          onCancel={() => setShowRepeatPicker(false)}
          onPick={async (slotsToRepeat) => {
            await onRepeatYesterday(slotsToRepeat);
            setShowRepeatPicker(false);
          }}
        />
      )}

      {/* Edit-Sheet für Mahlzeiten */}
      {editingEntry && (
        <EntryEditor
          entry={editingEntry}
          glossary={glossary}
          onSave={async (updated) => {
            await onUpdateEntry(updated);
            setEditingEntry(null);
          }}
          onDelete={async () => {
            await onDelete(editingEntry.id);
            setEditingEntry(null);
          }}
          onCancel={() => setEditingEntry(null)}
        />
      )}

      {/* Edit-Sheet für Aktivitäten */}
      {editingActivity && (
        <ActivityEditor
          entry={editingActivity}
          activities={activities}
          currentWeight={currentWeight}
          onSave={async (updated) => {
            await onUpdateActivity(updated);
            setEditingActivity(null);
          }}
          onDelete={async () => {
            await onDeleteActivity(editingActivity.id);
            setEditingActivity(null);
          }}
          onCancel={() => setEditingActivity(null)}
        />
      )}

      {/* Streak Info Modal */}
      {showStreakInfo && (
        <div
          onClick={() => setShowStreakInfo(false)}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              background: '#0A2E22', borderTopLeftRadius: 20, borderTopRightRadius: 20,
              padding: '24px 20px 32px', width: '100%', color: '#FAF6EC',
              maxHeight: '85vh', overflowY: 'auto',
            }}
          >
            <div style={{ width: 40, height: 4, background: 'rgba(250,246,236,0.3)', borderRadius: 2, margin: '0 auto 20px' }} />

            {/* Streak-Header */}
            <div style={{ textAlign: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 56 }}>
                {streak >= 365 ? '🌟' : streak >= 180 ? '🚀' : streak >= 100 ? '👑' : streak >= 60 ? '💎' : streak >= 30 ? '🏆' : streak >= 14 ? '💪' : streak >= 7 ? '🔥' : streak >= 3 ? '⚡' : '🌱'}
              </div>
              <div style={{ fontFamily: 'Fraunces', fontSize: 40, fontWeight: 600, marginTop: 4 }} className="num">{streak}</div>
              <div style={{ fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.7)' }}>
                {streak === 1 ? 'Tag in Folge' : 'Tage in Folge'}
              </div>

              {/* Nächste Streak-Stufe */}
              {(() => {
                const nextStreak = achievements.find(a => a.group === 'streak' && !a.unlocked);
                if (!nextStreak) return null;
                const remaining = nextStreak.threshold - streak;
                return (
                  <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.5)', marginTop: 8 }}>
                    Noch {remaining} {remaining === 1 ? 'Tag' : 'Tage'} bis {nextStreak.emoji} {nextStreak.name}

// === ImageCropper: Zuschneiden vor Analyse ===
function ImageCropper({ imageDataUrl, onCrop, onCancel }) {
  const canvasRef = useRef(null);
  const [crop, setCrop] = useState({ x: 10, y: 10, w: 80, h: 80 }); // in Prozent
  const [dragging, setDragging] = useState(null); // null | 'move' | 'br'
  const [startPos, setStartPos] = useState(null);
  const imgRef = useRef(null);

  const onTouchStart = (e, type) => {
    e.stopPropagation();
    const t = e.touches[0];
    setDragging(type);
    setStartPos({ x: t.clientX, y: t.clientY, crop: { ...crop } });
  };

  const onTouchMove = (e) => {
    if (!dragging || !startPos) return;
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvasRef.current?.getBoundingClientRect();
    if (!rect) return;
    const dx = (t.clientX - startPos.x) / rect.width * 100;
    const dy = (t.clientY - startPos.y) / rect.height * 100;
    if (dragging === 'move') {
      setCrop(prev => ({
        ...prev,
        x: Math.max(0, Math.min(100 - startPos.crop.w, startPos.crop.x + dx)),
        y: Math.max(0, Math.min(100 - startPos.crop.h, startPos.crop.y + dy)),
      }));
    } else if (dragging === 'br') {
      setCrop(prev => ({
        ...prev,
        w: Math.max(10, Math.min(100 - startPos.crop.x, startPos.crop.w + dx)),
        h: Math.max(10, Math.min(100 - startPos.crop.y, startPos.crop.h + dy)),
      }));
    }
  };

  const onTouchEnd = () => { setDragging(null); setStartPos(null); };

  const doCrop = () => {
    const img = imgRef.current;
    if (!img) return;
    const canvas = document.createElement('canvas');
    const sx = img.naturalWidth * crop.x / 100;
    const sy = img.naturalHeight * crop.y / 100;
    const sw = img.naturalWidth * crop.w / 100;
    const sh = img.naturalHeight * crop.h / 100;
    const MAX = 1024;
    let ow = sw, oh = sh;
    if (ow > MAX || oh > MAX) { const s = MAX / Math.max(ow, oh); ow = Math.round(ow*s); oh = Math.round(oh*s); }
    canvas.width = ow; canvas.height = oh;
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, ow, oh);
    const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    onCrop(base64, 'image/jpeg');
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 200, display: 'flex', flexDirection: 'column' }}
      onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
      <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}
        ref={canvasRef}>
        <img ref={imgRef} src={imageDataUrl} alt="crop"
          style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }} />
        {/* Overlay */}
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none',
          background: `linear-gradient(rgba(0,0,0,0.5) ${crop.y}%, transparent ${crop.y}%, transparent ${crop.y+crop.h}%, rgba(0,0,0,0.5) ${crop.y+crop.h}%)` }} />
        {/* Crop-Rahmen */}
        <div
          onTouchStart={e => onTouchStart(e, 'move')}
          style={{
            position: 'absolute',
            left: crop.x + '%', top: crop.y + '%',
            width: crop.w + '%', height: crop.h + '%',
            border: '2px solid #FAF6EC',
            boxSizing: 'border-box',
            touchAction: 'none',
          }}>
          {/* Ecke zum Skalieren */}
          <div onTouchStart={e => onTouchStart(e, 'br')} style={{
            position: 'absolute', right: -8, bottom: -8,
            width: 24, height: 24, background: '#FAF6EC', borderRadius: 4,
            touchAction: 'none',
          }} />
        </div>
      </div>
      <div style={{ padding: '16px 24px', display: 'flex', gap: 12, background: 'rgba(0,0,0,0.8)' }}>
        <button onClick={onCancel} style={{ flex: 1, background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: 8, color: '#FAF6EC', padding: 14, fontFamily: 'Inter', fontSize: 14, cursor: 'pointer' }}>
          Abbrechen
        </button>
        <button onClick={doCrop} style={{ flex: 2, background: '#FAF6EC', border: 'none', borderRadius: 8, color: '#0D3B2E', padding: 14, fontFamily: 'Inter', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>
          ✓ Analysieren
        </button>
      </div>
    </div>
  );
}

// === CameraCapture: Rückkamera via getUserMedia ===
function CameraCapture({ onCapture, onCancel }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let active = true;
    const start = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        if (!active) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.onloadedmetadata = () => { videoRef.current.play(); setReady(true); };
        }
      } catch (e) {
        setError('Kamera nicht verfügbar: ' + e.message);
      }
    };
    start();
    return () => { active = false; if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, []);

  const capture = () => {
    const video = videoRef.current;
    if (!video) return;
    const MAX = 1024;
    let w = video.videoWidth, h = video.videoHeight;
    if (w > MAX || h > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    onCapture(base64, 'image/jpeg');
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 200, display: 'flex', flexDirection: 'column' }}>
      {error ? (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ color: '#E8A89F', fontFamily: 'Inter', fontSize: 14, marginBottom: 16 }}>{error}</div>
          <button onClick={onCancel} style={{ ...styles.secondary }}>Zurück</button>
        </div>
      ) : (
        <>
          <video ref={videoRef} playsInline muted style={{ flex: 1, width: '100%', objectFit: 'cover' }} />
          <div style={{ padding: '20px 24px', display: 'flex', gap: 16, alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.7)' }}>
            <button onClick={onCancel} style={{ background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: 8, color: '#FAF6EC', padding: '12px 20px', fontFamily: 'Inter', fontSize: 14, cursor: 'pointer' }}>
              Abbrechen
            </button>
            <button onClick={capture} disabled={!ready} style={{
              width: 72, height: 72, borderRadius: '50%',
              background: ready ? '#FAF6EC' : '#555',
              border: '4px solid rgba(255,255,255,0.4)',
              cursor: ready ? 'pointer' : 'default',
            }} />
          </div>
        </>
      )}
    </div>
  );
}

// === Input mit Sprache + Bestätigung ===
// === Barcode Scanner ===
function BarcodeScanner({ onResult, onCancel }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState(null);
  const [manualCode, setManualCode] = useState('');
  const [scanning, setScanning] = useState(false);
  const [hasDetector, setHasDetector] = useState(false);

  useEffect(() => {
    const supported = 'BarcodeDetector' in window;
    setHasDetector(supported);
    if (!supported) {
      setError('Dein Browser kann keine Barcodes lesen. Code per Hand eintippen.');
      return;
    }

    let active = true;
    let detector;
    let interval;

    (async () => {
      try {
        detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
        });
        streamRef.current = stream;
        if (!active) { stream.getTracks().forEach(t => t.stop()); return; }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
          setScanning(true);
        }

        interval = setInterval(async () => {
          if (!videoRef.current || !active) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes.length > 0) {
              clearInterval(interval);
              active = false;
              stream.getTracks().forEach(t => t.stop());
              onResult(codes[0].rawValue);
            }
          } catch {}
        }, 500);
      } catch (e) {
        if (e.name === 'NotAllowedError') {
          setError('Kamera nicht erlaubt. Tippe auf das (i) in der Adressleiste → Kamera zulassen.');
        } else {
          setError('Kamera-Fehler: ' + e.message);
        }
      }
    })();

    return () => {
      active = false;
      if (interval) clearInterval(interval);
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, [onResult]);

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#0A2E22', zIndex: 200, display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: 16, display: 'flex', alignItems: 'center', gap: 12, borderBottom: '1px solid rgba(250,246,236,0.1)' }}>
        <button style={styles.iconBtn} onClick={onCancel}><X size={20} /></button>
        <h2 style={{ ...styles.h1, margin: 0, fontSize: 20 }}>Barcode scannen</h2>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        {hasDetector && !error && (
          <>
            <div style={{ position: 'relative', width: '100%', maxWidth: 360, aspectRatio: '4/3', background: '#000', borderRadius: 12, overflow: 'hidden' }}>
              <video ref={videoRef} style={{ width: '100%', height: '100%', objectFit: 'cover' }} muted playsInline />
              <div style={{
                position: 'absolute', top: '40%', left: '10%', right: '10%', height: 2,
                background: '#E8A89F', boxShadow: '0 0 12px #E8A89F',
              }} />
            </div>
            <div style={{ marginTop: 16, fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.7)', textAlign: 'center' }}>
              {scanning ? 'Barcode in den Rahmen halten...' : 'Kamera startet...'}
            </div>
          </>
        )}

        {error && (
          <div style={{ padding: '16px 20px', background: 'rgba(160,58,53,0.2)', border: '1px solid rgba(232,168,159,0.4)', borderRadius: 8, fontFamily: 'Inter', fontSize: 13, color: '#E8A89F', lineHeight: 1.5, maxWidth: 360, textAlign: 'center' }}>
            {error}
          </div>
        )}

        <div style={{ marginTop: 24, width: '100%', maxWidth: 360 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 6 }}>
            Oder per Hand:
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <input
              placeholder="Barcode-Nummer"
              value={manualCode}
              onChange={e => setManualCode(e.target.value.replace(/\D/g, ''))}
              inputMode="numeric"
              style={{ ...styles.input, flex: 1, fontFamily: 'monospace' }}
            />
            <button
              disabled={!manualCode}
              onClick={() => onResult(manualCode)}
              style={{ ...styles.primary, marginTop: 0, width: 'auto', padding: '0 20px', opacity: manualCode ? 1 : 0.5 }}
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function InputView({ glossary, dishes = [], activities = [], currentWeight = 75, todayEntries = [], todayActivityEntries = [], onCancel, onConfirm, onSaveDish, onAddActivityEntry, onIncrementEntry, onIncrementActivityEntry, persistGlossary, initialMode = 'text', initialScreen = 'food', initialDate = null, initialSlot = null, apiKey = '', pendingDishItems = null, onClearPending }) {
