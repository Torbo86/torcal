function FoodEditor({ food, onSave, onDelete, onCancel, apiKey = '' }) {
  const [f, setF] = useState({
    protein: 0, carbs: 0, fat: 0,
    ...food,
    units: { ...food.units },
  });
  const [newUnit, setNewUnit] = useState('');
  const [newUnitG, setNewUnitG] = useState('');
  const [lookupQuery, setLookupQuery] = useState('');
  const [lookupResults, setLookupResults] = useState(null);
  const [lookupLoading, setLookupLoading] = useState(false);
  const [showCamera, setShowCamera] = useState(false);
  const [cropImageUrl, setCropImageUrl] = useState(null);
  const [photoAnalyzing, setPhotoAnalyzing] = useState(false);
  const galleryRef = useRef(null);

  const handlePhotoCapture = (base64, mediaType) => {
    setShowCamera(false);
    setCropImageUrl('data:' + mediaType + ';base64,' + base64);
  };

  const handleGallerySelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => resolve(ev.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    setCropImageUrl(dataUrl);
  };

  const handleCroppedPhoto = async (base64, mediaType) => {
    setCropImageUrl(null);
    if (!apiKey) { alert('API-Key benötigt (Mehr → API-Key)'); return; }
    setPhotoAnalyzing(true);
    try {
      const results = await analyzePhoto(base64, mediaType, apiKey);
      if (results && results.length > 0) {
        const r = results[0];
        setF(prev => ({
          ...prev,
          name: prev.name || r.name,
          kcalPer100g: r.kcalPer100g || prev.kcalPer100g,
          protein: r.protein || prev.protein,
          carbs: r.carbs || prev.carbs,
          fat: r.fat || prev.fat,
        }));
        setLookupQuery(r.name);
      }
    } catch (e) { alert('Fehler: ' + e.message); }
    finally { setPhotoAnalyzing(false); }
  };

  const runLookup = async (query) => {
    if (!query || !query.trim()) return;
    setLookupLoading(true);
    setLookupResults(null);
    const results = await lookupOpenFoodFactsMany(query.trim());
    setLookupResults(results);
    setLookupLoading(false);
  };

  const applyResult = (r) => {
    setF({
      ...f,
      name: r.name,
      kcalPer100g: r.kcalPer100g,
      protein: r.protein || 0,
      carbs: r.carbs || 0,
      fat: r.fat || 0,
    });
    setLookupResults(null);
    setLookupQuery('');
  };

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'flex-end', zIndex: 100 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top, #1A5340 0%, #0D3B2E 100%)', width: '100%', borderRadius: '20px 20px 0 0', padding: 24, maxHeight: '90vh', overflow: 'auto', maxWidth: 480, margin: '0 auto', borderTop: '1px solid rgba(250,246,236,0.15)' }}>
        <h2 style={{ fontFamily: 'Fraunces', margin: '0 0 16px', color: '#FAF6EC', fontWeight: 600 }}>{food.id ? 'Bearbeiten' : 'Neu'}</h2>

        {/* Foto-Scan */}
        <input ref={galleryRef} type="file" accept="image/*" onChange={handleGallerySelect} style={{ display: 'none' }} />
        {showCamera && <CameraCapture onCapture={handlePhotoCapture} onCancel={() => setShowCamera(false)} />}
        {cropImageUrl && <ImageCropper imageDataUrl={cropImageUrl} onCrop={handleCroppedPhoto} onCancel={() => setCropImageUrl(null)} />}
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          <button onClick={() => setShowCamera(true)} disabled={photoAnalyzing}
            style={{ flex: 1, background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)', borderRadius: 8, color: '#FAF6EC', padding: '8px 0', fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
            📷 Foto scannen
          </button>
          <button onClick={() => galleryRef.current?.click()} disabled={photoAnalyzing}
            style={{ flex: 1, background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)', borderRadius: 8, color: '#FAF6EC', padding: '8px 0', fontFamily: 'Inter', fontSize: 12, cursor: 'pointer' }}>
            🖼️ Galerie
          </button>
        </div>
        {photoAnalyzing && <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.7)', marginBottom: 12, textAlign: 'center' }}>🔍 Analysiere...</div>}
        <Field label="Name"><input value={f.name} onChange={e => setF({ ...f, name: e.target.value })} style={styles.input} /></Field>

        {/* Werte aus dem Netz holen */}
        <div style={{ background: 'rgba(250,246,236,0.06)', padding: 12, borderRadius: 8, marginBottom: 12 }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <input
              placeholder={f.name ? `Suche „${f.name}"` : 'Was möchtest du suchen?'}
              value={lookupQuery}
              onChange={e => setLookupQuery(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && runLookup(lookupQuery || f.name)}
              style={{ ...styles.input, flex: 1 }}
            />
            <button
              onClick={() => runLookup(lookupQuery || f.name)}
              disabled={lookupLoading || (!lookupQuery && !f.name)}
              style={{
                background: '#FAF6EC', color: '#0D3B2E',
                border: 'none', borderRadius: 8, padding: '0 16px',
                fontFamily: 'Inter', fontSize: 13, fontWeight: 600,
                cursor: lookupLoading ? 'wait' : 'pointer',
                opacity: (lookupLoading || (!lookupQuery && !f.name)) ? 0.5 : 1,
              }}
            >
              {lookupLoading ? '...' : 'Suchen'}
            </button>
          </div>
          {lookupResults && lookupResults.length === 0 && (
            <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.65)', marginTop: 8 }}>
              Nichts gefunden. Versuche einen anderen Suchbegriff.
            </div>
          )}
          {lookupResults && lookupResults.length > 0 && (
            <div style={{ marginTop: 10, maxHeight: 240, overflowY: 'auto', background: 'rgba(0,0,0,0.2)', borderRadius: 6 }}>
              {lookupResults.map((r, i) => (
                <div
                  key={i}
                  onClick={() => applyResult(r)}
                  style={{
                    padding: '10px 12px',
                    borderBottom: '1px solid rgba(250,246,236,0.08)',
                    cursor: 'pointer',
                  }}
                >
                  <div style={{ fontFamily: 'Fraunces', fontSize: 14, color: '#FAF6EC' }}>
                    {r.name}{r.brand ? ` (${r.brand})` : ''}
                  </div>
                  <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.65)', marginTop: 2 }} className="num">
                    {r.kcalPer100g} kcal/100g · E {r.protein}g · KH {r.carbs}g · F {r.fat}g
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <Field label="kcal pro 100g"><input type="number" inputMode="decimal" value={f.kcalPer100g || ''} onChange={e => setF({ ...f, kcalPer100g: e.target.value === '' ? 0 : +e.target.value })} style={styles.input} /></Field>

        <div style={{ display: 'flex', gap: 8 }}>
          <div style={{ flex: 1 }}>
            <Field label="Eiweiß (g/100g)">
              <input type="number" inputMode="decimal" value={f.protein || ''} onChange={e => setF({ ...f, protein: e.target.value === '' ? 0 : +e.target.value })} style={styles.input} />
            </Field>
          </div>
          <div style={{ flex: 1 }}>
            <Field label="KH (g/100g)">
              <input type="number" inputMode="decimal" value={f.carbs || ''} onChange={e => setF({ ...f, carbs: e.target.value === '' ? 0 : +e.target.value })} style={styles.input} />
            </Field>
          </div>
          <div style={{ flex: 1 }}>
            <Field label="Fett (g/100g)">
              <input type="number" inputMode="decimal" value={f.fat || ''} onChange={e => setF({ ...f, fat: e.target.value === '' ? 0 : +e.target.value })} style={styles.input} />
            </Field>
          </div>
        </div>

        <Field label="Einheiten (Gramm pro Einheit)">
          {Object.entries(f.units).map(([u, g]) => (
            <div key={u} style={{ display: 'flex', gap: 8, marginBottom: 6, alignItems: 'center' }}>
              <span style={{ flex: 1, fontFamily: 'Fraunces', color: '#FAF6EC' }}>{u}</span>
              <input type="number" inputMode="decimal" value={g || ''} onChange={e => setF({ ...f, units: { ...f.units, [u]: e.target.value === '' ? 0 : +e.target.value } })} style={{ ...styles.input, width: 100 }} />
              {u !== 'g' && (
                <button style={styles.iconBtnSmall} onClick={() => { const u2 = { ...f.units }; delete u2[u]; setF({ ...f, units: u2 }); }}><X size={14} /></button>
              )}
            </div>
          ))}
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <input placeholder="z.B. EL" value={newUnit} onChange={e => setNewUnit(e.target.value)} style={{ ...styles.input, flex: 1 }} />
            <input type="number" placeholder="g" value={newUnitG} onChange={e => setNewUnitG(e.target.value)} style={{ ...styles.input, width: 80 }} />
            <button style={styles.iconBtn} onClick={() => { if (newUnit && newUnitG) { setF({ ...f, units: { ...f.units, [newUnit]: +newUnitG } }); setNewUnit(''); setNewUnitG(''); } }}><Plus size={18} /></button>
          </div>
        </Field>
        <div style={{ display: 'flex', gap: 8, marginTop: 24 }}>
          <button style={{ ...styles.secondary, flex: 1 }} onClick={onCancel}>Abbrechen</button>
          {food.id && <button style={{ ...styles.secondary, flex: 1, color: '#E8A89F', borderColor: 'rgba(232,168,159,0.4)' }} onClick={onDelete}>Löschen</button>}
          <button style={{ ...styles.primary, flex: 1, marginTop: 0 }} onClick={() => onSave(f)}>Speichern</button>
        </div>
      </div>
    </div>
  );
}

// === Stats ===
function Stats({ entries, activityEntries = [], glossary = [], target, weights = [], settings, apiKey = '', selectedDate, setSelectedDate, savedAnalyses = [], onSaveAnalysis, onDeleteAnalysis, onAddWeight, onDeleteWeight, onBack, onExportDay }) {
  const [range, setRange] = useState('week'); // week | month
  const [showAddWeight, setShowAddWeight] = useState(false);
  const [newWeight, setNewWeight] = useState('');
  const [newWeightDate, setNewWeightDate] = useState(todayKey());
  const [weightRange, setWeightRange] = useState(90); // Tage
  const [showAllWeights, setShowAllWeights] = useState(false);
  const [analysis, setAnalysis] = useState(null); // { text, date, kind }
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [analysisError, setAnalysisError] = useState(null);
  const [showSavedAnalyses, setShowSavedAnalyses] = useState(false);

  // Datum für Analyse: per default heute, kann beliebig gewählt werden
  const analysisDateKey = selectedDate || todayKey();
  const analysisDayEntries = entries.filter(e => e.dateKey === analysisDateKey);
  const analysisDayActs = activityEntries.filter(a => a.dateKey === analysisDateKey);
  const consumed = analysisDayEntries.reduce((s, e) => s + e.kcal, 0);
  const burned = analysisDayActs.reduce((s, e) => s + e.kcal, 0);
  const macroSums = analysisDayEntries.reduce((acc, e) => ({
    protein: acc.protein + (e.protein || 0),
    carbs: acc.carbs + (e.carbs || 0),
    fat: acc.fat + (e.fat || 0),
  }), { protein: 0, carbs: 0, fat: 0 });

  const runAnalysis = async () => {
    if (!apiKey) {
      setAnalysisError('Für die Analyse brauchst du einen API-Key (in Einstellungen → Mehr → API-Key).');
      return;
    }
    setAnalysisLoading(true);
    setAnalysis(null);
    setAnalysisError(null);

    // Daten für den ausgewählten Tag aufbereiten
    const slots = ['Frühstück', 'Mittag', 'Snack', 'Abend'];
    const mealsBySlot = slots
      .map(slot => {
        const items = analysisDayEntries.filter(e => e.slot === slot);
        if (items.length === 0) return null;
        return {
          slot,
          items: items.map(e => `${String(e.qty).replace('.', ',')} ${e.unit} ${e.foodName} (${e.kcal} kcal, E ${e.protein || 0}g, KH ${e.carbs || 0}g, F ${e.fat || 0}g)`),
        };
      })
      .filter(Boolean);

    const activitiesText = analysisDayActs.length > 0
      ? analysisDayActs.map(a => `${a.activityName} ${a.durationMin} min (${a.kcal} kcal)`).join(', ')
      : 'keine';

    const isFuture = analysisDateKey > todayKey();
    const isEmpty = mealsBySlot.length === 0;
    const missingSlots = ['Frühstück', 'Mittag', 'Snack', 'Abend'].filter(
      slot => !mealsBySlot.find(m => m.slot === slot)
    );
    const remaining = target + burned - consumed;
    const dateLabel = analysisDateKey === todayKey() ? 'heute' : (isFuture ? `am ${analysisDateKey} (Planung)` : `am ${analysisDateKey}`);
    const userInfo = settings ? `Person: ${settings.sex === 'm' ? 'männlich' : 'weiblich'}, ${settings.age} Jahre, ${settings.height} cm, ${settings.weight} kg, Ziel: ${target} kcal/Tag.` : `Tagesziel: ${target} kcal.`;

    // Kontext-abhängige Anweisung
    let aufgabe = '';
    if (isEmpty && isFuture) {
      aufgabe = `Der Tag ist noch komplett leer (Planung). Mache 2-3 konkrete Mahlzeit-Vorschläge für den ganzen Tag passend zum Kalorienziel. Gib für jeden Vorschlag ungefähre Mengen und kcal an.`;
    } else if (isEmpty) {
      aufgabe = `Heute ist noch gar nichts eingetragen. Mache 2-3 konkrete Mahlzeit-Vorschläge für den Rest des Tages passend zum Kalorienziel. Gib für jeden Vorschlag ungefähre Mengen und kcal an.`;
    } else if (missingSlots.includes('Abend') && !isFuture && remaining > 100) {
      aufgabe = `Das Abendessen fehlt noch. Es verbleiben ${remaining} kcal. Bewerte kurz den bisherigen Tag (Makros, Verteilung) und mache dann 2 konkrete Abendessen-Vorschläge die gut in die verbleibenden Kalorien passen. Gib Mengen und kcal an.`;
    } else if (isFuture) {
      aufgabe = `Das ist eine Tagesplanung. Bewerte die geplanten Mahlzeiten und ergänze 1-2 Vorschläge für fehlende Slots: ${missingSlots.join(', ') || 'alle geplant'}. Achte auf ausgewogene Makros.`;
    } else if (remaining < 0) {
      aufgabe = `Das Tagesziel wurde um ${Math.abs(remaining)} kcal überschritten. Sage was gut war, und gib einen pragmatischen Tipp ohne zu moralisieren.`;
    } else {
      aufgabe = `Bewerte den Tag: was war gut (Makros, Verteilung, Timing), was könnte besser sein. Gib einen konkreten Tipp für morgen.`;
    }

    const prompt = `Du bist ein pragmatischer Ernährungs-Coach. Sprich den Nutzer persönlich an (du). Antworte auf Deutsch, max. 6 Sätze, kein Markdown, keine Listen — fließender Text. Keine Predigten, keine Phrasen wie "gut gemacht" oder "super".

${userInfo}

Tag: ${dateLabel}
Aufgenommen: ${consumed} kcal (Eiweiß ${Math.round(macroSums.protein)}g · KH ${Math.round(macroSums.carbs)}g · Fett ${Math.round(macroSums.fat)}g)
Sport: ${burned > 0 ? `${burned} kcal verbrannt` : 'keiner'}
Netto: ${consumed - burned} kcal von ${target} kcal Ziel
Verbleibend: ${remaining} kcal

Mahlzeiten:
${mealsBySlot.length > 0 ? mealsBySlot.map(m => `${m.slot}: ${m.items.join(' | ')}`).join('\n') : 'noch nichts eingetragen'}

Aktivitäten: ${activitiesText}

Aufgabe: ${aufgabe}`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 800,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!res.ok) {
        const errTxt = await res.text();
        throw new Error(`API-Fehler ${res.status}: ${errTxt.slice(0, 200)}`);
      }
      const data = await res.json();
      const text = data.content?.[0]?.text || 'Keine Antwort.';
      setAnalysis({ text, date: analysisDateKey, kind: isFuture ? 'plan' : 'review', createdAt: new Date().toISOString() });
    } catch (e) {
      setAnalysisError(e.message || 'Fehler bei der Anfrage');
    } finally {
      setAnalysisLoading(false);
    }
  };

  const days = range === 'week' ? 7 : 30;
  const dayData = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = todayKey(d);
    const kcal = entries.filter(e => e.dateKey === k).reduce((s, e) => s + e.kcal, 0);
    dayData.push({ key: k, label: d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit' }), kcal });
  }

  const maxKcal = Math.max(target * 1.2, ...dayData.map(d => d.kcal));
  const avgKcal = Math.round(dayData.filter(d => d.kcal > 0).reduce((s, d) => s + d.kcal, 0) / Math.max(1, dayData.filter(d => d.kcal > 0).length));

  // === Alkohol-Auswertung für Range ===
  const rangeKeys = new Set(dayData.map(d => d.key));
  const alcoholInRange = entries.filter(e => rangeKeys.has(e.dateKey) && (
    e.isAlcohol === true ||
    (() => {
      const g = glossary.find(g => g.id === e.foodId);
      return g && g.isAlcohol === true;
    })()
  ));
  const alcoholKcal = alcoholInRange.reduce((s, e) => s + (e.kcal || 0), 0);
  const alcoholCount = alcoholInRange.reduce((s, e) => s + (e.qty || 1), 0);
  const alcoholDays = new Set(alcoholInRange.map(e => e.dateKey)).size;
  const alcoholAvgPerDay = Math.round(alcoholKcal / days);

  // Gewicht-Daten
  const sortedWeights = [...weights].sort((a, b) => a.date.localeCompare(b.date));
  const latestWeight = sortedWeights[sortedWeights.length - 1];
  const earliestForRange = (() => {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - weightRange);
    const cutoffKey = todayKey(cutoff);
    return sortedWeights.filter(w => w.date >= cutoffKey);
  })();
  const weightChange = earliestForRange.length >= 2
    ? earliestForRange[earliestForRange.length - 1].kg - earliestForRange[0].kg
    : null;

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onBack}><ChevronLeft size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Auswertung</h1>
      </div>

      {/* === Ziel-Widget (Hochzeit etc.) === */}
      {settings?.targetWeight && settings?.targetDate && (() => {
        const start = +settings.startWeight || (sortedWeights[0]?.kg) || latestWeight?.kg || 0;
        const target = +settings.targetWeight;
        const current = latestWeight?.kg || start;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const targetD = new Date(settings.targetDate);
        targetD.setHours(0, 0, 0, 0);
        const daysLeft = Math.round((targetD - today) / (1000 * 60 * 60 * 24));
        const totalLoss = start - target;
        const lostSoFar = start - current;
        const progressPct = totalLoss !== 0 ? Math.max(0, Math.min(100, (lostSoFar / totalLoss) * 100)) : 0;

        // Soll heute (linear) - basiert auf Startdatum aus Settings (nicht erster Wiege-Eintrag!)
        const startDateRef = settings.startDate
          ? new Date(settings.startDate)
          : new Date(today);
        startDateRef.setHours(0, 0, 0, 0);
        const totalDays = Math.max(1, Math.round((targetD - startDateRef) / (1000 * 60 * 60 * 24)));
        const daysPassed = Math.max(0, Math.round((today - startDateRef) / (1000 * 60 * 60 * 24)));
        const sollToday = start - (totalLoss * Math.min(1, daysPassed / totalDays));
        const diffToPlan = current - sollToday; // positiv = über Plan (schlecht beim Abnehmen)

        // Ampel
        const onTrack = totalLoss > 0 ? diffToPlan <= 0.3 : diffToPlan >= -0.3;
        const slightlyOff = Math.abs(diffToPlan) <= 1.0;
        const statusColor = onTrack ? '#0D3B2E' : slightlyOff ? '#B8860B' : '#A03A35';
        const statusText = totalLoss > 0
          ? (onTrack ? 'auf Kurs' : slightlyOff ? 'leicht über Plan' : 'hinterher')
          : (onTrack ? 'auf Kurs' : slightlyOff ? 'leicht hinterher' : 'unter Plan');

        const label = settings.goalLabel || 'Ziel';
        const targetDateStr = targetD.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

        return (
          <div style={{ background: '#0D3B2E', backgroundImage: 'radial-gradient(circle at top right, #1A5340 0%, #0D3B2E 100%)', borderRadius: 12, padding: 20, marginBottom: 16, color: '#FAF6EC' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
              <div>
                <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: 'rgba(250,246,236,0.6)' }}>{label}</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 28, fontWeight: 600, marginTop: 4, lineHeight: 1 }} className="num">
                  {daysLeft > 0 ? `${daysLeft} Tage` : daysLeft === 0 ? 'Heute!' : 'vorbei'}
                </div>
                <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.6)', marginTop: 4 }}>bis {targetDateStr}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: 'rgba(250,246,236,0.6)' }}>Status</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 600, marginTop: 4, color: onTrack ? '#90C8A8' : slightlyOff ? '#E8A87C' : '#E8807C' }}>
                  {statusText}
                </div>
              </div>
            </div>

            {/* Werte-Zeile */}
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, marginBottom: 12, fontFamily: 'Inter', fontSize: 12 }}>
              <div>
                <div style={{ color: 'rgba(250,246,236,0.5)', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1 }}>Start</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }} className="num">{start.toFixed(1).replace('.', ',')} kg</div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <div style={{ color: 'rgba(250,246,236,0.5)', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1 }}>Aktuell</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }} className="num">{current.toFixed(1).replace('.', ',')} kg</div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <div style={{ color: 'rgba(250,246,236,0.5)', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1 }}>Soll heute</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }} className="num">{sollToday.toFixed(1).replace('.', ',')} kg</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ color: 'rgba(250,246,236,0.5)', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1 }}>Ziel</div>
                <div style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }} className="num">{target.toFixed(1).replace('.', ',')} kg</div>
              </div>
            </div>

            {/* Fortschrittsbalken */}
            <div style={{ background: 'rgba(250,246,236,0.12)', borderRadius: 6, height: 8, overflow: 'hidden', position: 'relative' }}>
              <div style={{ background: onTrack ? '#90C8A8' : slightlyOff ? '#E8A87C' : '#E8807C', height: '100%', width: `${progressPct}%`, borderRadius: 6, transition: 'width 0.3s' }} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontFamily: 'Inter', fontSize: 10, color: 'rgba(250,246,236,0.5)' }}>
              <span>{lostSoFar >= 0 ? `${lostSoFar.toFixed(1).replace('.', ',')} kg geschafft` : `${Math.abs(lostSoFar).toFixed(1).replace('.', ',')} kg zugenommen`}</span>
              <span>{Math.round(progressPct)}%</span>
              <span>noch {Math.abs(current - target).toFixed(1).replace('.', ',')} kg</span>
            </div>
          </div>
        );
      })()}

      {/* === Gewicht-Bereich === */}
      <div style={{ background: '#FAF6EC', borderRadius: 12, padding: 20, marginBottom: 24 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
          <div>
            <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: '#5C6B5E' }}>Gewicht</div>
            {latestWeight ? (
              <>
                <div style={{ fontFamily: 'Fraunces', fontSize: 36, fontWeight: 600, color: '#0D3B2E', marginTop: 4, lineHeight: 1 }} className="num">
                  {latestWeight.kg.toString().replace('.', ',')} <span style={{ fontSize: 14, color: '#5C6B5E' }}>kg</span>
                </div>
                <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E', marginTop: 4 }}>
                  {fmtDate(latestWeight.date)}
                  {weightChange !== null && (
                    <span style={{ color: weightChange < 0 ? '#0D3B2E' : '#A03A35', marginLeft: 8 }}>
                      {weightChange > 0 ? '+' : ''}{weightChange.toFixed(1).replace('.', ',')} kg / {weightRange >= 99999 ? 'Alle' : weightRange + 'T'}
                    </span>
                  )}
                </div>
              </>
            ) : (
              <div style={{ fontFamily: 'Inter', fontSize: 13, color: '#5C6B5E', marginTop: 8 }}>
                Noch nichts eingetragen
              </div>
            )}
          </div>
          <button
            onClick={() => setShowAddWeight(true)}
            style={{
              background: '#0D3B2E', color: '#FAF6EC', border: 'none',
              borderRadius: '50%', width: 44, height: 44,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
            }}
          >
            <Plus size={20} />
          </button>
        </div>

        {/* Gewichts-Graph */}
        {sortedWeights.length >= 2 && (
          <>
            <div style={{ display: 'flex', gap: 4, marginTop: 12, marginBottom: 8 }}>
              {[
                { l: '30T', v: 30 },
                { l: '90T', v: 90 },
                { l: '1J', v: 365 },
                { l: 'Alle', v: 99999 },
              ].map(o => (
                <button
                  key={o.v}
                  onClick={() => setWeightRange(o.v)}
                  style={{
                    flex: 1, padding: '10px 4px', cursor: 'pointer',
                    background: weightRange === o.v ? '#0D3B2E' : 'transparent',
                    color: weightRange === o.v ? '#FAF6EC' : '#5C6B5E',
                    border: `1px solid ${weightRange === o.v ? '#0D3B2E' : '#D8D2C2'}`,
                    borderRadius: 6, fontSize: 11, fontWeight: 600,
                    fontFamily: 'Inter',
                  }}
                >
                  {o.l}
                </button>
              ))}
            </div>
            <WeightChart
              weights={earliestForRange.length >= 2 ? earliestForRange : sortedWeights}
              goal={settings?.targetWeight && settings?.targetDate ? {
                startKg: +settings.startWeight || sortedWeights[0]?.kg,
                targetKg: +settings.targetWeight,
                startDate: settings.startDate || new Date().toISOString().slice(0, 10),
                targetDate: settings.targetDate,
              } : null}
            />
            <button
              onClick={() => setShowAllWeights(!showAllWeights)}
              style={{
                background: 'transparent', color: '#5C6B5E', border: 'none',
                fontFamily: 'Inter', fontSize: 12, padding: 0, marginTop: 8,
                cursor: 'pointer', textDecoration: 'underline',
              }}
            >
              {showAllWeights ? 'Liste ausblenden' : `Alle ${sortedWeights.length} Einträge zeigen`}
            </button>
            {showAllWeights && (
              <div style={{ marginTop: 8, maxHeight: 200, overflow: 'auto' }}>
                {[...sortedWeights].reverse().map(w => (
                  <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: '1px solid rgba(13,59,46,0.08)' }}>
                    <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E' }}>{fmtDate(w.date)}</span>
                    <span style={{ fontFamily: 'Fraunces', fontSize: 14, fontWeight: 500, color: '#0D3B2E' }} className="num">{w.kg.toString().replace('.', ',')} kg</span>
                    <button
                      onClick={() => { if (confirm('Eintrag löschen?')) onDeleteWeight(w.id); }}

// === WeightChart - kleiner SVG-Linien-Graph ===
function WeightChart({ weights, goal = null }) {
  if (!weights || weights.length < 2) return null;

  const w = 320, h = 120, pad = { l: 30, r: 8, t: 8, b: 20 };
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;

  // Soll-Linie? (goal = { startKg, targetKg, startDate, targetDate })
  const showGoal = goal && goal.targetKg && goal.targetDate && goal.startKg && goal.startDate;

  const kgs = weights.map(w => w.kg);
  let minKg = Math.min(...kgs);
  let maxKg = Math.max(...kgs);
  if (showGoal) {
    minKg = Math.min(minKg, goal.targetKg, goal.startKg);
    maxKg = Math.max(maxKg, goal.targetKg, goal.startKg);
  }
  const rangeKg = Math.max(0.5, maxKg - minKg);
  const padKg = rangeKg * 0.15;
  const yMin = minKg - padKg;
  const yMax = maxKg + padKg;

  const dates = weights.map(w => new Date(w.date).getTime());
  let minD = dates[0];
  let maxD = dates[dates.length - 1];
  if (showGoal) {
    const gStart = new Date(goal.startDate).getTime();
    const gEnd = new Date(goal.targetDate).getTime();
    minD = Math.min(minD, gStart);
    maxD = Math.max(maxD, gEnd);
  }
  const rangeD = Math.max(1, maxD - minD);

  const xFor = (date) => pad.l + ((new Date(date).getTime() - minD) / rangeD) * innerW;
  const yFor = (kg) => pad.t + (1 - (kg - yMin) / (yMax - yMin)) * innerH;

  const path = weights.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(p.date)},${yFor(p.kg)}`).join(' ');

  const yLabels = [yMin, (yMin + yMax) / 2, yMax];

  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
      {yLabels.map((y, i) => (
        <g key={i}>
          <line
            x1={pad.l} y1={yFor(y)}
            x2={w - pad.r} y2={yFor(y)}
            stroke="rgba(13,59,46,0.08)" strokeWidth={1}
          />
          <text
            x={pad.l - 4} y={yFor(y) + 3}
            fontSize={9} fontFamily="Inter" textAnchor="end"
            fill="#5C6B5E"
          >
            {y.toFixed(1).replace('.', ',')}
          </text>
        </g>
      ))}
      {/* Soll-Linie */}
      {showGoal && (
        <line
          x1={xFor(goal.startDate)} y1={yFor(goal.startKg)}
          x2={xFor(goal.targetDate)} y2={yFor(goal.targetKg)}
          stroke="#A03A35" strokeWidth={1.5} strokeDasharray="4 3" opacity={0.7}
        />
      )}
      <path d={path} fill="none" stroke="#0D3B2E" strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
      {weights.map((p, i) => (
        <circle
          key={i}
          cx={xFor(p.date)} cy={yFor(p.kg)} r={3}
          fill="#0D3B2E"
        />
      ))}
      {/* Ziel-Punkt */}
      {showGoal && (
        <circle cx={xFor(goal.targetDate)} cy={yFor(goal.targetKg)} r={4} fill="#A03A35" stroke="#FAF6EC" strokeWidth={1.5} />
      )}
      {/* X-Achse: erstes und letztes Datum */}
      <text x={pad.l} y={h - 4} fontSize={9} fontFamily="Inter" fill="#5C6B5E">
        {new Date(weights[0].date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}
      </text>
      <text x={w - pad.r} y={h - 4} fontSize={9} fontFamily="Inter" fill="#5C6B5E" textAnchor="end">
        {showGoal
          ? new Date(goal.targetDate).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
          : new Date(weights[weights.length - 1].date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}
      </text>
    </svg>
  );
}

// === TodoList: strukturierte Notizen mit Priorität ===
function TodoList({ items = [], onChange }) {
  const [newText, setNewText] = useState('');
  const [newType, setNewType] = useState('idea');

  const add = () => {
    if (!newText.trim()) return;
    const item = { id: crypto.randomUUID(), text: newText.trim(), type: newType, done: false, createdAt: new Date().toISOString() };
    onChange([item, ...items]);
    setNewText('');
  };

  const toggle = (id) => onChange(items.map(i => i.id === id ? { ...i, done: !i.done } : i));
  const remove = (id) => onChange(items.filter(i => i.id !== id));
  const setType = (id, type) => onChange(items.map(i => i.id === id ? { ...i, type } : i));

  const open = items.filter(i => !i.done).sort((a, b) => (a.type === 'bug' ? -1 : 1) - (b.type === 'bug' ? -1 : 1));
  const done = items.filter(i => i.done);

  const typeIcon = (t) => t === 'bug' ? '🔴' : '🟡';
  const typeLabel = (t) => t === 'bug' ? 'Bug' : 'Idee';

  return (
    <div>
      {/* Neue Eingabe */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
        <button onClick={() => setNewType(newType === 'bug' ? 'idea' : 'bug')}
          style={{ background: 'rgba(250,246,236,0.1)', border: '1px solid rgba(250,246,236,0.2)', borderRadius: 8, padding: '0 10px', fontSize: 16, cursor: 'pointer', flexShrink: 0 }}>
          {typeIcon(newType)}
        </button>
        <input value={newText} onChange={e => setNewText(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && add()}
          placeholder={newType === 'bug' ? 'Bug beschreiben...' : 'Idee notieren...'}
          style={{ ...styles.input, flex: 1 }} />
        <button onClick={add} style={{ background: '#FAF6EC', color: '#0D3B2E', border: 'none', borderRadius: 8, padding: '0 14px', fontFamily: 'Inter', fontSize: 16, fontWeight: 700, cursor: 'pointer' }}>+</button>
      </div>

      {/* Offene Punkte */}
      {open.map(item => (
        <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0', borderBottom: '1px solid rgba(250,246,236,0.08)' }}>
          <button onClick={() => toggle(item.id)}
            style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid rgba(250,246,236,0.4)', background: 'transparent', cursor: 'pointer', flexShrink: 0 }} />
          <button onClick={() => setType(item.id, item.type === 'bug' ? 'idea' : 'bug')}
            style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, padding: 0, flexShrink: 0 }}>
            {typeIcon(item.type)}
          </button>
          <span style={{ fontFamily: 'Inter', fontSize: 13, color: '#FAF6EC', flex: 1, lineHeight: 1.4 }}>{item.text}</span>
          <button onClick={() => remove(item.id)}
            style={{ background: 'none', border: 'none', color: 'rgba(250,246,236,0.3)', cursor: 'pointer', padding: 2 }}>
            <X size={12} />
          </button>
        </div>
      ))}

      {open.length === 0 && (
        <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.4)', textAlign: 'center', padding: '16px 0' }}>
          Keine offenen Punkte 🎉
        </div>
      )}

      {/* Erledigte */}
      {done.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.3)', marginBottom: 8 }}>Erledigt ({done.length})</div>
          {done.map(item => (
            <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', opacity: 0.4 }}>
              <button onClick={() => toggle(item.id)}
                style={{ width: 20, height: 20, borderRadius: 4, border: '2px solid rgba(250,246,236,0.4)', background: 'rgba(250,246,236,0.3)', cursor: 'pointer', flexShrink: 0 }}>
                <span style={{ fontSize: 10, color: '#0D3B2E' }}>✓</span>
              </button>
              <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#FAF6EC', flex: 1, textDecoration: 'line-through' }}>{item.text}</span>
              <button onClick={() => remove(item.id)}
                style={{ background: 'none', border: 'none', color: 'rgba(250,246,236,0.3)', cursor: 'pointer', padding: 2 }}>
                <X size={10} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// === ApiStatus ===
function ApiStatus({ apiKey }) {
  const [status, setStatus] = useState(null);
  const [msg, setMsg] = useState('');

  const check = async () => {
    setStatus('checking');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 10,
          messages: [{ role: 'user', content: 'Hi' }],
        }),
      });
      if (res.ok) { setStatus('ok'); setMsg('✓ Verbindung OK · Guthaben vorhanden'); }
      else if (res.status === 401) { setStatus('error'); setMsg('✗ Ungültiger API-Key'); }
      else if (res.status === 429) { setStatus('error'); setMsg('✗ Rate-Limit oder kein Guthaben mehr'); }
      else { setStatus('error'); setMsg(`✗ Fehler ${res.status}`); }
    } catch { setStatus('error'); setMsg('✗ Verbindung fehlgeschlagen'); }
  };

  return (
    <div style={{ marginTop: 8 }}>
      <button onClick={check} disabled={status === 'checking'} style={{
        background: 'transparent', border: '1px solid #D8D2C2', borderRadius: 6,
        padding: '6px 12px', fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E',
        cursor: 'pointer', width: '100%',
      }}>
        {status === 'checking' ? '...' : '🔌 Verbindung testen'}
      </button>
      {msg && (
        <div style={{ marginTop: 6, fontFamily: 'Inter', fontSize: 11, textAlign: 'center', color: status === 'ok' ? '#1A5340' : '#A03A35' }}>
          {msg}
        </div>
      )}
    </div>
  );
}

// === MovementInputArea (wiederverwendbar in Movement-Tab und Hinzufügen-Screen) ===
function MovementInputArea({ activities, currentWeight, onAddActivityEntry, onIncrementActivityEntry, todayActivityEntries = [], onDone, dateKey = null }) {
  const [search, setSearch] = useState('');
  const [selectedActivity, setSelectedActivity] = useState(null);
  const [duration, setDuration] = useState('');
  const [statusMsg, setStatusMsg] = useState(null);

  const filtered = activities.filter(a => a.name.toLowerCase().includes(search.toLowerCase()));

  const handleAdd = async () => {
    if (!selectedActivity || !duration) return;
    const dur = parseInt(duration, 10);
    if (!dur || dur < 1) return;

    // Manuelle Aktivität: kcal direkt eingegeben
    if (selectedActivity.isManual) {
      const kcal = dur; // dur = direkt kcal bei manuell
      await onAddActivityEntry({
        id: crypto.randomUUID(),
        dateKey: dateKey || todayKey(),
        time: new Date().toISOString(),
        activityId: '__manual__',
        activityName: selectedActivity.name || 'Training',
        met: 0,
        durationMin: 0,
        weightKg: currentWeight,
        kcal,
        isManual: true,
      });
      setStatusMsg(`+${kcal} kcal · ${selectedActivity.name || 'Training'} eingetragen`);
      setSelectedActivity(null);
      setDuration('');
      setSearch('');
      setTimeout(() => { setStatusMsg(null); if (onDone) onDone(); }, 1500);
      return;
    }

    // Doppelt-Check
    const existing = todayActivityEntries.find(a => a.activityId === selectedActivity.id);
    if (existing && onIncrementActivityEntry) {
      const choice = confirm(`„${selectedActivity.name}" ist heute schon eingetragen (${existing.durationMin} min, +${existing.kcal} kcal).\n\nOK = Dauer verdoppeln\nAbbrechen = neuer Eintrag`);
      if (choice) {
        await onIncrementActivityEntry(existing.id, existing.durationMin);
        setStatusMsg(`„${selectedActivity.name}" verdoppelt`);
        setSelectedActivity(null); setDuration(''); setSearch('');
        setTimeout(() => { setStatusMsg(null); if (onDone) onDone(); }, 1500);
        return;
      }
    }

    const kcal = calcActivityKcal(selectedActivity.met, currentWeight, dur);
    await onAddActivityEntry({
      id: crypto.randomUUID(),
      dateKey: dateKey || todayKey(),
      time: new Date().toISOString(),
      activityId: selectedActivity.id,
      activityName: selectedActivity.name,
      met: selectedActivity.met,
      durationMin: dur,
      weightKg: currentWeight,
      kcal,
    });
    setStatusMsg(`+${kcal} kcal · ${selectedActivity.name} eingetragen`);
    setSelectedActivity(null); setDuration(''); setSearch('');
    setTimeout(() => { setStatusMsg(null); if (onDone) onDone(); }, 1500);
  };

  return (
    <div style={{ marginTop: 16 }}>
      {selectedActivity ? (
        <div style={{ background: '#FAF6EC', borderRadius: 12, padding: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <div style={{ flex: 1 }}>
              {selectedActivity.isManual ? (
                <input value={selectedActivity.name} onChange={e => setSelectedActivity({ ...selectedActivity, name: e.target.value })}
                  placeholder="Name der Aktivität" autoFocus
                  style={{ fontFamily: 'Fraunces', fontSize: 18, fontWeight: 600, color: '#0D3B2E', border: 'none', background: 'transparent', padding: 0, width: '100%', outline: 'none' }} />
              ) : (
                <div style={{ fontFamily: 'Fraunces', fontSize: 18, fontWeight: 600, color: '#0D3B2E' }}>{selectedActivity.name}</div>
              )}
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                {selectedActivity.isManual ? 'Manuell · kcal direkt eingeben' : `MET ${selectedActivity.met} · ${currentWeight} kg`}
              </div>
            </div>
            <button onClick={() => { setSelectedActivity(null); setDuration(''); }} style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }}><X size={16} /></button>
          </div>
          <Field label={selectedActivity.isManual ? 'Verbrannte kcal gesamt' : 'Dauer (Minuten)'}>
            <input type="text" inputMode="numeric"
              placeholder={selectedActivity.isManual ? 'z.B. 400' : 'z.B. 30'}
              value={duration}
              onChange={e => { const v = e.target.value; if (v === '' || /^\d+$/.test(v)) setDuration(v); }}
              style={styles.input}
            />
          </Field>
          {!selectedActivity.isManual && duration && parseInt(duration, 10) > 0 && (
            <div style={{ background: 'rgba(13,59,46,0.08)', padding: '10px 14px', borderRadius: 8, marginTop: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', textTransform: 'uppercase', letterSpacing: 1 }}>Verbrennt</span>
              <span style={{ fontFamily: 'Fraunces', fontSize: 22, fontWeight: 600, color: '#0D3B2E' }} className="num">+{calcActivityKcal(selectedActivity.met, currentWeight, parseInt(duration, 10))} kcal</span>
            </div>
          )}
          <button style={{ ...styles.primary, marginTop: 16, opacity: duration && parseInt(duration, 10) > 0 ? 1 : 0.4 }}
            disabled={!duration || parseInt(duration, 10) < 1} onClick={handleAdd}>
            Eintragen
          </button>
        </div>
      ) : (
        <>
          <div style={{ position: 'relative' }}>
            <Search size={16} style={{ position: 'absolute', left: 14, top: 14, color: 'rgba(250,246,236,0.5)' }} />
            <input
              placeholder="Aktivität suchen..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ ...styles.input, paddingLeft: 40 }}
            />
          </div>
          <div style={{ marginTop: 8, maxHeight: 320, overflowY: 'auto' }}>
            {filtered.map(a => (
              <div
                key={a.id}
                onClick={() => setSelectedActivity(a)}
                style={{ ...styles.entryRow, cursor: 'pointer' }}
              >
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Fraunces', fontSize: 16, fontWeight: 500 }}>{a.name}</div>
                  <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E', marginTop: 2 }} className="num">MET {a.met}</div>
                </div>
                <div style={{ fontFamily: 'Inter', fontSize: 11, color: '#5C6B5E' }} className="num">
                  {calcActivityKcal(a.met, currentWeight, 30)} kcal/30min
                </div>
              </div>
            ))}
            {filtered.length === 0 && search && (
              <div style={{ padding: '16px 16px 8px', textAlign: 'center', fontFamily: 'Inter', fontSize: 13, color: 'rgba(250,246,236,0.6)' }}>
                Keine Aktivität gefunden.
              </div>
            )}
          </div>
          <div>
            {/* Manuell eintragen */}
            <button
              onClick={() => setSelectedActivity({ id: '__manual__', name: search || '', met: 0, isManual: true })}
              style={{
                background: 'transparent', color: 'rgba(250,246,236,0.7)',
                border: '1px dashed rgba(250,246,236,0.3)', borderRadius: 8,
                padding: '10px 14px', fontFamily: 'Inter', fontSize: 13,
                marginTop: 8, cursor: 'pointer', width: '100%',
              }}
            >
              + Manuell eintragen (Name + kcal)
            </button>
          </div>
        </>
      )}

      {statusMsg && (
        <div style={{
          marginTop: 16, padding: '12px 16px',
          background: 'rgba(45,106,82,0.25)', border: '1px solid rgba(74,132,114,0.5)',
          borderRadius: 8, fontFamily: 'Inter', fontSize: 13, color: '#FAF6EC',
        }}>
          {statusMsg}
        </div>
      )}
    </div>
  );
}

// === Movement (Bewegungs-Tab: Eingabe + Workouts + Timer) ===
function Movement({
  activities, workouts, currentWeight,
  onAddActivityEntry, onSaveActivity,
  onIncrementActivityEntry, todayActivityEntries = [],
  onUseWorkout, onDeleteWorkout, onRenameWorkout,
  onBack,
  // Timer-Props
  totalSeconds, setTotalSeconds, markerInterval, setMarkerInterval,
  transitionSeconds, setTransitionSeconds,
  running, paused, elapsed, finished,
  onStart, onStop, onTogglePause,
}) {
  const [tab, setTab] = useState('input'); // input | workouts | timer
  const [editingWorkout, setEditingWorkout] = useState(null);

  return (
    <div style={styles.page}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onBack}><ChevronLeft size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Bewegung</h1>
      </div>

      <div style={styles.segGroup}>
        <button style={{ ...styles.seg, ...(tab === 'input' ? styles.segActive : {}) }} onClick={() => setTab('input')}>Eintragen</button>
        <button style={{ ...styles.seg, ...(tab === 'workouts' ? styles.segActive : {}) }} onClick={() => setTab('workouts')}>Workouts</button>
        <button style={{ ...styles.seg, ...(tab === 'timer' ? styles.segActive : {}) }} onClick={() => setTab('timer')}>Timer</button>
      </div>

      {tab === 'input' && (
        <MovementInputArea
          activities={activities}
          currentWeight={currentWeight}
          onAddActivityEntry={onAddActivityEntry}
          onIncrementActivityEntry={onIncrementActivityEntry}
          todayActivityEntries={todayActivityEntries}
        />
      )}

      {tab === 'workouts' && (
        <div style={{ marginTop: 16 }}>
          {workouts.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '40px 20px', color: 'rgba(250,246,236,0.6)', fontFamily: 'Inter', fontSize: 14, lineHeight: 1.6 }}>
              Noch keine Workouts gespeichert.<br />
              Markier Aktivitäten auf der Heute-Seite und tippe „Als Workout speichern".
            </div>
          ) : (
            workouts.map(w => {
              const totalDur = w.items.reduce((s, i) => s + i.durationMin, 0);
              const totalKcal = w.items.reduce((s, i) => {
                const a = activities.find(x => x.id === i.activityId);
                if (!a) return s;
                return s + calcActivityKcal(a.met, currentWeight, i.durationMin);
              }, 0);
              return (
                <div key={w.id} style={{ ...styles.entryRow, flexDirection: 'column', alignItems: 'stretch', gap: 10, padding: 14 }}>
                  <div style={{ display: 'flex', alignItems: 'center' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: 'Fraunces', fontSize: 17, fontWeight: 500 }}>{w.name}</div>
                      <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E', marginTop: 2 }} className="num">
                        {w.items.length} Aktivitäten · {totalDur} min · +{totalKcal} kcal
                      </div>
                    </div>
                    <button style={{ ...styles.iconBtnSmall, color: '#5C6B5E' }} onClick={() => setEditingWorkout(w)}><Settings size={16} /></button>
                  </div>
                  <div style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C6B5E' }}>
                    {w.items.map(i => {
                      const a = activities.find(x => x.id === i.activityId);
                      return a ? `${i.durationMin} min ${a.name}` : '?';
                    }).join(' · ')}
                  </div>
                  <button
                    onClick={() => onUseWorkout(w)}
                    style={{
                      background: '#0D3B2E', color: '#FAF6EC', border: 'none',
                      borderRadius: 6, padding: '8px 12px', fontSize: 13, fontWeight: 600,
                      marginTop: 4, cursor: 'pointer',
                    }}
                  >
                    Eintragen
                  </button>
                </div>
              );
            })
          )}

          {editingWorkout && (
            <WorkoutEditor
              workout={editingWorkout}
              activities={activities}
              currentWeight={currentWeight}
              onRename={async (newName) => { await onRenameWorkout(editingWorkout.id, newName); setEditingWorkout(null); }}
              onDelete={async () => {
                if (confirm(`„${editingWorkout.name}" löschen?`)) {
                  await onDeleteWorkout(editingWorkout.id);
                  setEditingWorkout(null);
                }
              }}
              onCancel={() => setEditingWorkout(null)}
            />
          )}
        </div>
      )}

      {tab === 'timer' && (
        <div style={{ marginTop: 16 }}>
          <Timer
            embedded
            totalSeconds={totalSeconds}
            setTotalSeconds={setTotalSeconds}
            markerInterval={markerInterval}
            setMarkerInterval={setMarkerInterval}
            transitionSeconds={transitionSeconds}
            setTransitionSeconds={setTransitionSeconds}
            running={running}
            paused={paused}
            elapsed={elapsed}
            finished={finished}
            onStart={onStart}
            onStop={onStop}
            onTogglePause={onTogglePause}
          />
        </div>
      )}
    </div>
  );
}

// === Timer ===
const fmtTimer = (sec) => {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
};

function Timer({
  onBack, embedded = false,
  totalSeconds, setTotalSeconds,
  markerInterval, setMarkerInterval,
  transitionSeconds = 0, setTransitionSeconds = () => {},
  running, paused, elapsed, finished,
  onStart, onStop, onTogglePause,
}) {
  const [customInput, setCustomInput] = useState('');

  // === Setup-Phase ===
  if (!running && !finished) {
    const presets = [
      { label: '30s', sec: 30 },
      { label: '1min', sec: 60 },
      { label: '90s', sec: 90 },
      { label: '2min', sec: 120 },
      { label: '3min', sec: 180 },
      { label: '5min', sec: 300 },
      { label: '10min', sec: 600 },
      { label: '15min', sec: 900 },
    ];

    const applyCustom = () => {
      const n = parseInt(customInput, 10);
      if (n > 0 && n <= 9999) {
        setTotalSeconds(n * 60);
        setCustomInput('');
      }
    };

    return (
      <div style={embedded ? {} : styles.page}>
        {!embedded && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
            <button style={styles.iconBtn} onClick={onBack}><ChevronLeft size={20} /></button>
            <h1 style={{ ...styles.h1, margin: 0, fontSize: 24 }}>Timer</h1>
          </div>
        )}

        <div style={{ background: '#FAF6EC', borderRadius: 12, padding: 20, marginBottom: 16 }}>
          <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: '#5C6B5E' }}>Dauer</div>
          <div style={{ fontFamily: 'Fraunces', fontSize: 44, fontWeight: 600, color: '#0D3B2E', marginTop: 4 }} className="num">
            {fmtTimer(totalSeconds)}
          </div>
        </div>

        <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 8 }}>Schnellauswahl</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 16 }}>
          {presets.map(p => (
            <button
              key={p.sec}
              onClick={() => setTotalSeconds(p.sec)}
              style={{
                padding: '14px 8px',
                background: totalSeconds === p.sec ? '#FAF6EC' : 'rgba(250,246,236,0.08)',
                color: totalSeconds === p.sec ? '#0D3B2E' : '#FAF6EC',
                border: `1px solid ${totalSeconds === p.sec ? '#FAF6EC' : 'rgba(250,246,236,0.2)'}`,
                borderRadius: 8,
                fontFamily: 'Fraunces', fontSize: 15, fontWeight: 500,
              }}
            >
              {p.label}
            </button>
          ))}
        </div>

        <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 8 }}>Eigene Dauer (Minuten)</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 24 }}>
          <input
            type="number"
            inputMode="numeric"
            placeholder="z.B. 7"
            value={customInput}
            onChange={e => setCustomInput(e.target.value)}
            style={{ ...styles.input, flex: 1 }}
          />
          <button
            onClick={applyCustom}
            disabled={!customInput}
            style={{ ...styles.primary, marginTop: 0, width: 'auto', padding: '0 20px', opacity: customInput ? 1 : 0.4 }}
          >
            Setzen
          </button>
        </div>

        <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 8 }}>Marker-Intervall</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 16 }}>
          {[
            { label: 'Keine', val: 0 },
            { label: 'Alle 30s', val: 30 },
            { label: 'Alle 60s', val: 60 },
          ].map(o => (
            <button
              key={o.val}
              onClick={() => setMarkerInterval(o.val)}
              style={{
                padding: '14px 8px',
                background: markerInterval === o.val ? '#FAF6EC' : 'rgba(250,246,236,0.08)',
                color: markerInterval === o.val ? '#0D3B2E' : '#FAF6EC',
                border: `1px solid ${markerInterval === o.val ? '#FAF6EC' : 'rgba(250,246,236,0.2)'}`,
                borderRadius: 8,
                fontFamily: 'Inter', fontSize: 14, fontWeight: 500,
              }}
            >
              {o.label}
            </button>
          ))}
        </div>

        {markerInterval > 0 && (
          <>
            <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 8 }}>Übergang (Wechselzeit)</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 8 }}>
              {[
                { label: 'Aus', val: 0 },
                { label: '5s', val: 5 },
                { label: '10s', val: 10 },
              ].map(o => (
                <button
                  key={o.val}
                  onClick={() => setTransitionSeconds(o.val)}
                  style={{
                    padding: '14px 8px',
                    background: transitionSeconds === o.val ? '#FAF6EC' : 'rgba(250,246,236,0.08)',
                    color: transitionSeconds === o.val ? '#0D3B2E' : '#FAF6EC',
                    border: `1px solid ${transitionSeconds === o.val ? '#FAF6EC' : 'rgba(250,246,236,0.2)'}`,
                    borderRadius: 8,
                    fontFamily: 'Inter', fontSize: 14, fontWeight: 500,
                  }}
                >
                  {o.label}
                </button>
              ))}
            </div>
            {transitionSeconds > 0 && (() => {
              const intervals = Math.floor(totalSeconds / markerInterval);
              const transitions = Math.max(0, intervals - 1);
              const totalWithTransition = totalSeconds + transitions * transitionSeconds;
              return (
                <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(250,246,236,0.55)', marginBottom: 24, textAlign: 'center' }}>
                  Gesamt-Workout: {Math.floor(totalWithTransition / 60)}:{String(totalWithTransition % 60).padStart(2, '0')} min
                  &nbsp;·&nbsp;{intervals}× Übung à {markerInterval}s + {transitions}× Übergang à {transitionSeconds}s
                </div>
              );
            })()}
            {transitionSeconds === 0 && <div style={{ marginBottom: 16 }} />}
          </>
        )}

        <button style={styles.primary} onClick={onStart} disabled={totalSeconds <= 0}>
          Start
        </button>
      </div>
    );
  }

  // === Finished-Phase ===
  if (finished) {
    return (
      <div style={embedded
        ? { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '50vh', textAlign: 'center', paddingTop: 40 }
        : { ...styles.page, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '70vh', textAlign: 'center' }}>
        <div style={{ fontFamily: 'Fraunces', fontSize: 96, fontWeight: 600, color: '#FAF6EC', lineHeight: 1 }}>
          Fertig
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 14, color: 'rgba(250,246,236,0.7)', marginTop: 12 }} className="num">
          {fmtTimer(totalSeconds)}
        </div>
        <div style={{ display: 'flex', gap: 12, marginTop: 40, width: '100%', maxWidth: 320 }}>
          <button style={{ ...styles.secondary, flex: 1, marginTop: 0 }} onClick={onStop}>Neu</button>
          <button style={{ ...styles.primary, flex: 1, marginTop: 0 }} onClick={onStart}>Nochmal</button>
        </div>
      </div>
    );
  }

  // === Run-Phase ===
  const hasMarkers = markerInterval > 0;
  const hasTransition = hasMarkers && transitionSeconds > 0;
  const totalIntervals = hasMarkers ? Math.floor(totalSeconds / markerInterval) : 0;
  const totalTransitions = Math.max(0, totalIntervals - 1);
  const totalDuration = totalSeconds + totalTransitions * transitionSeconds;
  const remainingTotal = Math.max(0, totalDuration - elapsed);

  // Bestimme aktuelle Phase (Übung oder Übergang)
  let inTransition = false;
  let timeIntoPhase = 0;
  let phaseDuration = markerInterval;
  let completedMarkers = 0;

  if (hasMarkers) {
    // Zykluslänge = markerInterval + transitionSeconds
    const cycleLen = markerInterval + transitionSeconds;
    if (hasTransition) {
      const completeCycles = Math.floor(elapsed / cycleLen);
      const intoCycle = elapsed - completeCycles * cycleLen;
      if (intoCycle < markerInterval) {
        // Übungsphase
        inTransition = false;
        timeIntoPhase = intoCycle;
        phaseDuration = markerInterval;
        completedMarkers = completeCycles;
      } else {
        // Übergangsphase
        inTransition = true;
        timeIntoPhase = intoCycle - markerInterval;
        phaseDuration = transitionSeconds;
        completedMarkers = completeCycles + 1;
      }
    } else {
      completedMarkers = Math.floor(elapsed / markerInterval);
      timeIntoPhase = elapsed - completedMarkers * markerInterval;
      phaseDuration = markerInterval;
    }
  } else {
    timeIntoPhase = elapsed;
    phaseDuration = totalSeconds;
  }

  const remainingInPhase = Math.max(0, phaseDuration - timeIntoPhase);
  const displaySeconds = hasMarkers ? Math.ceil(remainingInPhase) : Math.ceil(remainingTotal);
  const displayProgress = hasMarkers ? (timeIntoPhase / phaseDuration) : (elapsed / totalDuration);
  const totalMarkers = totalIntervals;

  const inFinalCountdown = displaySeconds <= 5 && !inTransition;

  const radius = 130;
  const circumference = 2 * Math.PI * radius;
  const strokeOffset = circumference * (1 - displayProgress);

  return (
    <div style={embedded
      ? { display: 'flex', flexDirection: 'column' }
      : { ...styles.page, display: 'flex', flexDirection: 'column' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
        <button style={styles.iconBtn} onClick={onStop} aria-label="Beenden"><X size={20} /></button>
        <h1 style={{ ...styles.h1, margin: 0, fontSize: 18, color: inTransition ? '#E8A87C' : 'rgba(250,246,236,0.7)', flex: 1, transition: 'color 200ms ease' }}>
          {paused ? 'Pausiert' : inTransition ? '🔄 Wechsel' : 'Timer läuft'}
        </h1>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
        {hasMarkers ? (
          <div style={{
            width: 64, height: 64, borderRadius: '50%',
            background: 'rgba(250,246,236,0.1)',
            border: '1px solid rgba(250,246,236,0.25)',
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{ fontFamily: 'Fraunces', fontSize: 26, fontWeight: 600, color: '#FAF6EC', lineHeight: 1 }} className="num">
              {completedMarkers}
            </div>
            <div style={{ fontFamily: 'Inter', fontSize: 9, color: 'rgba(250,246,236,0.5)', marginTop: 2, textTransform: 'uppercase', letterSpacing: 0.8 }}>
              /{totalMarkers}
            </div>
          </div>
        ) : <div style={{ width: 64 }} />}

        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.5, color: inTransition ? '#E8A87C' : 'rgba(250,246,236,0.5)', transition: 'color 200ms ease' }}>
            {hasMarkers ? (inTransition ? 'Position wechseln' : 'Bis zum Marker') : 'Verbleibend'}
          </div>
        </div>

        <div style={{ width: 64 }} />
      </div>

      {/* Großer Ring + Zahl in der Mitte - GANZER BEREICH KLICKBAR FÜR PAUSE */}
      <div
        onClick={onTogglePause}
        style={{
          display: 'flex', justifyContent: 'center', alignItems: 'center',
          flex: 1, position: 'relative',
          opacity: paused ? 0.55 : 1,
          transition: 'opacity 200ms ease',
          cursor: 'pointer',
          userSelect: 'none',
          WebkitTapHighlightColor: 'transparent',
        }}
        role="button"
        aria-label={paused ? 'Weiter' : 'Pausieren'}
      >
        <svg width={radius * 2 + 30} height={radius * 2 + 30} style={{ transform: 'rotate(-90deg)' }}>
          <circle
            cx={radius + 15}
            cy={radius + 15}
            r={radius}
            fill="none"
            stroke="rgba(250,246,236,0.1)"
            strokeWidth={6}
          />
          <circle
            cx={radius + 15}
            cy={radius + 15}
            r={radius}
            fill="none"
            stroke={inTransition ? '#E8A87C' : (inFinalCountdown ? '#E8A89F' : '#FAF6EC')}
            strokeWidth={inFinalCountdown ? 8 : 6}
            strokeDasharray={circumference}
            strokeDashoffset={strokeOffset}
            strokeLinecap="round"
            style={{ transition: 'stroke 200ms ease, stroke-width 200ms ease' }}
          />
        </svg>

        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
        }}>
          {paused ? (
            <>
              <div style={{
                fontFamily: 'Fraunces', fontSize: 80, fontWeight: 500,
                color: '#FAF6EC', lineHeight: 1,
              }} className="num">
                {hasMarkers ? displaySeconds : fmtTimer(displaySeconds)}
              </div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(250,246,236,0.7)', marginTop: 12, textTransform: 'uppercase', letterSpacing: 1.5 }}>
                Tippen zum Fortsetzen
              </div>
            </>
          ) : inFinalCountdown && hasMarkers ? (
            <div style={{
              fontFamily: 'Fraunces',
              fontSize: 160, fontWeight: 600,
              color: '#E8A89F',
              lineHeight: 1,
              transition: 'all 200ms ease',
              textShadow: '0 0 30px rgba(232,168,159,0.4)',
            }} className="num">
              {displaySeconds}
            </div>
          ) : (
            <div style={{
              fontFamily: 'Fraunces',
              fontSize: hasMarkers ? 80 : 80, fontWeight: 500,
              color: '#FAF6EC',
              lineHeight: 1,
            }} className="num">
              {hasMarkers ? displaySeconds : fmtTimer(displaySeconds)}
            </div>
          )}
        </div>
      </div>

      {/* Gesamt-Restzeit unten */}
      <div style={{ textAlign: 'center', marginTop: 24, paddingTop: 16, borderTop: '1px solid rgba(250,246,236,0.1)' }}>
        <div style={{ fontFamily: 'Inter', fontSize: 11, textTransform: 'uppercase', letterSpacing: 1.2, color: 'rgba(250,246,236,0.5)' }}>
          Gesamt
        </div>
        <div style={{ fontFamily: 'Fraunces', fontSize: 22, fontWeight: 500, color: 'rgba(250,246,236,0.85)', marginTop: 4 }} className="num">
          {fmtTimer(Math.ceil(remainingTotal))} <span style={{ fontSize: 13, color: 'rgba(250,246,236,0.4)' }}>von {fmtTimer(totalSeconds)}</span>
        </div>
      </div>
    </div>
  );
}

// === NavBar ===
function NavBar({ current, onNav }) {
  const items = [
    { v: 'movement', icon: () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 5 Q9 3 12 3 Q15 3 15 5" />
        <rect x="8.5" y="5" width="7" height="2" rx="0.5" fill="currentColor" stroke="none" />
        <ellipse cx="12" cy="14" rx="6" ry="5.5" />
      </svg>
    ), l: 'Bewegung' },
    { v: 'dishes', icon: () => <span style={{ fontFamily: 'Fraunces', fontWeight: 700, fontSize: 16, lineHeight: 1 }}>♨</span>, l: 'Gerichte' },
    { v: 'today', icon: Calendar, l: 'Heute', center: true },
    { v: 'glossary', icon: BookOpen, l: 'Glossar' },
    { v: 'settings', icon: Settings, l: 'Mehr' },
  ];
  return (
    <div style={{
      position: 'sticky', bottom: 0, left: 0, right: 0,
      background: 'linear-gradient(to top, rgba(8,38,28,0.99) 0%, rgba(10,46,34,0.97) 100%)',
      backdropFilter: 'blur(16px)',
      borderTop: '1px solid rgba(250,246,236,0.08)',
      boxShadow: '0 -4px 24px rgba(0,0,0,0.25)',
      display: 'flex', justifyContent: 'space-around', alignItems: 'flex-start',
      padding: '8px 4px',
      paddingBottom: 'calc(8px + env(safe-area-inset-bottom, 0px))',
      paddingTop: '20px',
      marginTop: 'auto',
    }}>
      {items.map(({ v, icon: Icon, l, center }) => {
        const active = current === v;
        if (center) {
          // Heute — zentriert, leicht abgehoben
          return (
            <button key={v} onClick={() => onNav(v)} style={{
              background: 'none', border: 'none', display: 'flex', flexDirection: 'column',
              alignItems: 'center', gap: 5, padding: '0 12px',
              color: active ? '#FAF6EC' : 'rgba(250,246,236,0.65)',
              transform: 'translateY(-14px)',
              position: 'relative', cursor: 'pointer',
            }}>
              <div style={{
                width: 52, height: 52, borderRadius: '50%',
                background: active
                  ? 'radial-gradient(circle at 35% 30%, #2D6A52 0%, #1A5340 70%)'
                  : 'rgba(20,60,46,0.95)',
                border: `2px solid ${active ? '#90C8A8' : 'rgba(250,246,236,0.2)'}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: active
                  ? '0 6px 20px rgba(0,0,0,0.45), 0 0 24px rgba(144,200,168,0.25)'
                  : '0 4px 12px rgba(0,0,0,0.35)',
                transition: 'all 250ms cubic-bezier(0.34, 1.56, 0.64, 1)',
              }}>
                <Icon size={active ? 24 : 22} />
              </div>
              <span style={{
                fontFamily: 'Inter', fontSize: 10,
                fontWeight: active ? 700 : 500,
                letterSpacing: active ? 0.3 : 0,
                marginTop: -2,
                transition: 'all 200ms ease',
              }}>{l}</span>
            </button>
          );
        }
        return (
          <button key={v} onClick={() => onNav(v)} style={{
            background: 'none', border: 'none', display: 'flex', flexDirection: 'column',
            alignItems: 'center', gap: 4, padding: '0 14px',
            color: active ? '#FAF6EC' : 'rgba(250,246,236,0.45)',
            cursor: 'pointer', position: 'relative',
            transition: 'color 200ms ease',
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              width: 40, height: 28, borderRadius: 9,
              background: active ? 'rgba(144,200,168,0.14)' : 'transparent',
              transition: 'background 200ms ease',
            }}>
              <div style={{
                transform: active ? 'scale(1.08)' : 'scale(1)',
                transition: 'transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1)',
                display: 'flex',
              }}>
                <Icon size={20} />
              </div>
            </div>
            <span style={{
              fontFamily: 'Inter', fontSize: 10,
              fontWeight: active ? 700 : 500,
              transition: 'font-weight 200ms ease',
            }}>{l}</span>
            {/* Aktiv-Punkt */}
            <div style={{
              width: 4, height: 4, borderRadius: '50%', marginTop: 2,
              background: active ? '#90C8A8' : 'transparent',
              transition: 'background 200ms ease',
            }} />
          </button>
        );
      })}
    </div>
  );
}

// === Field Wrapper ===
function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontFamily: 'Inter', fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1, color: 'rgba(250,246,236,0.65)', marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}
